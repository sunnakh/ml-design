<svg width="100%" viewBox="0 0 680 310" role="img"><title>Data quality checkpoints in the PayCo pipeline</title><desc>Sources flow to pipelines, feature store, and serving. Each stage has checks: schema and volume at sources, duplicates and units in pipelines, freshness at the feature store, nulls and ranges at serving. The feature store also feeds a training set with a pre-train gate, and a train-serve skew check compares training data to serving.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-coral"><rect x="40" y="40" width="120" height="28" rx="4" stroke-width="0.5"/><text class="ts" x="100" y="54" text-anchor="middle" dominant-baseline="central">Schema, volume</text></g>
<g class="c-coral"><rect x="190" y="40" width="130" height="28" rx="4" stroke-width="0.5"/><text class="ts" x="255" y="54" text-anchor="middle" dominant-baseline="central">Dupes, units</text></g>
<g class="c-coral"><rect x="350" y="40" width="130" height="28" rx="4" stroke-width="0.5"/><text class="ts" x="415" y="54" text-anchor="middle" dominant-baseline="central">Freshness</text></g>
<g class="c-coral"><rect x="510" y="40" width="130" height="28" rx="4" stroke-width="0.5"/><text class="ts" x="575" y="54" text-anchor="middle" dominant-baseline="central">Nulls, ranges</text></g>
<line class="leader" x1="100" y1="70" x2="100" y2="88"/>
<line class="leader" x1="255" y1="70" x2="255" y2="88"/>
<line class="leader" x1="415" y1="70" x2="415" y2="88"/>
<line class="leader" x1="575" y1="70" x2="575" y2="88"/>
<g class="c-gray"><rect x="40" y="90" width="120" height="56" rx="4" stroke-width="0.5"/><text class="th" x="100" y="109" text-anchor="middle" dominant-baseline="central">Sources</text><text class="ts" x="100" y="129" text-anchor="middle" dominant-baseline="central">Apps, network</text></g>
<g class="c-gray"><rect x="190" y="90" width="130" height="56" rx="4" stroke-width="0.5"/><text class="th" x="255" y="109" text-anchor="middle" dominant-baseline="central">Pipelines</text><text class="ts" x="255" y="129" text-anchor="middle" dominant-baseline="central">Stream + batch</text></g>
<g class="c-gray"><rect x="350" y="90" width="130" height="56" rx="4" stroke-width="0.5"/><text class="th" x="415" y="109" text-anchor="middle" dominant-baseline="central">Feature store</text><text class="ts" x="415" y="129" text-anchor="middle" dominant-baseline="central">Online, offline</text></g>
<g class="c-gray"><rect x="510" y="90" width="130" height="56" rx="4" stroke-width="0.5"/><text class="th" x="575" y="109" text-anchor="middle" dominant-baseline="central">Serving</text><text class="ts" x="575" y="129" text-anchor="middle" dominant-baseline="central">Request payload</text></g>
<line class="arr" x1="162" y1="118" x2="186" y2="118" marker-end="url(#arrow)"/>
<line class="arr" x1="322" y1="118" x2="346" y2="118" marker-end="url(#arrow)"/>
<line class="arr" x1="482" y1="118" x2="506" y2="118" marker-end="url(#arrow)"/>
<line class="arr" x1="415" y1="148" x2="415" y2="216" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="350" y="220" width="130" height="56" rx="4" stroke-width="0.5"/><text class="th" x="415" y="239" text-anchor="middle" dominant-baseline="central">Training set</text><text class="ts" x="415" y="259" text-anchor="middle" dominant-baseline="central">Pre-train gate</text></g>
<path class="arr" d="M482 248 H575 V150" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="492" y="266" dominant-baseline="central">Train-serve skew</text>
</svg>