<svg width="100%" viewBox="0 0 680 320" role="img"><title>Input vs output shift triage</title><desc>Two by two matrix. Input shifted and output shifted: model is reacting, investigate. Input shifted and output stable: probably harmless. Input stable and output shifted: look at the model or config. Both stable: not proof of health, concept drift hides here.</desc>
<text class="th" x="282.5" y="52" text-anchor="middle" dominant-baseline="central">Output shifted</text>
<text class="th" x="527.5" y="52" text-anchor="middle" dominant-baseline="central">Output stable</text>
<text class="th" x="40" y="115" dominant-baseline="central">Input shifted</text>
<text class="th" x="40" y="225" dominant-baseline="central">Input stable</text>
<g class="c-coral"><rect x="170" y="70" width="225" height="90" rx="4" stroke-width="0.5"/><text class="th" x="282.5" y="96" text-anchor="middle" dominant-baseline="central">Model is reacting</text><text class="ts" x="282.5" y="120" text-anchor="middle" dominant-baseline="central">Real change or bug:</text><text class="ts" x="282.5" y="138" text-anchor="middle" dominant-baseline="central">find which features</text></g>
<g class="c-gray"><rect x="415" y="70" width="225" height="90" rx="4" stroke-width="0.5"/><text class="th" x="527.5" y="96" text-anchor="middle" dominant-baseline="central">Probably harmless</text><text class="ts" x="527.5" y="120" text-anchor="middle" dominant-baseline="central">Features model barely uses</text><text class="ts" x="527.5" y="138" text-anchor="middle" dominant-baseline="central">or shifts cancel out</text></g>
<g class="c-coral"><rect x="170" y="180" width="225" height="90" rx="4" stroke-width="0.5"/><text class="th" x="282.5" y="206" text-anchor="middle" dominant-baseline="central">Look at the model</text><text class="ts" x="282.5" y="230" text-anchor="middle" dominant-baseline="central">New version, threshold,</text><text class="ts" x="282.5" y="248" text-anchor="middle" dominant-baseline="central">unmonitored feature</text></g>
<g class="c-teal"><rect x="415" y="180" width="225" height="90" rx="4" stroke-width="0.5"/><text class="th" x="527.5" y="206" text-anchor="middle" dominant-baseline="central">Not proof of health</text><text class="ts" x="527.5" y="230" text-anchor="middle" dominant-baseline="central">Concept drift hides here:</text><text class="ts" x="527.5" y="248" text-anchor="middle" dominant-baseline="central">needs labels</text></g>
<g class="c-coral"><rect x="40" y="292" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="60" y="298" dominant-baseline="central">Investigate now</text>
<g class="c-gray"><rect x="180" y="292" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="200" y="298" dominant-baseline="central">Lower priority</text>
<g class="c-teal"><rect x="320" y="292" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="340" y="298" dominant-baseline="central">Blind spot, wait for labels</text>
</svg>