<svg width="100%" viewBox="0 0 680 350" role="img"><title>Concept drift patterns</title><desc>Four panels over time. Sudden: an abrupt step from concept A to B. Gradual: old and new concepts alternate, with B becoming more common. Incremental: a slow continuous ramp. Recurring: concepts alternate periodically, like holiday patterns.</desc>
<rect class="box" x="40" y="40" width="280" height="110" rx="4" stroke-width="0.5"/>
<text class="th" x="60" y="62" dominant-baseline="central">Sudden</text><text class="ts" x="300" y="62" text-anchor="end" dominant-baseline="central">New attack tool</text>
<path d="M60 90 H170 V130 H300" fill="none" stroke="#D85A30" stroke-width="2"/>
<rect class="box" x="360" y="40" width="280" height="110" rx="4" stroke-width="0.5"/>
<text class="th" x="380" y="62" dominant-baseline="central">Gradual</text><text class="ts" x="620" y="62" text-anchor="end" dominant-baseline="central">Old and new mixed</text>
<g fill="#D85A30"><circle cx="380" cy="90" r="3"/><circle cx="400" cy="90" r="3"/><circle cx="420" cy="90" r="3"/><circle cx="440" cy="130" r="3"/><circle cx="460" cy="90" r="3"/><circle cx="480" cy="90" r="3"/><circle cx="500" cy="130" r="3"/><circle cx="520" cy="90" r="3"/><circle cx="540" cy="130" r="3"/><circle cx="560" cy="130" r="3"/><circle cx="580" cy="90" r="3"/><circle cx="600" cy="130" r="3"/><circle cx="620" cy="130" r="3"/></g>
<rect class="box" x="40" y="190" width="280" height="110" rx="4" stroke-width="0.5"/>
<text class="th" x="60" y="212" dominant-baseline="central">Incremental</text><text class="ts" x="300" y="212" text-anchor="end" dominant-baseline="central">Slow adaptation</text>
<path d="M60 240 L100 240 L260 280 L300 280" fill="none" stroke="#D85A30" stroke-width="2"/>
<rect class="box" x="360" y="190" width="280" height="110" rx="4" stroke-width="0.5"/>
<text class="th" x="380" y="212" dominant-baseline="central">Recurring</text><text class="ts" x="620" y="212" text-anchor="end" dominant-baseline="central">Holiday patterns</text>
<path d="M380 240 C400 240, 400 280, 420 280 C440 280, 440 240, 460 240 C480 240, 480 280, 500 280 C520 280, 520 240, 540 240 C560 240, 560 280, 580 280 C600 280, 600 240, 620 240" fill="none" stroke="#D85A30" stroke-width="2"/>
<text class="ts" x="40" y="328" dominant-baseline="central">Line height = which concept P(y | x) holds (upper = old, lower = new). Time runs left to right.</text>
</svg>