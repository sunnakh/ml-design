<g class="c-gray"><rect x="232.5" y="370" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="332.5" y="389" text-anchor="middle" dominant-baseline="central">Threshold</text><text class="ts" x="332.5" y="409" text-anchor="middle" dominant-baseline="central">One knob, three costs</text></g>
<g class="c-coral"><rect x="40" y="448" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="60" y="454" dominant-baseline="central">Business KPI ($)</text>
<g class="c-teal"><rect x="190" y="448" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="210" y="454" dominant-baseline="central">Model / decision metric</text>
<g class="c-gray"><rect x="380" y="448" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="400" y="454" dominant-baseline="central">Policy lever</text>
