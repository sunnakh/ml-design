<svg width="100%" viewBox="0 0 680 340" role="img"><title>Choosing a drift method by data type</title><desc>Compare current vs reference, branching by data type: numeric uses Wasserstein and KS D or PSI; categorical uses PSI, JS and unseen share; rates use two-proportion z and control charts; joint or high-dimensional uses domain classifier and MMD. All converge to reporting effect size gated by a practical threshold.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="240" y="40" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="59" text-anchor="middle" dominant-baseline="central">Current vs reference</text><text class="ts" x="340" y="79" text-anchor="middle" dominant-baseline="central">What data type?</text></g>
<path class="arr" d="M340 98 V122 H110 V146" fill="none" marker-end="url(#arrow)"/>
<path class="arr" d="M263 122 V146" fill="none" marker-end="url(#arrow)"/>
