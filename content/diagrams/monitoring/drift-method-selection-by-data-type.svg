<g class="c-teal"><rect x="193" y="150" width="140" height="72" rx="4" stroke-width="0.5"/><text class="th" x="263" y="170" text-anchor="middle" dominant-baseline="central">Categorical</text><text class="ts" x="263" y="192" text-anchor="middle" dominant-baseline="central">PSI, JS</text><text class="ts" x="263" y="208" text-anchor="middle" dominant-baseline="central">Unseen share</text></g>
<g class="c-teal"><rect x="346" y="150" width="140" height="72" rx="4" stroke-width="0.5"/><text class="th" x="416" y="170" text-anchor="middle" dominant-baseline="central">Rates</text><text class="ts" x="416" y="192" text-anchor="middle" dominant-baseline="central">Two-proportion z</text><text class="ts" x="416" y="208" text-anchor="middle" dominant-baseline="central">Control charts</text></g>
<g class="c-teal"><rect x="499" y="150" width="140" height="72" rx="4" stroke-width="0.5"/><text class="th" x="569" y="170" text-anchor="middle" dominant-baseline="central">Joint, high-dim</text><text class="ts" x="569" y="192" text-anchor="middle" dominant-baseline="central">Domain classifier</text><text class="ts" x="569" y="208" text-anchor="middle" dominant-baseline="central">MMD, embeddings</text></g>
