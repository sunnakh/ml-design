<svg width="100%" viewBox="0 0 680 300" role="img"><title>Chargeback maturity curve</title><desc>Cumulative share of chargebacks arrived by days since transaction: about 30 percent by day 7, 55 percent by day 14, 80 percent by day 30, 95 percent by day 60, 99 percent by day 90.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="70" y="60" text-anchor="end" dominant-baseline="central">100%</text>
<text class="ts" x="70" y="150" text-anchor="end" dominant-baseline="central">50%</text>
<text class="ts" x="70" y="240" text-anchor="end" dominant-baseline="central">0%</text>
<line class="leader" x1="80" y1="60" x2="620" y2="60"/>
<line class="leader" x1="80" y1="150" x2="620" y2="150"/>
<line x1="485" y1="60" x2="485" y2="240" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 4"/>
<text class="ts" x="485" y="44" text-anchor="middle" dominant-baseline="central">90-day label horizon</text>
<polyline points="80,240 95,215 111.5,186 127,162 143,141 170,117 215,96 260,84 350,69 420,64 485,61.8 620,60" fill="none" stroke="#1D9E75" stroke-width="2"/>
<circle cx="143" cy="141" r="4" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<text class="ts" x="134" y="128" text-anchor="end" dominant-baseline="central">Day 14: 55%</text>
<circle cx="215" cy="96" r="4" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<text class="ts" x="226" y="114" dominant-baseline="central">Day 30: 80%</text>
<text class="ts" x="160" y="222" text-anchor="middle" dominant-baseline="central">Immature zone</text>
<line class="arr" x1="80" y1="240" x2="636" y2="240" marker-end="url(#arrow)"/>
<text class="ts" x="80" y="256" text-anchor="middle" dominant-baseline="central">0</text>
<text class="ts" x="215" y="256" text-anchor="middle" dominant-baseline="central">30</text>
<text class="ts" x="350" y="256" text-anchor="middle" dominant-baseline="central">60</text>
<text class="ts" x="485" y="256" text-anchor="middle" dominant-baseline="central">90</text>
<text class="ts" x="620" y="256" text-anchor="middle" dominant-baseline="central">120</text>
<text class="ts" x="620" y="280" text-anchor="end" dominant-baseline="central">Days since transaction</text>
</svg>