<g class="c-coral"><rect x="288" y="150" width="104" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="169" text-anchor="middle" dominant-baseline="central">World shifts</text><text class="ts" x="340" y="189" text-anchor="middle" dominant-baseline="central">Fraud adapts</text></g>
<g class="c-coral"><rect x="412" y="150" width="104" height="56" rx="4" stroke-width="0.5"/><text class="th" x="464" y="169" text-anchor="middle" dominant-baseline="central">Bad threshold</text><text class="ts" x="464" y="189" text-anchor="middle" dominant-baseline="central">Blocks spike</text></g>
