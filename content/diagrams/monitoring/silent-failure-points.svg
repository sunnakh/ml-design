<g class="c-gray"><rect x="536" y="40" width="104" height="56" rx="4" stroke-width="0.5"/><text class="th" x="588" y="59" text-anchor="middle" dominant-baseline="central">Outcome</text><text class="ts" x="588" y="79" text-anchor="middle" dominant-baseline="central">Chargeback</text></g>
<line class="arr" x1="146" y1="68" x2="160" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="270" y1="68" x2="284" y2="68" marker-end="url(#arrow)"/>
