<svg width="100%" viewBox="0 0 680 320" role="img"><title>Where PayCo fails silently</title><desc>PayCo pipeline from transaction to features, model, decision, outcome. Below each stage a silent failure: stale feature, world shifts, bad threshold, label lag. The service dashboard shows everything healthy.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="40" width="104" height="56" rx="4" stroke-width="0.5"/><text class="th" x="92" y="59" text-anchor="middle" dominant-baseline="central">Transaction</text><text class="ts" x="92" y="79" text-anchor="middle" dominant-baseline="central">Card swipe</text></g>
<g class="c-gray"><rect x="164" y="40" width="104" height="56" rx="4" stroke-width="0.5"/><text class="th" x="216" y="59" text-anchor="middle" dominant-baseline="central">Features</text><text class="ts" x="216" y="79" text-anchor="middle" dominant-baseline="central">Velocity, geo</text></g>
<g class="c-gray"><rect x="288" y="40" width="104" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="59" text-anchor="middle" dominant-baseline="central">Model</text><text class="ts" x="340" y="79" text-anchor="middle" dominant-baseline="central">GBDT score</text></g>
