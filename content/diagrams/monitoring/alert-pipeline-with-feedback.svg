<svg width="100%" viewBox="0 0 680 190" role="img"><title>Alert pipeline</title><desc>Detectors fire, alerts are grouped, enriched with context, routed by owner and severity, then handled by a human or automation. A feedback loop labels whether each alert was useful and tunes the detectors.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="40" width="104" height="56" rx="4" stroke-width="0.5"/><text class="th" x="92" y="59" text-anchor="middle" dominant-baseline="central">Detectors</text><text class="ts" x="92" y="79" text-anchor="middle" dominant-baseline="central">Rules fire</text></g>
<g class="c-gray"><rect x="164" y="40" width="104" height="56" rx="4" stroke-width="0.5"/><text class="th" x="216" y="59" text-anchor="middle" dominant-baseline="central">Group</text><text class="ts" x="216" y="79" text-anchor="middle" dominant-baseline="central">Dedupe</text></g>
<g class="c-gray"><rect x="288" y="40" width="104" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="59" text-anchor="middle" dominant-baseline="central">Enrich</text><text class="ts" x="340" y="79" text-anchor="middle" dominant-baseline="central">Add context</text></g>
<g class="c-gray"><rect x="412" y="40" width="104" height="56" rx="4" stroke-width="0.5"/><text class="th" x="464" y="59" text-anchor="middle" dominant-baseline="central">Route</text><text class="ts" x="464" y="79" text-anchor="middle" dominant-baseline="central">By owner</text></g>
<g class="c-gray"><rect x="536" y="40" width="104" height="56" rx="4" stroke-width="0.5"/><text class="th" x="588" y="59" text-anchor="middle" dominant-baseline="central">Respond</text><text class="ts" x="588" y="79" text-anchor="middle" dominant-baseline="central">Human or auto</text></g>
<line class="arr" x1="146" y1="68" x2="160" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="270" y1="68" x2="284" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="394" y1="68" x2="408" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="518" y1="68" x2="532" y2="68" marker-end="url(#arrow)"/>
<path d="M588 98 V132 H92 V102" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="150" text-anchor="middle" dominant-baseline="central">Feedback: was it useful? Tune or retire the rule</text>
</svg>