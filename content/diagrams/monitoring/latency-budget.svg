<text class="ts" x="450" y="182" text-anchor="middle" dominant-baseline="central">40</text>
<text class="ts" x="540" y="182" text-anchor="middle" dominant-baseline="central">50</text>
<text class="ts" x="630" y="182" text-anchor="middle" dominant-baseline="central">60 ms</text>
<g class="c-coral"><rect x="40" y="206" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="60" y="212" dominant-baseline="central">Feature fetch</text>
<g class="c-gray"><rect x="170" y="206" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="190" y="212" dominant-baseline="central">Network, model, rules</text>
