<svg width="100%" viewBox="0 0 680 420" role="img"><title>ML monitoring layers</title><desc>Five monitoring layers from top to bottom: business KPIs, model quality, drift, data quality, system health, each with example signals.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
