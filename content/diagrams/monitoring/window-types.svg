<svg width="100%" viewBox="0 0 680 330" role="img"><title>Window types against traffic</title><desc>Traffic is high by day and low at night. Tumbling windows are fixed back-to-back hours. Sliding windows overlap. Count-based windows each hold 50k events, so they stretch wide at night and shrink during busy periods.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="40" y="62" dominant-baseline="central">Traffic</text>
<g class="c-gray"><rect x="170" y="44" width="15" height="36" stroke-width="0.5"/><rect x="189.6" y="46" width="15" height="34" stroke-width="0.5"/><rect x="209.2" y="48" width="15" height="32" stroke-width="0.5"/><rect x="228.7" y="54" width="15" height="26" stroke-width="0.5"/><rect x="248.3" y="62" width="15" height="18" stroke-width="0.5"/><rect x="267.9" y="68" width="15" height="12" stroke-width="0.5"/><rect x="287.5" y="71" width="15" height="9" stroke-width="0.5"/><rect x="307.1" y="73" width="15" height="7" stroke-width="0.5"/><rect x="326.7" y="74" width="15" height="6" stroke-width="0.5"/><rect x="346.2" y="74" width="15" height="6" stroke-width="0.5"/><rect x="365.8" y="74" width="15" height="6" stroke-width="0.5"/><rect x="385.4" y="73" width="15" height="7" stroke-width="0.5"/><rect x="405" y="72" width="15" height="8" stroke-width="0.5"/><rect x="424.6" y="71" width="15" height="9" stroke-width="0.5"/><rect x="444.2" y="70" width="15" height="10" stroke-width="0.5"/><rect x="463.7" y="68" width="15" height="12" stroke-width="0.5"/><rect x="483.3" y="65" width="15" height="15" stroke-width="0.5"/><rect x="502.9" y="60" width="15" height="20" stroke-width="0.5"/><rect x="522.5" y="54" width="15" height="26" stroke-width="0.5"/><rect x="542.1" y="50" width="15" height="30" stroke-width="0.5"/><rect x="561.7" y="46" width="15" height="34" stroke-width="0.5"/><rect x="581.2" y="44" width="15" height="36" stroke-width="0.5"/><rect x="600.8" y="44" width="15" height="36" stroke-width="0.5"/><rect x="620.4" y="45" width="15" height="35" stroke-width="0.5"/></g>
<text class="ts" x="40" y="125" dominant-baseline="central">Tumbling</text>
<g class="c-teal"><rect x="170" y="110" width="113" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="226.5" y="125" text-anchor="middle" dominant-baseline="central">1 h</text><rect x="287.5" y="110" width="113" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="344" y="125" text-anchor="middle" dominant-baseline="central">1 h</text><rect x="405" y="110" width="113" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="461.5" y="125" text-anchor="middle" dominant-baseline="central">1 h</text><rect x="522.5" y="110" width="113" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="579" y="125" text-anchor="middle" dominant-baseline="central">1 h</text></g>
<text class="ts" x="40" y="185" dominant-baseline="central">Sliding</text>
