<svg width="100%" viewBox="0 0 680 270" role="img"><title>Deployment and serving subtopics</title><desc>Six subtopics in three columns: prediction mode and cloud vs edge; latency optimization and scaling; rollout strategy and packaging with CI/CD.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
