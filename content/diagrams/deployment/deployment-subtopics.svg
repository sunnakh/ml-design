<text class="th" x="50" y="54" dominant-baseline="central">Deployment and serving</text>
<g class="node c-teal"><rect x="50" y="78" width="180" height="60" rx="4" stroke-width="0.5"/><text class="th" x="140" y="98" text-anchor="middle" dominant-baseline="central">Prediction mode</text><text class="ts" x="140" y="120" text-anchor="middle" dominant-baseline="central">Batch, online, streaming</text></g>
<g class="node c-teal"><rect x="250" y="78" width="180" height="60" rx="4" stroke-width="0.5"/><text class="th" x="340" y="98" text-anchor="middle" dominant-baseline="central">Latency optimization</text><text class="ts" x="340" y="120" text-anchor="middle" dominant-baseline="central">Quantize, distill, batch</text></g>
<g class="node c-teal"><rect x="450" y="78" width="180" height="60" rx="4" stroke-width="0.5"/><text class="th" x="540" y="98" text-anchor="middle" dominant-baseline="central">Rollout strategy</text><text class="ts" x="540" y="120" text-anchor="middle" dominant-baseline="central">Shadow, canary, A/B</text></g>
<g class="node c-teal"><rect x="50" y="158" width="180" height="60" rx="4" stroke-width="0.5"/><text class="th" x="140" y="178" text-anchor="middle" dominant-baseline="central">Cloud vs edge</text><text class="ts" x="140" y="200" text-anchor="middle" dominant-baseline="central">Where model runs</text></g>
<g class="node c-teal"><rect x="250" y="158" width="180" height="60" rx="4" stroke-width="0.5"/><text class="th" x="340" y="178" text-anchor="middle" dominant-baseline="central">Scaling</text><text class="ts" x="340" y="200" text-anchor="middle" dominant-baseline="central">Autoscale, cache, shard</text></g>
