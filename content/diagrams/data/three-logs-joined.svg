<svg width="100%" viewBox="0 0 680 290" role="img"><title>Three logs joined into training data</title><desc>Behavioral events, the prediction log, and outcome events are joined on transaction ID to form training rows of features plus label.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="40" y="40" width="210" height="56" rx="4" stroke-width="0.5"/><text class="th" x="145" y="58" text-anchor="middle" dominant-baseline="central">Behavioral events</text><text class="ts" x="145" y="80" text-anchor="middle" dominant-baseline="central">Login, device, IP</text></g>
<g class="c-teal"><rect x="40" y="120" width="210" height="56" rx="4" stroke-width="0.5"/><text class="th" x="145" y="138" text-anchor="middle" dominant-baseline="central">Prediction log</text><text class="ts" x="145" y="160" text-anchor="middle" dominant-baseline="central">Features, score, model v</text></g>
<g class="c-teal"><rect x="40" y="200" width="210" height="56" rx="4" stroke-width="0.5"/><text class="th" x="145" y="218" text-anchor="middle" dominant-baseline="central">Outcome events</text><text class="ts" x="145" y="240" text-anchor="middle" dominant-baseline="central">Chargeback, +30-90 days</text></g>
<g class="c-gray"><rect x="310" y="110" width="150" height="76" rx="4" stroke-width="0.5"/><text class="th" x="385" y="137" text-anchor="middle" dominant-baseline="central">Join</text><text class="ts" x="385" y="159" text-anchor="middle" dominant-baseline="central">on transaction_id</text></g>
<g class="c-gray"><rect x="500" y="110" width="140" height="76" rx="4" stroke-width="0.5"/><text class="th" x="570" y="137" text-anchor="middle" dominant-baseline="central">Training row</text><text class="ts" x="570" y="159" text-anchor="middle" dominant-baseline="central">Features + label</text></g>
<line class="arr" x1="252" y1="72" x2="306" y2="126" marker-end="url(#arrow)"/>
<line class="arr" x1="252" y1="148" x2="306" y2="148" marker-end="url(#arrow)"/>
<line class="arr" x1="252" y1="224" x2="306" y2="170" marker-end="url(#arrow)"/>
<line class="arr" x1="462" y1="148" x2="496" y2="148" marker-end="url(#arrow)"/>
</svg>