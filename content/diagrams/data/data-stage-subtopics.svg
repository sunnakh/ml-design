<text class="th" x="56" y="280" dominant-baseline="central">Cross-cutting risks</text>
<g class="node c-coral"><rect x="52" y="302" width="135" height="44" rx="4" stroke-width="0.5"/><text class="th" x="119.5" y="324" text-anchor="middle" dominant-baseline="central">Data leakage</text></g>
<g class="node c-coral"><rect x="198" y="302" width="135" height="44" rx="4" stroke-width="0.5"/><text class="th" x="265.5" y="324" text-anchor="middle" dominant-baseline="central">Train-serve skew</text></g>
