<svg width="100%" viewBox="0 0 680 300" role="img"><title>Prediction moment timeline</title><desc>A timeline with the prediction moment T. Values available before T, such as the one-hour window and the nightly batch feature, are allowed. Values after T, such as the chargeback and the account frozen status, are forbidden.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="400" y="36" text-anchor="middle" dominant-baseline="central">Prediction moment T (14:03)</text>
<line x1="400" y1="50" x2="400" y2="236" stroke="var(--text-secondary)" stroke-width="1" stroke-dasharray="4 3"/>
<line class="arr" x1="40" y1="150" x2="640" y2="150" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="268" y="80" width="124" height="52" rx="4" stroke-width="0.5"/><text class="th" x="330" y="97" text-anchor="middle" dominant-baseline="central">1h window</text><text class="ts" x="330" y="117" text-anchor="middle" dominant-baseline="central">13:03 to 14:03</text></g>
<g class="c-teal"><rect x="60" y="170" width="190" height="52" rx="4" stroke-width="0.5"/><text class="th" x="155" y="187" text-anchor="middle" dominant-baseline="central">Nightly batch</text><text class="ts" x="155" y="207" text-anchor="middle" dominant-baseline="central">Available 05:00</text></g>
<g class="c-coral"><rect x="420" y="80" width="210" height="52" rx="4" stroke-width="0.5"/><text class="th" x="525" y="97" text-anchor="middle" dominant-baseline="central">Chargeback</text><text class="ts" x="525" y="117" text-anchor="middle" dominant-baseline="central">Arrives T + 45 days</text></g>
<g class="c-coral"><rect x="420" y="170" width="210" height="52" rx="4" stroke-width="0.5"/><text class="th" x="525" y="187" text-anchor="middle" dominant-baseline="central">Account frozen</text><text class="ts" x="525" y="207" text-anchor="middle" dominant-baseline="central">Status set T + 2 days</text></g>
<g class="c-teal"><rect x="40" y="262" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="60" y="268" dominant-baseline="central">Available before T: allowed</text>
<g class="c-coral"><rect x="300" y="262" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="320" y="268" dominant-baseline="central">After T: forbidden as a feature</text>
</svg>