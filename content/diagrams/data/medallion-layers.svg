<svg width="100%" viewBox="0 0 680 270" role="img"><title>Medallion data layers with orchestration</title><desc>Bronze raw immutable data flows to silver cleaned data, then to gold features and training sets. An orchestrator such as Airflow or Dagster schedules and manages all three layers.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="40" y="50" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="125" y="70" text-anchor="middle" dominant-baseline="central">Bronze: raw</text><text class="ts" x="125" y="92" text-anchor="middle" dominant-baseline="central">As received, immutable</text></g>
<g class="c-teal"><rect x="255" y="50" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="340" y="70" text-anchor="middle" dominant-baseline="central">Silver: clean</text><text class="ts" x="340" y="92" text-anchor="middle" dominant-baseline="central">Deduped, typed, UTC</text></g>
<g class="c-teal"><rect x="470" y="50" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="555" y="70" text-anchor="middle" dominant-baseline="central">Gold: features</text><text class="ts" x="555" y="92" text-anchor="middle" dominant-baseline="central">Aggregates, train sets</text></g>
<line class="arr" x1="212" y1="80" x2="251" y2="80" marker-end="url(#arrow)"/>
<line class="arr" x1="427" y1="80" x2="466" y2="80" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="170" width="600" height="56" rx="4" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="340" y="188" text-anchor="middle" dominant-baseline="central">Orchestrator (Airflow, Dagster)</text><text class="ts" x="340" y="210" text-anchor="middle" dominant-baseline="central">Schedules, dependencies, retries, backfills</text></g>
<line x1="125" y1="168" x2="125" y2="114" stroke="#7F77DD" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="340" y1="168" x2="340" y2="114" stroke="#7F77DD" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="555" y1="168" x2="555" y2="114" stroke="#7F77DD" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>