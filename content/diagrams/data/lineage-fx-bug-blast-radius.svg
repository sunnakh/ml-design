<svg width="100%" viewBox="0 0 680 300" role="img"><title>Lineage blast radius of the FX bug</title><desc>The bug originates in the FX rates table, flows to the amount_usd feature, into training set ts-0314, into model v42, into its prediction logs, and finally to affected customer decisions. Lineage lets you find every downstream item.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-coral"><rect x="40" y="50" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="125" y="70" text-anchor="middle" dominant-baseline="central">FX rates</text><text class="ts" x="125" y="92" text-anchor="middle" dominant-baseline="central">Weekly, not daily</text></g>
<g class="c-purple"><rect x="255" y="50" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="340" y="70" text-anchor="middle" dominant-baseline="central">amount_usd</text><text class="ts" x="340" y="92" text-anchor="middle" dominant-baseline="central">Gold feature</text></g>
<g class="c-purple"><rect x="470" y="50" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="555" y="70" text-anchor="middle" dominant-baseline="central">Training set</text><text class="ts" x="555" y="92" text-anchor="middle" dominant-baseline="central">fraud_ts_0314</text></g>
<g class="c-purple"><rect x="470" y="170" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="555" y="190" text-anchor="middle" dominant-baseline="central">Model v42</text><text class="ts" x="555" y="212" text-anchor="middle" dominant-baseline="central">Registry entry</text></g>
<g class="c-purple"><rect x="255" y="170" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="340" y="190" text-anchor="middle" dominant-baseline="central">Prediction logs</text><text class="ts" x="340" y="212" text-anchor="middle" dominant-baseline="central">model_version=v42</text></g>
<g class="c-purple"><rect x="40" y="170" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="125" y="190" text-anchor="middle" dominant-baseline="central">Decisions</text><text class="ts" x="125" y="212" text-anchor="middle" dominant-baseline="central">Customers to review</text></g>
