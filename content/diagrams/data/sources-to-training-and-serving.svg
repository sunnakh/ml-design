<svg width="100%" viewBox="0 0 680 388" role="img"><title>PayFlow data sources</title><desc>Five source families (event logs, operational databases, third-party data, human feedback, system outputs) feed both the historical training set and live scoring under 100 ms. Third-party and system outputs are highlighted as risky.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="40" y="40" width="200" height="52" rx="4" stroke-width="0.5"/><text class="th" x="140" y="57" text-anchor="middle" dominant-baseline="central">Event logs</text><text class="ts" x="140" y="77" text-anchor="middle" dominant-baseline="central">Logins, devices, clicks</text></g>
<g class="c-teal"><rect x="40" y="104" width="200" height="52" rx="4" stroke-width="0.5"/><text class="th" x="140" y="121" text-anchor="middle" dominant-baseline="central">Operational DBs</text><text class="ts" x="140" y="141" text-anchor="middle" dominant-baseline="central">Accounts, merchants</text></g>
<g class="c-coral"><rect x="40" y="168" width="200" height="52" rx="4" stroke-width="0.5"/><text class="th" x="140" y="185" text-anchor="middle" dominant-baseline="central">Third-party</text><text class="ts" x="140" y="205" text-anchor="middle" dominant-baseline="central">IP risk, BIN data</text></g>
<g class="c-teal"><rect x="40" y="232" width="200" height="52" rx="4" stroke-width="0.5"/><text class="th" x="140" y="249" text-anchor="middle" dominant-baseline="central">Human feedback</text><text class="ts" x="140" y="269" text-anchor="middle" dominant-baseline="central">Chargebacks, reviews</text></g>
<g class="c-coral"><rect x="40" y="296" width="200" height="52" rx="4" stroke-width="0.5"/><text class="th" x="140" y="313" text-anchor="middle" dominant-baseline="central">System outputs</text><text class="ts" x="140" y="333" text-anchor="middle" dominant-baseline="central">Rules, past scores</text></g>
<line x1="240" y1="66" x2="300" y2="66" stroke="var(--border-strong)" stroke-width="0.5"/>
<line x1="240" y1="130" x2="300" y2="130" stroke="var(--border-strong)" stroke-width="0.5"/>
<line x1="240" y1="194" x2="300" y2="194" stroke="var(--border-strong)" stroke-width="0.5"/>
<line x1="240" y1="258" x2="300" y2="258" stroke="var(--border-strong)" stroke-width="0.5"/>
<line x1="240" y1="322" x2="300" y2="322" stroke="var(--border-strong)" stroke-width="0.5"/>
<line x1="300" y1="66" x2="300" y2="322" stroke="var(--border-strong)" stroke-width="0.5"/>
<line class="arr" x1="300" y1="130" x2="416" y2="130" marker-end="url(#arrow)"/>
<line class="arr" x1="300" y1="258" x2="416" y2="258" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="420" y="100" width="220" height="60" rx="4" stroke-width="0.5"/><text class="th" x="530" y="120" text-anchor="middle" dominant-baseline="central">Training set</text><text class="ts" x="530" y="142" text-anchor="middle" dominant-baseline="central">Historical, offline</text></g>
<g class="c-gray"><rect x="420" y="228" width="220" height="60" rx="4" stroke-width="0.5"/><text class="th" x="530" y="248" text-anchor="middle" dominant-baseline="central">Live scoring</text><text class="ts" x="530" y="270" text-anchor="middle" dominant-baseline="central">Under 100 ms, online</text></g>
<g class="c-teal"><rect x="420" y="330" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="440" y="336" dominant-baseline="central">Usually safe</text>
<g class="c-coral"><rect x="530" y="330" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="550" y="336" dominant-baseline="central">Handle with care</text>
</svg>