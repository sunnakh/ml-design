<svg width="100%" viewBox="0 0 680 340" role="img"><title>Batch and streaming feature pipelines</title><desc>Kafka events feed a stream processor that writes seconds-fresh features to the online store, and nightly batch jobs that write to the offline store and also load the online store. Scoring reads the online store; training reads the offline store.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="136" width="140" height="56" rx="4" stroke-width="0.5"/><text class="th" x="110" y="154" text-anchor="middle" dominant-baseline="central">Kafka events</text><text class="ts" x="110" y="176" text-anchor="middle" dominant-baseline="central">Append-only log</text></g>
<g class="c-teal"><rect x="240" y="50" width="160" height="56" rx="4" stroke-width="0.5"/><text class="th" x="320" y="68" text-anchor="middle" dominant-baseline="central">Stream processor</text><text class="ts" x="320" y="90" text-anchor="middle" dominant-baseline="central">Flink, seconds</text></g>
<g class="c-purple"><rect x="240" y="222" width="160" height="56" rx="4" stroke-width="0.5"/><text class="th" x="320" y="240" text-anchor="middle" dominant-baseline="central">Batch jobs</text><text class="ts" x="320" y="262" text-anchor="middle" dominant-baseline="central">Spark, nightly</text></g>
<g class="c-gray"><rect x="460" y="50" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="550" y="68" text-anchor="middle" dominant-baseline="central">Online store</text><text class="ts" x="550" y="90" text-anchor="middle" dominant-baseline="central">Redis, for scoring</text></g>
<g class="c-gray"><rect x="460" y="222" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="550" y="240" text-anchor="middle" dominant-baseline="central">Offline store</text><text class="ts" x="550" y="262" text-anchor="middle" dominant-baseline="central">Lake, for training</text></g>
<line class="arr" x1="182" y1="150" x2="236" y2="96" marker-end="url(#arrow)"/>
<line class="arr" x1="182" y1="178" x2="236" y2="232" marker-end="url(#arrow)"/>
<line class="arr" x1="402" y1="78" x2="456" y2="78" marker-end="url(#arrow)"/>
<line class="arr" x1="402" y1="250" x2="456" y2="250" marker-end="url(#arrow)"/>
<line x1="402" y1="100" x2="456" y2="228" stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="402" y1="228" x2="456" y2="100" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="306" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="60" y="312" dominant-baseline="central">Streaming path</text>
<g class="c-purple"><rect x="190" y="306" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="210" y="312" dominant-baseline="central">Batch path</text>
<line x1="330" y1="312" x2="362" y2="312" stroke="var(--text-secondary)" stroke-width="1.2" stroke-dasharray="4 3"/><text class="ts" x="372" y="312" dominant-baseline="central">Cross-write for consistency</text>
</svg>