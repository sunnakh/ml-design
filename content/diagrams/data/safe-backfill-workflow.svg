<svg width="100%" viewBox="0 0 680 290" role="img"><title>Safe backfill workflow</title><desc>Six steps: change logic, backfill to a new version, parity check against logged served values (looping back to change logic on mismatch), retrain on the new version, atomically swap the online store and model together, then monitor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="340" y="26" text-anchor="middle" dominant-baseline="central">Mismatch: fix logic and rerun</text>
<path d="M555 68 L555 40 L125 40 L125 66" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="70" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="125" y="90" text-anchor="middle" dominant-baseline="central">Change logic</text><text class="ts" x="125" y="112" text-anchor="middle" dominant-baseline="central">New or fixed feature</text></g>
<g class="c-teal"><rect x="255" y="70" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="340" y="90" text-anchor="middle" dominant-baseline="central">Backfill to v2</text><text class="ts" x="340" y="112" text-anchor="middle" dominant-baseline="central">Throttled, versioned</text></g>
<g class="c-purple"><rect x="470" y="70" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="555" y="90" text-anchor="middle" dominant-baseline="central">Parity check</text><text class="ts" x="555" y="112" text-anchor="middle" dominant-baseline="central">Vs logged values</text></g>
<g class="c-teal"><rect x="470" y="190" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="555" y="210" text-anchor="middle" dominant-baseline="central">Retrain</text><text class="ts" x="555" y="232" text-anchor="middle" dominant-baseline="central">Model on v2 values</text></g>
<g class="c-teal"><rect x="255" y="190" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="340" y="210" text-anchor="middle" dominant-baseline="central">Atomic swap</text><text class="ts" x="340" y="232" text-anchor="middle" dominant-baseline="central">Online store + model</text></g>
<g class="c-teal"><rect x="40" y="190" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="125" y="210" text-anchor="middle" dominant-baseline="central">Monitor</text><text class="ts" x="125" y="232" text-anchor="middle" dominant-baseline="central">Drift after switch</text></g>
<line class="arr" x1="212" y1="100" x2="251" y2="100" marker-end="url(#arrow)"/>
<line class="arr" x1="427" y1="100" x2="466" y2="100" marker-end="url(#arrow)"/>
<line class="arr" x1="555" y1="132" x2="555" y2="186" marker-end="url(#arrow)"/>
<line class="arr" x1="468" y1="220" x2="429" y2="220" marker-end="url(#arrow)"/>
<line class="arr" x1="253" y1="220" x2="214" y2="220" marker-end="url(#arrow)"/>
</svg>