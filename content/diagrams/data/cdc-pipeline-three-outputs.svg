<svg width="100%" viewBox="0 0 680 270" role="img"><title>CDC pipeline and its outputs</title><desc>The accounts database write-ahead log is read by Debezium and published to a Kafka topic of change events, which feed three outputs: a mirror table of current state, a history table with every version, and streaming features.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="50" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="125" y="70" text-anchor="middle" dominant-baseline="central">Accounts DB</text><text class="ts" x="125" y="92" text-anchor="middle" dominant-baseline="central">Postgres, OLTP</text></g>
<g class="c-gray"><rect x="255" y="50" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="340" y="70" text-anchor="middle" dominant-baseline="central">Debezium</text><text class="ts" x="340" y="92" text-anchor="middle" dominant-baseline="central">Reads WAL log</text></g>
<g class="c-gray"><rect x="470" y="50" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="555" y="70" text-anchor="middle" dominant-baseline="central">Kafka topic</text><text class="ts" x="555" y="92" text-anchor="middle" dominant-baseline="central">Change events</text></g>
<line class="arr" x1="212" y1="80" x2="251" y2="80" marker-end="url(#arrow)"/>
<line class="arr" x1="427" y1="80" x2="466" y2="80" marker-end="url(#arrow)"/>
<line x1="555" y1="112" x2="555" y2="140" stroke="var(--text-secondary)" stroke-width="1"/>
<line x1="125" y1="140" x2="555" y2="140" stroke="var(--text-secondary)" stroke-width="1"/>
<line class="arr" x1="125" y1="140" x2="125" y2="166" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="140" x2="340" y2="166" marker-end="url(#arrow)"/>
<line class="arr" x1="555" y1="140" x2="555" y2="166" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="170" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="125" y="190" text-anchor="middle" dominant-baseline="central">Mirror table</text><text class="ts" x="125" y="212" text-anchor="middle" dominant-baseline="central">Current state</text></g>
<g class="c-teal"><rect x="255" y="170" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="340" y="190" text-anchor="middle" dominant-baseline="central">History (SCD2)</text><text class="ts" x="340" y="212" text-anchor="middle" dominant-baseline="central">Every version</text></g>
<g class="c-teal"><rect x="470" y="170" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="555" y="190" text-anchor="middle" dominant-baseline="central">Stream features</text><text class="ts" x="555" y="212" text-anchor="middle" dominant-baseline="central">Card added 3m ago</text></g>
</svg>