<svg width="100%" viewBox="0 0 680 300" role="img"><title>PayFlow storage systems and roles</title><desc>Postgres OLTP feeds the lakehouse through CDC, and Kafka feeds it through event ingestion. The lakehouse holds bronze, silver, and gold layers and the offline feature store. It materializes features into the Redis online store used by scoring, and serves scans to training jobs.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="60" width="150" height="56" rx="4" stroke-width="0.5"/><text class="th" x="115" y="78" text-anchor="middle" dominant-baseline="central">Postgres</text><text class="ts" x="115" y="100" text-anchor="middle" dominant-baseline="central">OLTP, current state</text></g>
<g class="c-gray"><rect x="40" y="190" width="150" height="56" rx="4" stroke-width="0.5"/><text class="th" x="115" y="208" text-anchor="middle" dominant-baseline="central">Kafka</text><text class="ts" x="115" y="230" text-anchor="middle" dominant-baseline="central">Event log</text></g>
<g class="c-teal"><rect x="250" y="60" width="180" height="186" rx="4" stroke-width="0.5"/><text class="th" x="340" y="92" text-anchor="middle" dominant-baseline="central">Lakehouse</text><text class="ts" x="340" y="128" text-anchor="middle" dominant-baseline="central">Iceberg on S3</text><text class="ts" x="340" y="156" text-anchor="middle" dominant-baseline="central">Bronze, silver, gold</text><text class="ts" x="340" y="184" text-anchor="middle" dominant-baseline="central">Offline feature store</text><text class="ts" x="340" y="212" text-anchor="middle" dominant-baseline="central">Full history</text></g>
<g class="c-purple"><rect x="490" y="60" width="150" height="56" rx="4" stroke-width="0.5"/><text class="th" x="565" y="78" text-anchor="middle" dominant-baseline="central">Online store</text><text class="ts" x="565" y="100" text-anchor="middle" dominant-baseline="central">Redis, for scoring</text></g>
<g class="c-gray"><rect x="490" y="190" width="150" height="56" rx="4" stroke-width="0.5"/><text class="th" x="565" y="208" text-anchor="middle" dominant-baseline="central">Training jobs</text><text class="ts" x="565" y="230" text-anchor="middle" dominant-baseline="central">Large scans</text></g>
<line class="arr" x1="192" y1="88" x2="246" y2="88" marker-end="url(#arrow)"/>
<line class="arr" x1="192" y1="218" x2="246" y2="218" marker-end="url(#arrow)"/>
<line class="arr" x1="432" y1="88" x2="486" y2="88" marker-end="url(#arrow)"/>
<line class="arr" x1="432" y1="218" x2="486" y2="218" marker-end="url(#arrow)"/>
<text class="ts" x="219" y="272" text-anchor="middle" dominant-baseline="central">CDC and events in</text>
<text class="ts" x="461" y="272" text-anchor="middle" dominant-baseline="central">Materialize and scan out</text>
</svg>