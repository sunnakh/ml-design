<svg width="100%" viewBox="0 0 680 270" role="img"><title>Data contract between producer and consumers</title><desc>The checkout team produces data through a data contract covering schema and semantics, freshness SLA, change policy, and owner. Three consumers depend on it: the fraud model, analytics, and finance.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="40" y="120" width="150" height="60" rx="4" stroke-width="0.5"/><text class="th" x="115" y="140" text-anchor="middle" dominant-baseline="central">Checkout team</text><text class="ts" x="115" y="162" text-anchor="middle" dominant-baseline="central">Producer</text></g>
<g class="c-teal"><rect x="250" y="66" width="180" height="168" rx="4" stroke-width="0.5"/><text class="th" x="340" y="92" text-anchor="middle" dominant-baseline="central">Data contract</text><text class="ts" x="340" y="126" text-anchor="middle" dominant-baseline="central">Schema + semantics</text><text class="ts" x="340" y="152" text-anchor="middle" dominant-baseline="central">Freshness SLA</text><text class="ts" x="340" y="178" text-anchor="middle" dominant-baseline="central">Change policy</text><text class="ts" x="340" y="204" text-anchor="middle" dominant-baseline="central">Owner + on-call</text></g>
<g class="c-gray"><rect x="490" y="64" width="150" height="44" rx="4" stroke-width="0.5"/><text class="th" x="565" y="86" text-anchor="middle" dominant-baseline="central">Fraud model</text></g>
<g class="c-gray"><rect x="490" y="128" width="150" height="44" rx="4" stroke-width="0.5"/><text class="th" x="565" y="150" text-anchor="middle" dominant-baseline="central">Analytics</text></g>
<g class="c-gray"><rect x="490" y="192" width="150" height="44" rx="4" stroke-width="0.5"/><text class="th" x="565" y="214" text-anchor="middle" dominant-baseline="central">Finance</text></g>
<line class="arr" x1="192" y1="150" x2="246" y2="150" marker-end="url(#arrow)"/>
<line class="arr" x1="432" y1="150" x2="486" y2="88" marker-end="url(#arrow)"/>
<line class="arr" x1="432" y1="150" x2="486" y2="150" marker-end="url(#arrow)"/>
<line class="arr" x1="432" y1="150" x2="486" y2="212" marker-end="url(#arrow)"/>
</svg>