<svg width="100%" viewBox="0 0 680 290" role="img"><title>Training data loader pipeline</title><desc>Pre-shuffled shard files in object storage are read by parallel readers with prefetch and caching, passed through a shuffle buffer, batched and transformed with saved normalization statistics, fed to the trainer, with loader state checkpointed alongside the model.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="40" y="50" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="125" y="70" text-anchor="middle" dominant-baseline="central">Shards on S3</text><text class="ts" x="125" y="92" text-anchor="middle" dominant-baseline="central">Pre-shuffled files</text></g>
<g class="c-teal"><rect x="255" y="50" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="340" y="70" text-anchor="middle" dominant-baseline="central">Parallel readers</text><text class="ts" x="340" y="92" text-anchor="middle" dominant-baseline="central">Prefetch + cache</text></g>
<g class="c-teal"><rect x="470" y="50" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="555" y="70" text-anchor="middle" dominant-baseline="central">Shuffle buffer</text><text class="ts" x="555" y="92" text-anchor="middle" dominant-baseline="central">Window of K rows</text></g>
<g class="c-purple"><rect x="470" y="170" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="555" y="190" text-anchor="middle" dominant-baseline="central">Batch + transform</text><text class="ts" x="555" y="212" text-anchor="middle" dominant-baseline="central">Saved norm stats</text></g>
<g class="c-purple"><rect x="255" y="170" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="340" y="190" text-anchor="middle" dominant-baseline="central">Trainer</text><text class="ts" x="340" y="212" text-anchor="middle" dominant-baseline="central">GPU workers</text></g>
<g class="c-gray"><rect x="40" y="170" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="125" y="190" text-anchor="middle" dominant-baseline="central">Checkpoint</text><text class="ts" x="125" y="212" text-anchor="middle" dominant-baseline="central">Model + loader state</text></g>
<line class="arr" x1="212" y1="80" x2="251" y2="80" marker-end="url(#arrow)"/>
<line class="arr" x1="427" y1="80" x2="466" y2="80" marker-end="url(#arrow)"/>
<line class="arr" x1="555" y1="112" x2="555" y2="166" marker-end="url(#arrow)"/>
<line class="arr" x1="468" y1="200" x2="429" y2="200" marker-end="url(#arrow)"/>
<line class="arr" x1="253" y1="200" x2="214" y2="200" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="262" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="60" y="268" dominant-baseline="central">I/O path</text>
<g class="c-purple"><rect x="150" y="262" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="170" y="268" dominant-baseline="central">Compute path</text>
</svg>