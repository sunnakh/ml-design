<svg width="100%" viewBox="0 0 680 320" role="img"><title>Event time vs arrival order</title><desc>Five events in event-time order arrive in a different order: e3 arrives early and is duplicated, e4 and e5 arrive before e2, and e2 arrives after the watermark has passed, making it a late event.</desc>
<text class="th" x="40" y="80" dominant-baseline="central">Event time</text>
<text class="th" x="40" y="200" dominant-baseline="central">Arrival</text>
<line x1="180" y1="98" x2="180" y2="182" stroke="var(--text-secondary)" stroke-width="0.8"/>
<line x1="270" y1="98" x2="560" y2="182" stroke="var(--text-secondary)" stroke-width="0.8"/>
<line x1="360" y1="98" x2="250" y2="182" stroke="var(--text-secondary)" stroke-width="0.8"/>
<line x1="360" y1="98" x2="390" y2="182" stroke="var(--text-secondary)" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="450" y1="98" x2="320" y2="182" stroke="var(--text-secondary)" stroke-width="0.8"/>
<line x1="540" y1="98" x2="460" y2="182" stroke="var(--text-secondary)" stroke-width="0.8"/>
<line x1="515" y1="160" x2="515" y2="236" stroke="var(--text-danger)" stroke-width="1" stroke-dasharray="4 3"/>
<text class="ts" x="515" y="252" text-anchor="middle" dominant-baseline="central">Watermark</text>
<g class="c-gray"><circle cx="180" cy="80" r="18" stroke-width="0.5"/><text class="th" x="180" y="80" text-anchor="middle" dominant-baseline="central">e1</text></g>
<g class="c-gray"><circle cx="270" cy="80" r="18" stroke-width="0.5"/><text class="th" x="270" y="80" text-anchor="middle" dominant-baseline="central">e2</text></g>
<g class="c-gray"><circle cx="360" cy="80" r="18" stroke-width="0.5"/><text class="th" x="360" y="80" text-anchor="middle" dominant-baseline="central">e3</text></g>
<g class="c-gray"><circle cx="450" cy="80" r="18" stroke-width="0.5"/><text class="th" x="450" y="80" text-anchor="middle" dominant-baseline="central">e4</text></g>
<g class="c-gray"><circle cx="540" cy="80" r="18" stroke-width="0.5"/><text class="th" x="540" y="80" text-anchor="middle" dominant-baseline="central">e5</text></g>
<g class="c-gray"><circle cx="180" cy="200" r="18" stroke-width="0.5"/><text class="th" x="180" y="200" text-anchor="middle" dominant-baseline="central">e1</text></g>
<g class="c-gray"><circle cx="250" cy="200" r="18" stroke-width="0.5"/><text class="th" x="250" y="200" text-anchor="middle" dominant-baseline="central">e3</text></g>
<g class="c-gray"><circle cx="320" cy="200" r="18" stroke-width="0.5"/><text class="th" x="320" y="200" text-anchor="middle" dominant-baseline="central">e4</text></g>
<g class="c-teal"><circle cx="390" cy="200" r="18" stroke-width="0.5"/><text class="th" x="390" y="200" text-anchor="middle" dominant-baseline="central">e3</text></g>
<g class="c-gray"><circle cx="460" cy="200" r="18" stroke-width="0.5"/><text class="th" x="460" y="200" text-anchor="middle" dominant-baseline="central">e5</text></g>
<g class="c-coral"><circle cx="560" cy="200" r="18" stroke-width="0.5"/><text class="th" x="560" y="200" text-anchor="middle" dominant-baseline="central">e2</text></g>
<g class="c-teal"><circle cx="46" cy="292" r="6" stroke-width="0.5"/></g><text class="ts" x="60" y="292" dominant-baseline="central">Duplicate (retry)</text>
<g class="c-coral"><circle cx="206" cy="292" r="6" stroke-width="0.5"/></g><text class="ts" x="220" y="292" dominant-baseline="central">Late (after watermark)</text>
</svg>