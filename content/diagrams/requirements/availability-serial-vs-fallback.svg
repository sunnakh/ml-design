<svg width="100%" viewBox="0 0 680 365" role="img"><title>Serial dependencies versus fallback ladder availability</title><desc>Top: four serial dependencies at 99.9, 99.9, 99.9 and 99.95 percent multiply to 99.65 percent, about 2.5 hours down per month. Bottom: a shared front door at 99.99 percent feeds three parallel decision paths (model 99.65, rules 99.95 on separate dependencies, static in-process); overall about 99.99 percent, limited by the front door.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="40" y="34" dominant-baseline="central">Serial: every dependency must work</text>
<g class="c-gray"><rect x="40" y="50" width="100" height="50" rx="4" stroke-width="0.5"/><text class="th" x="90" y="67" text-anchor="middle" dominant-baseline="central">Features</text><text class="ts" x="90" y="86" text-anchor="middle" dominant-baseline="central">99.9%</text></g>
<g class="c-gray"><rect x="154" y="50" width="100" height="50" rx="4" stroke-width="0.5"/><text class="th" x="204" y="67" text-anchor="middle" dominant-baseline="central">Streams</text><text class="ts" x="204" y="86" text-anchor="middle" dominant-baseline="central">99.9%</text></g>
<g class="c-gray"><rect x="268" y="50" width="100" height="50" rx="4" stroke-width="0.5"/><text class="th" x="318" y="67" text-anchor="middle" dominant-baseline="central">Model</text><text class="ts" x="318" y="86" text-anchor="middle" dominant-baseline="central">99.9%</text></g>
<g class="c-gray"><rect x="382" y="50" width="100" height="50" rx="4" stroke-width="0.5"/><text class="th" x="432" y="67" text-anchor="middle" dominant-baseline="central">Policy</text><text class="ts" x="432" y="86" text-anchor="middle" dominant-baseline="central">99.95%</text></g>
<line class="arr" x1="141" y1="75" x2="152" y2="75" marker-end="url(#arrow)"/>
