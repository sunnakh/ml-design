<svg width="100%" viewBox="0 0 680 360" role="img"><title>Queue wait versus analyst utilization</title><desc>Wait time as a multiple of one review's duration, rho over one minus rho. At 70 percent utilization wait is 2.3 times, at 90 percent 9 times, at 95 percent 19 times. Target zone 60 to 80 percent.</desc>
<rect x="392" y="60" width="104" height="240" fill="#1D9E75" fill-opacity="0.1"/>
<text class="ts" x="444" y="88" text-anchor="middle" dominant-baseline="central">Target zone</text>
<text class="ts" x="80" y="40" dominant-baseline="central">Queue wait (× time to review one case)</text>
<line x1="80" y1="60" x2="80" y2="300" stroke="var(--border-strong)" stroke-width="0.5"/>
<line x1="80" y1="300" x2="600" y2="300" stroke="var(--border-strong)" stroke-width="0.5"/>
<text class="ts" x="70" y="300" text-anchor="end" dominant-baseline="central">0</text>
<text class="ts" x="70" y="240" text-anchor="end" dominant-baseline="central">5</text>
<text class="ts" x="70" y="180" text-anchor="end" dominant-baseline="central">10</text>
<text class="ts" x="70" y="120" text-anchor="end" dominant-baseline="central">15</text>
<text class="ts" x="70" y="60" text-anchor="end" dominant-baseline="central">20</text>
<text class="ts" x="80" y="316" text-anchor="middle" dominant-baseline="central">0%</text>
<text class="ts" x="340" y="316" text-anchor="middle" dominant-baseline="central">50%</text>
<text class="ts" x="444" y="316" text-anchor="middle" dominant-baseline="central">70%</text>
<text class="ts" x="548" y="316" text-anchor="middle" dominant-baseline="central">90%</text>
<text class="ts" x="600" y="316" text-anchor="middle" dominant-baseline="central">100%</text>
<text class="ts" x="340" y="342" text-anchor="middle" dominant-baseline="central">Analyst utilization (arrivals ÷ capacity)</text>
<polyline points="80,300 132,298.7 236,294.9 340,288 392,282 444,272 496,252 522,232 548,192 563.6,140.4 574,72" fill="none" stroke="#D85A30" stroke-width="2"/>
<circle cx="444" cy="272" r="4" fill="#D85A30"/><text class="ts" x="434" y="258" text-anchor="end" dominant-baseline="central">70% busy: 2.3×</text>
<circle cx="548" cy="192" r="4" fill="#D85A30"/><text class="ts" x="538" y="180" text-anchor="end" dominant-baseline="central">90% busy: 9×</text>
<circle cx="574" cy="72" r="4" fill="#D85A30"/><text class="ts" x="564" y="66" text-anchor="end" dominant-baseline="central">95% busy: 19×</text>
</svg>