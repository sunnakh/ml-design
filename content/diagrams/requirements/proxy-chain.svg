<svg width="100%" viewBox="0 0 680 235" role="img"><title>Proxy chain from training loss to long-term value</title><desc>Five measurements left to right: training loss, offline dollars, online proxy, OEC, long-term truth. Below each link a gap where alignment breaks: wrong target, replay bias, proxy drift, horizon gap.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="40" y="22" dominant-baseline="central">Fast, cheap, weak link to value</text>
<text class="ts" x="640" y="22" text-anchor="end" dominant-baseline="central">Slow, costly, true value</text>
<g class="c-teal"><rect x="40" y="40" width="108" height="56" rx="4" stroke-width="0.5"/><text class="th" x="94" y="58" text-anchor="middle" dominant-baseline="central">Train loss</text><text class="ts" x="94" y="79" text-anchor="middle" dominant-baseline="central">Log loss</text></g>
<g class="c-teal"><rect x="163" y="40" width="108" height="56" rx="4" stroke-width="0.5"/><text class="th" x="217" y="58" text-anchor="middle" dominant-baseline="central">Offline $</text><text class="ts" x="217" y="79" text-anchor="middle" dominant-baseline="central">Held-out replay</text></g>
<g class="c-teal"><rect x="286" y="40" width="108" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Proxy</text><text class="ts" x="340" y="79" text-anchor="middle" dominant-baseline="central">Fast signals</text></g>
<g class="c-teal"><rect x="409" y="40" width="108" height="56" rx="4" stroke-width="0.5"/><text class="th" x="463" y="58" text-anchor="middle" dominant-baseline="central">OEC</text><text class="ts" x="463" y="79" text-anchor="middle" dominant-baseline="central">Profit, 14 days</text></g>
<g class="c-teal"><rect x="532" y="40" width="108" height="56" rx="4" stroke-width="0.5"/><text class="th" x="586" y="58" text-anchor="middle" dominant-baseline="central">Long-term</text><text class="ts" x="586" y="79" text-anchor="middle" dominant-baseline="central">90d + churn</text></g>
<line class="arr" x1="149" y1="60" x2="161" y2="60" marker-end="url(#arrow)"/>
<line class="arr" x1="272" y1="60" x2="284" y2="60" marker-end="url(#arrow)"/>
<line class="arr" x1="395" y1="60" x2="407" y2="60" marker-end="url(#arrow)"/>
<line class="arr" x1="518" y1="60" x2="530" y2="60" marker-end="url(#arrow)"/>
<line class="leader" x1="155.5" y1="68" x2="155.5" y2="118"/>
<line class="leader" x1="278.5" y1="68" x2="278.5" y2="118"/>
<line class="leader" x1="401.5" y1="68" x2="401.5" y2="118"/>
<line class="leader" x1="524.5" y1="68" x2="524.5" y2="118"/>
<g class="c-coral"><rect x="101" y="120" width="109" height="56" rx="4" stroke-width="0.5"/><text class="th" x="155.5" y="138" text-anchor="middle" dominant-baseline="central">Wrong target</text><text class="ts" x="155.5" y="159" text-anchor="middle" dominant-baseline="central">Loss is not $</text></g>
<g class="c-coral"><rect x="224" y="120" width="109" height="56" rx="4" stroke-width="0.5"/><text class="th" x="278.5" y="138" text-anchor="middle" dominant-baseline="central">Replay bias</text><text class="ts" x="278.5" y="159" text-anchor="middle" dominant-baseline="central">Past is not live</text></g>
<g class="c-coral"><rect x="347" y="120" width="109" height="56" rx="4" stroke-width="0.5"/><text class="th" x="401.5" y="138" text-anchor="middle" dominant-baseline="central">Proxy drift</text><text class="ts" x="401.5" y="159" text-anchor="middle" dominant-baseline="central">Signal decays</text></g>
<g class="c-coral"><rect x="470" y="120" width="109" height="56" rx="4" stroke-width="0.5"/><text class="th" x="524.5" y="138" text-anchor="middle" dominant-baseline="central">Horizon gap</text><text class="ts" x="524.5" y="159" text-anchor="middle" dominant-baseline="central">Harm arrives late</text></g>
<rect class="c-teal" x="40" y="204" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="60" y="210" dominant-baseline="central">What we measure</text>
<rect class="c-coral" x="200" y="204" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="220" y="210" dominant-baseline="central">Where alignment breaks</text>
