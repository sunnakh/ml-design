<g class="c-gray"><rect x="505" y="230" width="135" height="56" rx="4" stroke-width="0.5"/><text class="th" x="572.5" y="248" text-anchor="middle" dominant-baseline="central">Review volume</text><text class="ts" x="572.5" y="269" text-anchor="middle" dominant-baseline="central">Plus hit rate</text></g>
