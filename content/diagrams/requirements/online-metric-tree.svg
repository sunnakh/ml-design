<line class="arr" x1="417.5" y1="198" x2="417.5" y2="227" marker-end="url(#arrow)"/>
<line class="arr" x1="572.5" y1="198" x2="572.5" y2="227" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="230" width="135" height="56" rx="4" stroke-width="0.5"/><text class="th" x="107.5" y="248" text-anchor="middle" dominant-baseline="central">Chargebacks</text><text class="ts" x="107.5" y="269" text-anchor="middle" dominant-baseline="central">Lagging, 30–90 days</text></g>
