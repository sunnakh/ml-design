<line class="arr" x1="262.5" y1="116" x2="262.5" y2="137" marker-end="url(#arrow)"/>
<line class="arr" x1="417.5" y1="116" x2="417.5" y2="137" marker-end="url(#arrow)"/>
<line class="arr" x1="572.5" y1="116" x2="572.5" y2="137" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="140" width="135" height="56" rx="4" stroke-width="0.5"/><text class="th" x="107.5" y="158" text-anchor="middle" dominant-baseline="central">Fraud loss</text><text class="ts" x="107.5" y="179" text-anchor="middle" dominant-baseline="central">Basis points of GMV</text></g>
<g class="c-teal"><rect x="195" y="140" width="135" height="56" rx="4" stroke-width="0.5"/><text class="th" x="262.5" y="158" text-anchor="middle" dominant-baseline="central">Good approvals</text><text class="ts" x="262.5" y="179" text-anchor="middle" dominant-baseline="central">Share approved</text></g>
<g class="c-teal"><rect x="350" y="140" width="135" height="56" rx="4" stroke-width="0.5"/><text class="th" x="417.5" y="158" text-anchor="middle" dominant-baseline="central">Friction</text><text class="ts" x="417.5" y="179" text-anchor="middle" dominant-baseline="central">Abandon at OTP</text></g>
<g class="c-teal"><rect x="505" y="140" width="135" height="56" rx="4" stroke-width="0.5"/><text class="th" x="572.5" y="158" text-anchor="middle" dominant-baseline="central">Ops cost</text><text class="ts" x="572.5" y="179" text-anchor="middle" dominant-baseline="central">Review $ per day</text></g>
<line class="arr" x1="107.5" y1="198" x2="107.5" y2="227" marker-end="url(#arrow)"/>
