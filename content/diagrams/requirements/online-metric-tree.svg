<svg width="100%" viewBox="0 0 680 350" role="img"><title>Online metric tree for fraud system</title><desc>North star net fraud-adjusted profit per thousand payments, driven by fraud loss, good approvals, friction and ops cost, each with a diagnostic metric below: chargeback rate, decline rate, challenge rate, review volume.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="190" y="40" width="300" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Net fraud-adjusted profit</text><text class="ts" x="340" y="79" text-anchor="middle" dominant-baseline="central">Dollars per 1k payments</text></g>
<line class="arr" x1="340" y1="98" x2="340" y2="116"/>
<line class="arr" x1="107.5" y1="116" x2="572.5" y2="116"/>
