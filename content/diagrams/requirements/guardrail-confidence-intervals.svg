<svg width="100%" viewBox="0 0 680 330" role="img"><title>Non-inferiority guardrail outcomes</title><desc>Four confidence intervals for change in false-decline rate against a margin of plus 0.02 percentage points. A: entirely below zero region, pass. B: crosses the margin, inconclusive. C: entirely above margin, breach. D: significantly worse than zero but entirely below margin, pass.</desc>
<line x1="380" y1="45" x2="380" y2="262" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="460" y1="45" x2="460" y2="262" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 3"/>
<text class="ts" x="372" y="34" text-anchor="end" dominant-baseline="central">No change</text>
<text class="ts" x="468" y="34" dominant-baseline="central">Margin +0.02</text>
<text class="th" x="40" y="62" dominant-baseline="central">A. Pass</text><text class="ts" x="40" y="80" dominant-baseline="central">Clearly within margin</text>
<line x1="332" y1="71" x2="392" y2="71" stroke="#1D9E75" stroke-width="2"/><line x1="332" y1="65" x2="332" y2="77" stroke="#1D9E75" stroke-width="2"/><line x1="392" y1="65" x2="392" y2="77" stroke="#1D9E75" stroke-width="2"/><circle cx="360" cy="71" r="4" fill="#1D9E75"/>
<text class="th" x="40" y="117" dominant-baseline="central">B. Inconclusive</text><text class="ts" x="40" y="135" dominant-baseline="central">Crosses margin, run longer</text>
<line x1="364" y1="126" x2="480" y2="126" stroke="#BA7517" stroke-width="2"/><line x1="364" y1="120" x2="364" y2="132" stroke="#BA7517" stroke-width="2"/><line x1="480" y1="120" x2="480" y2="132" stroke="#BA7517" stroke-width="2"/><circle cx="420" cy="126" r="4" fill="#BA7517"/>
<text class="th" x="40" y="172" dominant-baseline="central">C. Breach</text><text class="ts" x="40" y="190" dominant-baseline="central">Stop the ramp</text>
<line x1="468" y1="181" x2="532" y2="181" stroke="#D85A30" stroke-width="2"/><line x1="468" y1="175" x2="468" y2="187" stroke="#D85A30" stroke-width="2"/><line x1="532" y1="175" x2="532" y2="187" stroke="#D85A30" stroke-width="2"/><circle cx="500" cy="181" r="4" fill="#D85A30"/>
<text class="th" x="40" y="227" dominant-baseline="central">D. Pass</text><text class="ts" x="40" y="245" dominant-baseline="central">Worse, but within margin</text>
