<svg width="100%" viewBox="0 0 680 390" role="img"><title>Fraud decision service boundary</title><desc>Payments service sends a request to the fraud decision service, which assembles features with help from a feature store, runs the model and policy, returns a decision, and writes a decision log that is later joined with labels.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="230" y="40" width="240" height="250" rx="6" fill="none" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="ts" x="350" y="58" text-anchor="middle" dominant-baseline="central">Fraud decision service</text>
<g class="c-gray"><rect x="40" y="75" width="150" height="50" rx="4" stroke-width="0.5"/><text class="th" x="115" y="92" text-anchor="middle" dominant-baseline="central">Payments service</text><text class="ts" x="115" y="111" text-anchor="middle" dominant-baseline="central">Caller, sync</text></g>
<g class="c-teal"><rect x="250" y="75" width="200" height="50" rx="4" stroke-width="0.5"/><text class="th" x="350" y="92" text-anchor="middle" dominant-baseline="central">Feature assembly</text><text class="ts" x="350" y="111" text-anchor="middle" dominant-baseline="central">Request + history</text></g>
<g class="c-teal"><rect x="250" y="150" width="200" height="50" rx="4" stroke-width="0.5"/><text class="th" x="350" y="167" text-anchor="middle" dominant-baseline="central">Model</text><text class="ts" x="350" y="186" text-anchor="middle" dominant-baseline="central">Calibrated score</text></g>
<g class="c-teal"><rect x="250" y="225" width="200" height="50" rx="4" stroke-width="0.5"/><text class="th" x="350" y="242" text-anchor="middle" dominant-baseline="central">Policy</text><text class="ts" x="350" y="261" text-anchor="middle" dominant-baseline="central">Action + reasons</text></g>
<g class="c-purple"><rect x="510" y="75" width="130" height="50" rx="4" stroke-width="0.5"/><text class="th" x="575" y="92" text-anchor="middle" dominant-baseline="central">Feature store</text><text class="ts" x="575" y="111" text-anchor="middle" dominant-baseline="central">Aggregates</text></g>
<g class="c-purple"><rect x="510" y="225" width="130" height="50" rx="4" stroke-width="0.5"/><text class="th" x="575" y="242" text-anchor="middle" dominant-baseline="central">Decision log</text><text class="ts" x="575" y="261" text-anchor="middle" dominant-baseline="central">Inputs, outputs</text></g>
<g class="c-purple"><rect x="510" y="310" width="130" height="50" rx="4" stroke-width="0.5"/><text class="th" x="575" y="327" text-anchor="middle" dominant-baseline="central">Label join</text><text class="ts" x="575" y="346" text-anchor="middle" dominant-baseline="central">Chargebacks later</text></g>
<line class="arr" x1="192" y1="100" x2="248" y2="100" marker-end="url(#arrow)"/>
<text class="ts" x="220" y="88" text-anchor="middle" dominant-baseline="central">request</text>
<line class="arr" x1="350" y1="127" x2="350" y2="148" marker-end="url(#arrow)"/>
<line class="arr" x1="350" y1="202" x2="350" y2="223" marker-end="url(#arrow)"/>
<line class="arr" x1="454" y1="100" x2="506" y2="100" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="arr" x1="452" y1="250" x2="508" y2="250" marker-end="url(#arrow)"/>
<path class="arr" d="M248 250 L115 250 L115 128" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="180" y="240" text-anchor="middle" dominant-baseline="central">decision</text>
<line class="arr" x1="575" y1="277" x2="575" y2="308" marker-end="url(#arrow)"/>
<rect class="c-gray" x="40" y="314" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="60" y="320" dominant-baseline="central">Caller</text>
<rect class="c-teal" x="40" y="336" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="60" y="342" dominant-baseline="central">Decision service</text>
<rect class="c-purple" x="40" y="358" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="60" y="364" dominant-baseline="central">Data stores</text>
</svg>