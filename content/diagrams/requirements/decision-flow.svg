<svg width="100%" viewBox="0 0 680 370" role="img"><title>Fraud decision flow</title><desc>A payment attempt goes to a fraud model producing a risk score, then a decision policy maps it to approve, challenge, review or decline. Approve, challenge and review produce outcome labels that retrain the model; decline produces no label.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="40" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="130" y="58" text-anchor="middle" dominant-baseline="central">Payment attempt</text><text class="ts" x="130" y="79" text-anchor="middle" dominant-baseline="central">Buyer clicks pay</text></g>
<g class="c-teal"><rect x="250" y="40" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Fraud model</text><text class="ts" x="340" y="79" text-anchor="middle" dominant-baseline="central">Risk score, 0 to 1</text></g>
<g class="c-teal"><rect x="460" y="40" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="550" y="58" text-anchor="middle" dominant-baseline="central">Decision policy</text><text class="ts" x="550" y="79" text-anchor="middle" dominant-baseline="central">Thresholds and rules</text></g>
<line class="arr" x1="222" y1="68" x2="248" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="432" y1="68" x2="458" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="550" y1="98" x2="550" y2="128"/>
<line class="arr" x1="105" y1="128" x2="555" y2="128"/>
<line class="arr" x1="105" y1="128" x2="105" y2="157" marker-end="url(#arrow)"/>
<line class="arr" x1="255" y1="128" x2="255" y2="157" marker-end="url(#arrow)"/>
<line class="arr" x1="405" y1="128" x2="405" y2="157" marker-end="url(#arrow)"/>
<line class="arr" x1="555" y1="128" x2="555" y2="157" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="160" width="130" height="56" rx="4" stroke-width="0.5"/><text class="th" x="105" y="178" text-anchor="middle" dominant-baseline="central">Approve</text><text class="ts" x="105" y="199" text-anchor="middle" dominant-baseline="central">Low risk</text></g>
<g class="c-purple"><rect x="190" y="160" width="130" height="56" rx="4" stroke-width="0.5"/><text class="th" x="255" y="178" text-anchor="middle" dominant-baseline="central">Challenge</text><text class="ts" x="255" y="199" text-anchor="middle" dominant-baseline="central">OTP or 3DS</text></g>
<g class="c-purple"><rect x="340" y="160" width="130" height="56" rx="4" stroke-width="0.5"/><text class="th" x="405" y="178" text-anchor="middle" dominant-baseline="central">Review</text><text class="ts" x="405" y="199" text-anchor="middle" dominant-baseline="central">Analyst queue</text></g>
<g class="c-purple"><rect x="490" y="160" width="130" height="56" rx="4" stroke-width="0.5"/><text class="th" x="555" y="178" text-anchor="middle" dominant-baseline="central">Decline</text><text class="ts" x="555" y="199" text-anchor="middle" dominant-baseline="central">No label seen</text></g>
<line class="arr" x1="105" y1="218" x2="105" y2="236"/>
<line class="arr" x1="405" y1="218" x2="405" y2="236"/>
<line class="arr" x1="105" y1="236" x2="405" y2="236"/>
<line class="arr" x1="255" y1="218" x2="255" y2="255" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="130" y="258" width="250" height="56" rx="4" stroke-width="0.5"/><text class="th" x="255" y="276" text-anchor="middle" dominant-baseline="central">Outcomes become labels</text><text class="ts" x="255" y="297" text-anchor="middle" dominant-baseline="central">Chargebacks in 30 to 90 days</text></g>
<path class="arr" d="M382 286 L650 286 L650 24 L340 24 L340 37" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line class="arr" x1="130" y1="346" x2="162" y2="346" stroke-dasharray="4 3"/><text class="ts" x="172" y="346" dominant-baseline="central">Labels retrain the model. Declined payments produce none.</text>
</svg>