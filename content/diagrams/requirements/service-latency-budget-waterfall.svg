<svg width="100%" viewBox="0 0 680 385" role="img"><title>Latency budget waterfall for fraud decision</title><desc>Timeline of one request within a 50 ms p99 budget: network in 0-3, parse 3-4, feature store 4-16 in parallel with velocity counters 4-9, model 16-24, policy 24-26, network out 26-29, decision log async 26-40 off the critical path. Headroom 21 ms.</desc>
<rect x="443.6" y="50" width="176.4" height="256" fill="#1D9E75" fill-opacity="0.08"/>
<line x1="620" y1="44" x2="620" y2="306" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 3"/>
<text class="ts" x="616" y="34" text-anchor="end" dominant-baseline="central">p99 budget 50 ms</text>
<text class="ts" x="575" y="224" text-anchor="middle" dominant-baseline="central">Headroom</text>
<text class="ts" x="575" y="242" text-anchor="middle" dominant-baseline="central">21 ms</text>
<text class="t" x="40" y="69" dominant-baseline="central">Network in</text>
<rect class="c-teal" x="200" y="60" width="25.2" height="18" rx="2" stroke-width="0.5"/>
<text class="t" x="40" y="101" dominant-baseline="central">Parse, validate</text>
<rect class="c-teal" x="225.2" y="92" width="8.4" height="18" rx="2" stroke-width="0.5"/>
<text class="t" x="40" y="133" dominant-baseline="central">Feature store</text>
<rect class="c-teal" x="233.6" y="124" width="100.8" height="18" rx="2" stroke-width="0.5"/>
<text class="t" x="40" y="165" dominant-baseline="central">Velocity counters</text>
<rect class="c-gray" x="233.6" y="156" width="42" height="18" rx="2" stroke-width="0.5"/>
<text class="t" x="40" y="197" dominant-baseline="central">Model inference</text>
<rect class="c-teal" x="334.4" y="188" width="67.2" height="18" rx="2" stroke-width="0.5"/>
<text class="t" x="40" y="229" dominant-baseline="central">Policy + rules</text>
<rect class="c-teal" x="401.6" y="220" width="16.8" height="18" rx="2" stroke-width="0.5"/>
<text class="t" x="40" y="261" dominant-baseline="central">Network out</text>
<rect class="c-teal" x="418.4" y="252" width="25.2" height="18" rx="2" stroke-width="0.5"/>
<text class="t" x="40" y="293" dominant-baseline="central">Decision log</text>
<rect x="418.4" y="284" width="117.6" height="18" rx="2" fill="none" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="200" y1="310" x2="620" y2="310" stroke="var(--border-strong)" stroke-width="0.5"/>
<text class="ts" x="200" y="324" text-anchor="middle" dominant-baseline="central">0</text>
<text class="ts" x="284" y="324" text-anchor="middle" dominant-baseline="central">10</text>
<text class="ts" x="368" y="324" text-anchor="middle" dominant-baseline="central">20</text>
<text class="ts" x="452" y="324" text-anchor="middle" dominant-baseline="central">30</text>
<text class="ts" x="536" y="324" text-anchor="middle" dominant-baseline="central">40</text>
<text class="ts" x="620" y="324" text-anchor="middle" dominant-baseline="central">50 ms</text>
<rect class="c-teal" x="40" y="352" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="60" y="358" dominant-baseline="central">Critical path</text>
<rect class="c-gray" x="160" y="352" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="180" y="358" dominant-baseline="central">Parallel, not critical</text>
<rect x="320" y="352" width="12" height="12" rx="2" fill="none" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 2"/><text class="ts" x="340" y="358" dominant-baseline="central">Async, off the path</text>
</svg>