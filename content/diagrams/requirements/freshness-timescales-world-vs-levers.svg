<rect class="c-teal" x="220" y="352" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="240" y="358" dominant-baseline="central">Our levers</text>
<rect class="c-purple" x="340" y="352" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="360" y="358" dominant-baseline="central">When truth arrives</text>
