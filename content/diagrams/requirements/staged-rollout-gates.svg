<svg width="100%" viewBox="0 0 680 310" role="img"><title>Staged rollout with exit gates</title><desc>Four rollout stages: shadow, canary 1 percent, ramp 10 to 50 percent, full launch with holdback. Each has an exit gate; failing any gate leads to roll back, iterate or kill.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="40" y="40" width="135" height="56" rx="4" stroke-width="0.5"/><text class="th" x="107.5" y="58" text-anchor="middle" dominant-baseline="central">Shadow</text><text class="ts" x="107.5" y="79" text-anchor="middle" dominant-baseline="central">Score only</text></g>
<g class="c-teal"><rect x="195" y="40" width="135" height="56" rx="4" stroke-width="0.5"/><text class="th" x="262.5" y="58" text-anchor="middle" dominant-baseline="central">Canary 1%</text><text class="ts" x="262.5" y="79" text-anchor="middle" dominant-baseline="central">Real actions, tiny</text></g>
<g class="c-teal"><rect x="350" y="40" width="135" height="56" rx="4" stroke-width="0.5"/><text class="th" x="417.5" y="58" text-anchor="middle" dominant-baseline="central">Ramp 10–50%</text><text class="ts" x="417.5" y="79" text-anchor="middle" dominant-baseline="central">A/B vs champion</text></g>
<g class="c-teal"><rect x="505" y="40" width="135" height="56" rx="4" stroke-width="0.5"/><text class="th" x="572.5" y="58" text-anchor="middle" dominant-baseline="central">Full launch</text><text class="ts" x="572.5" y="79" text-anchor="middle" dominant-baseline="central">Keep 2% holdback</text></g>
<line class="arr" x1="177" y1="68" x2="193" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="332" y1="68" x2="348" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="487" y1="68" x2="503" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="107.5" y1="98" x2="107.5" y2="127" marker-end="url(#arrow)"/>
<line class="arr" x1="262.5" y1="98" x2="262.5" y2="127" marker-end="url(#arrow)"/>
<line class="arr" x1="417.5" y1="98" x2="417.5" y2="127" marker-end="url(#arrow)"/>
<line class="arr" x1="572.5" y1="98" x2="572.5" y2="127" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="130" width="135" height="56" rx="4" stroke-width="0.5"/><text class="th" x="107.5" y="148" text-anchor="middle" dominant-baseline="central">Calibrated</text><text class="ts" x="107.5" y="169" text-anchor="middle" dominant-baseline="central">Latency in budget</text></g>
<g class="c-gray"><rect x="195" y="130" width="135" height="56" rx="4" stroke-width="0.5"/><text class="th" x="262.5" y="148" text-anchor="middle" dominant-baseline="central">No incidents</text><text class="ts" x="262.5" y="169" text-anchor="middle" dominant-baseline="central">Guardrails hold</text></g>
<g class="c-gray"><rect x="350" y="130" width="135" height="56" rx="4" stroke-width="0.5"/><text class="th" x="417.5" y="148" text-anchor="middle" dominant-baseline="central">Proxy wins</text><text class="ts" x="417.5" y="169" text-anchor="middle" dominant-baseline="central">Significant, powered</text></g>
<g class="c-gray"><rect x="505" y="130" width="135" height="56" rx="4" stroke-width="0.5"/><text class="th" x="572.5" y="148" text-anchor="middle" dominant-baseline="central">Truth confirms</text><text class="ts" x="572.5" y="169" text-anchor="middle" dominant-baseline="central">Chargebacks later</text></g>
<line class="arr" x1="107.5" y1="188" x2="107.5" y2="206"/>
<line class="arr" x1="262.5" y1="188" x2="262.5" y2="206"/>
<line class="arr" x1="417.5" y1="188" x2="417.5" y2="206"/>
<line class="arr" x1="572.5" y1="188" x2="572.5" y2="206"/>
<line class="arr" x1="107.5" y1="206" x2="572.5" y2="206"/>
<line class="arr" x1="340" y1="206" x2="340" y2="225" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="190" y="228" width="300" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="246" text-anchor="middle" dominant-baseline="central">Fail any gate</text><text class="ts" x="340" y="267" text-anchor="middle" dominant-baseline="central">Roll back, then iterate or kill</text></g>
