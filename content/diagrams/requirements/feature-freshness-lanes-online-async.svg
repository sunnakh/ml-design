<svg width="100%" viewBox="0 0 680 340" role="img"><title>Three feature lanes feeding online and async scoring</title><desc>Batch features (hours old), streaming features (seconds old) and request features (now) all feed the online model at checkout. After approval, an async re-score runs within minutes with a heavier model.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="50" width="210" height="56" rx="4" stroke-width="0.5"/><text class="th" x="145" y="68" text-anchor="middle" dominant-baseline="central">Batch features</text><text class="ts" x="145" y="89" text-anchor="middle" dominant-baseline="central">Hours old: user history</text></g>
<g class="c-gray"><rect x="40" y="130" width="210" height="56" rx="4" stroke-width="0.5"/><text class="th" x="145" y="148" text-anchor="middle" dominant-baseline="central">Streaming features</text><text class="ts" x="145" y="169" text-anchor="middle" dominant-baseline="central">Seconds old: velocity</text></g>
<g class="c-gray"><rect x="40" y="210" width="210" height="56" rx="4" stroke-width="0.5"/><text class="th" x="145" y="228" text-anchor="middle" dominant-baseline="central">Request features</text><text class="ts" x="145" y="249" text-anchor="middle" dominant-baseline="central">Now: amount, device, IP</text></g>
<line class="arr" x1="252" y1="80" x2="436" y2="148" marker-end="url(#arrow)"/>
<line class="arr" x1="252" y1="158" x2="436" y2="158" marker-end="url(#arrow)"/>
<line class="arr" x1="252" y1="236" x2="436" y2="168" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="440" y="130" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="540" y="148" text-anchor="middle" dominant-baseline="central">Online model</text><text class="ts" x="540" y="169" text-anchor="middle" dominant-baseline="central">At checkout, ~25 ms</text></g>
<line class="arr" x1="540" y1="188" x2="540" y2="246" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="440" y="250" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="540" y="268" text-anchor="middle" dominant-baseline="central">Async re-score</text><text class="ts" x="540" y="289" text-anchor="middle" dominant-baseline="central">After approval, minutes</text></g>
<rect class="c-gray" x="40" y="298" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="60" y="304" dominant-baseline="central">Feature inputs by freshness</text>
<rect class="c-teal" x="240" y="298" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="260" y="304" dominant-baseline="central">Prediction points</text>
</svg>