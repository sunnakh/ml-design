<svg width="100%" viewBox="0 0 680 200" role="img"><title>Time split with gaps, label maturity, and refit</title><desc>Timeline January to July. Row one: train January to April, gap, validation in May, gap, test in June, then a label settling window in early July. Row two: after selecting a model, refit on train plus validation and score the test window once.</desc>
