<g class="c-teal"><rect x="60" y="54" width="320" height="34" rx="4" stroke-width="0.5"/><text class="th" x="220" y="71" text-anchor="middle" dominant-baseline="central">Train: fit candidates</text></g>
<g class="c-purple"><rect x="398" y="54" width="62" height="34" rx="4" stroke-width="0.5"/><text class="th" x="429" y="71" text-anchor="middle" dominant-baseline="central">Val</text></g>
<g class="c-coral"><rect x="478" y="54" width="62" height="34" rx="4" stroke-width="0.5"/><text class="th" x="509" y="71" text-anchor="middle" dominant-baseline="central">Test</text></g>
<rect x="540" y="54" width="44" height="34" rx="4" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 3"/>
