<g class="c-teal"><rect x="60" y="130" width="400" height="34" rx="4" stroke-width="0.5"/><text class="th" x="260" y="147" text-anchor="middle" dominant-baseline="central">Refit chosen model on train + val</text></g>
<g class="c-coral"><rect x="478" y="130" width="62" height="34" rx="4" stroke-width="0.5"/><text class="th" x="509" y="147" text-anchor="middle" dominant-baseline="central">Test</text></g>
