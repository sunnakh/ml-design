<svg width="100%" viewBox="0 0 680 470" role="img"><title>A/B test design flow</title><desc>Eligible users are assigned by a deterministic hash of user ID and experiment salt into control, which gets the champion, and treatment, which gets the new model, fifty-fifty. Both groups flow through the same metric pipeline restricted to triggered users, producing the change in the OEC with a confidence interval and a sample ratio check.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="240" y="30" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="49" text-anchor="middle" dominant-baseline="central">Eligible users</text><text class="ts" x="340" y="69" text-anchor="middle" dominant-baseline="central">Logged-in, homepage</text></g>
<line class="arr" x1="340" y1="88" x2="340" y2="106" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="210" y="110" width="260" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="129" text-anchor="middle" dominant-baseline="central">Deterministic assignment</text><text class="ts" x="340" y="149" text-anchor="middle" dominant-baseline="central">hash(user_id + salt) mod 100</text></g>
<line class="arr" x1="290" y1="168" x2="232" y2="196" marker-end="url(#arrow)"/>
<line class="arr" x1="390" y1="168" x2="448" y2="196" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="130" y="200" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="220" y="219" text-anchor="middle" dominant-baseline="central">Control</text><text class="ts" x="220" y="239" text-anchor="middle" dominant-baseline="central">Champion, 50%</text></g>
<g class="c-purple"><rect x="370" y="200" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="460" y="219" text-anchor="middle" dominant-baseline="central">Treatment</text><text class="ts" x="460" y="239" text-anchor="middle" dominant-baseline="central">New model, 50%</text></g>
<line class="arr" x1="232" y1="258" x2="290" y2="286" marker-end="url(#arrow)"/>
<line class="arr" x1="448" y1="258" x2="390" y2="286" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="200" y="290" width="280" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="309" text-anchor="middle" dominant-baseline="central">Same metric pipeline</text><text class="ts" x="340" y="329" text-anchor="middle" dominant-baseline="central">Triggered users only</text></g>
<line class="arr" x1="340" y1="348" x2="340" y2="376" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="200" y="380" width="280" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="399" text-anchor="middle" dominant-baseline="central">Δ OEC with CI</text><text class="ts" x="340" y="419" text-anchor="middle" dominant-baseline="central">Plus guardrails, SRM check</text></g>
</svg>