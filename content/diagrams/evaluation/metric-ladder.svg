<svg width="100%" viewBox="0 0 680 410" role="img"><title>Metric ladder for store recommendations</title><desc>Five metric levels from top to bottom: north star 90-day revenue per user, online primary row purchases per user, online proxy row click-through rate, offline recall at 20, training log loss on clicks. Each is a proxy for the level above. Guardrails sit beside the online levels. Top is slow and true, bottom is fast and indirect.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="200" y="30" width="280" height="48" rx="4" stroke-width="0.5"/><text class="th" x="340" y="45" text-anchor="middle" dominant-baseline="central">North star</text><text class="ts" x="340" y="64" text-anchor="middle" dominant-baseline="central">90-day revenue per user</text></g>
<g class="c-teal"><rect x="200" y="106" width="280" height="48" rx="4" stroke-width="0.5"/><text class="th" x="340" y="121" text-anchor="middle" dominant-baseline="central">Online primary (OEC)</text><text class="ts" x="340" y="140" text-anchor="middle" dominant-baseline="central">Row purchases per user</text></g>
<g class="c-teal"><rect x="200" y="182" width="280" height="48" rx="4" stroke-width="0.5"/><text class="th" x="340" y="197" text-anchor="middle" dominant-baseline="central">Online proxy</text><text class="ts" x="340" y="216" text-anchor="middle" dominant-baseline="central">Row click-through rate</text></g>
<g class="c-teal"><rect x="200" y="258" width="280" height="48" rx="4" stroke-width="0.5"/><text class="th" x="340" y="273" text-anchor="middle" dominant-baseline="central">Offline metric</text><text class="ts" x="340" y="292" text-anchor="middle" dominant-baseline="central">Recall@20 on next-week buys</text></g>
<g class="c-gray"><rect x="200" y="334" width="280" height="48" rx="4" stroke-width="0.5"/><text class="th" x="340" y="349" text-anchor="middle" dominant-baseline="central">Training loss</text><text class="ts" x="340" y="368" text-anchor="middle" dominant-baseline="central">Log loss on clicks</text></g>
<line class="arr" x1="340" y1="104" x2="340" y2="81" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="180" x2="340" y2="157" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="256" x2="340" y2="233" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="332" x2="340" y2="309" marker-end="url(#arrow)"/>
<text class="ts" x="40" y="54" dominant-baseline="central">Months, true value</text>
<line class="arr" x1="100" y1="72" x2="100" y2="336" marker-end="url(#arrow)"/>
<text class="ts" x="40" y="358" dominant-baseline="central">Seconds, indirect</text>
<g class="c-coral"><rect x="500" y="106" width="140" height="124" rx="4" stroke-width="0.5"/><text class="th" x="570" y="124" text-anchor="middle" dominant-baseline="central">Guardrails</text><text class="ts" x="570" y="144" text-anchor="middle" dominant-baseline="central">Must not regress</text><text class="ts" x="570" y="168" text-anchor="middle" dominant-baseline="central">p99 latency</text><text class="ts" x="570" y="188" text-anchor="middle" dominant-baseline="central">Return rate</text><text class="ts" x="570" y="208" text-anchor="middle" dominant-baseline="central">Catalog diversity</text></g>
</svg>