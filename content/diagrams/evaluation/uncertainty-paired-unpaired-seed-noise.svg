<svg width="100%" viewBox="0 0 680 240" role="img"><title>Same plus 0.005 lift under three views of uncertainty</title><desc>Observed lift of plus 0.005 in recall. Unpaired 95 percent confidence interval spans minus 0.002 to plus 0.012 and includes zero. Paired interval spans plus 0.002 to plus 0.008 and excludes zero. Seed-to-seed spread for the identical model spans roughly minus 0.007 to plus 0.007, so the lift is within training noise.</desc>
