<svg width="100%" viewBox="0 0 680 420" role="img"><title>Shadow mode architecture</title><desc>Live user requests hit a router that sends each request to the champion, whose response is shown to the user, and a copy to the shadow challenger, whose response is never shown. Both paths log features and scores to a log store, which feeds a comparison of latency, skew, and prediction agreement.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="150" width="112" height="56" rx="4" stroke-width="0.5"/><text class="th" x="96" y="169" text-anchor="middle" dominant-baseline="central">User request</text><text class="ts" x="96" y="189" text-anchor="middle" dominant-baseline="central">Live traffic</text></g>
<line class="arr" x1="154" y1="178" x2="176" y2="178" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="180" y="150" width="120" height="56" rx="4" stroke-width="0.5"/><text class="th" x="240" y="169" text-anchor="middle" dominant-baseline="central">Router</text><text class="ts" x="240" y="189" text-anchor="middle" dominant-baseline="central">Copies request</text></g>
<path class="arr" d="M300 178 L320 178 L320 88 L336 88" fill="none" marker-end="url(#arrow)"/>
<path d="M320 178 L320 268 L336 268" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="340" y="60" width="140" height="56" rx="4" stroke-width="0.5"/><text class="th" x="410" y="79" text-anchor="middle" dominant-baseline="central">Champion</text><text class="ts" x="410" y="99" text-anchor="middle" dominant-baseline="central">Serves the user</text></g>
<line class="arr" x1="482" y1="88" x2="516" y2="88" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="520" y="60" width="120" height="56" rx="4" stroke-width="0.5"/><text class="th" x="580" y="79" text-anchor="middle" dominant-baseline="central">Shown to user</text><text class="ts" x="580" y="99" text-anchor="middle" dominant-baseline="central">Real response</text></g>
<g class="c-purple"><rect x="340" y="240" width="140" height="56" rx="4" stroke-width="0.5" stroke-dasharray="5 4"/><text class="th" x="410" y="259" text-anchor="middle" dominant-baseline="central">Shadow model</text><text class="ts" x="410" y="279" text-anchor="middle" dominant-baseline="central">Output discarded</text></g>
<line x1="580" y1="118" x2="580" y2="236" stroke="var(--t)" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<line x1="482" y1="268" x2="516" y2="268" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="520" y="240" width="120" height="56" rx="4" stroke-width="0.5"/><text class="th" x="580" y="259" text-anchor="middle" dominant-baseline="central">Log store</text><text class="ts" x="580" y="279" text-anchor="middle" dominant-baseline="central">Features, scores</text></g>
<line class="arr" x1="580" y1="298" x2="580" y2="326" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="520" y="330" width="120" height="56" rx="4" stroke-width="0.5"/><text class="th" x="580" y="349" text-anchor="middle" dominant-baseline="central">Compare</text><text class="ts" x="580" y="369" text-anchor="middle" dominant-baseline="central">Latency, skew</text></g>
</svg>