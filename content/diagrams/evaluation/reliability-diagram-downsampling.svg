<svg width="100%" viewBox="0 0 680 330" role="img"><title>Reliability diagram before and after recalibration</title><desc>Predicted probability on the x axis, observed rate on the y axis. The dashed diagonal is perfect calibration. Raw model trained with downsampled negatives sits well below the diagonal, overpredicting. After recalibration the points sit on the diagonal. Ranking and AUC are unchanged.</desc>
<line x1="100" y1="290" x2="360" y2="290" stroke="var(--b)" stroke-width="0.5"/>
<line x1="100" y1="30" x2="100" y2="290" stroke="var(--b)" stroke-width="0.5"/>
<line x1="100" y1="290" x2="360" y2="30" stroke="var(--t)" stroke-width="1" stroke-dasharray="5 4"/>
<text class="ts" x="100" y="306" text-anchor="middle" dominant-baseline="central">0</text>
<text class="ts" x="230" y="306" text-anchor="middle" dominant-baseline="central">0.5</text>
<text class="ts" x="360" y="306" text-anchor="middle" dominant-baseline="central">1</text>
<text class="ts" x="88" y="160" text-anchor="end" dominant-baseline="central">0.5</text>
<text class="ts" x="88" y="30" text-anchor="end" dominant-baseline="central">1</text>
<text class="ts" x="230" y="322" text-anchor="middle" dominant-baseline="central">Predicted probability</text>
<text class="ts" x="108" y="16" dominant-baseline="central">Observed rate</text>
<polyline points="126,282 178,264 230,238 282,199 334,134" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<g class="c-coral"><circle cx="126" cy="282" r="5"/><circle cx="178" cy="264" r="5"/><circle cx="230" cy="238" r="5"/><circle cx="282" cy="199" r="5"/><circle cx="334" cy="134" r="5"/></g>
<polyline points="126,267 178,209 230,165 282,105 334,61" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<g class="c-teal"><rect x="121" y="262" width="10" height="10"/><rect x="173" y="204" width="10" height="10"/><rect x="225" y="160" width="10" height="10"/><rect x="277" y="100" width="10" height="10"/><rect x="329" y="56" width="10" height="10"/></g>
<line x1="410" y1="80" x2="440" y2="80" stroke="var(--t)" stroke-width="1" stroke-dasharray="5 4"/>
<text class="ts" x="452" y="80" dominant-baseline="central">Perfect calibration</text>
<g class="c-coral"><circle cx="425" cy="112" r="5"/></g>
<text class="ts" x="452" y="112" dominant-baseline="central">Raw, negatives downsampled</text>
<g class="c-teal"><rect x="420" y="139" width="10" height="10"/></g>
<text class="ts" x="452" y="144" dominant-baseline="central">After recalibration</text>
<text class="ts" x="410" y="190" dominant-baseline="central">Below diagonal = overpredicts</text>
<text class="ts" x="410" y="212" dominant-baseline="central">Same order, so AUC unchanged</text>
</svg>