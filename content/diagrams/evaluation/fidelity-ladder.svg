<svg width="100%" viewBox="0 0 680 170" role="img"><title>Evaluation fidelity ladder</title><desc>Five evaluation methods ordered from cheap and unrealistic to costly and realistic: training loss, random test split, time backtest, shadow mode, A/B test.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-coral"><rect x="40" y="30" width="108" height="56" rx="4" stroke-width="0.5"/><text class="th" x="94" y="49" text-anchor="middle" dominant-baseline="central">Training loss</text><text class="ts" x="94" y="69" text-anchor="middle" dominant-baseline="central">Fit only</text></g>
<g class="c-teal"><rect x="163" y="30" width="108" height="56" rx="4" stroke-width="0.5"/><text class="th" x="217" y="49" text-anchor="middle" dominant-baseline="central">Test split</text><text class="ts" x="217" y="69" text-anchor="middle" dominant-baseline="central">Random rows</text></g>
<g class="c-teal"><rect x="286" y="30" width="108" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="49" text-anchor="middle" dominant-baseline="central">Backtest</text><text class="ts" x="340" y="69" text-anchor="middle" dominant-baseline="central">Future period</text></g>
<g class="c-teal"><rect x="409" y="30" width="108" height="56" rx="4" stroke-width="0.5"/><text class="th" x="463" y="49" text-anchor="middle" dominant-baseline="central">Shadow mode</text><text class="ts" x="463" y="69" text-anchor="middle" dominant-baseline="central">Live, no effect</text></g>
<g class="c-teal"><rect x="532" y="30" width="108" height="56" rx="4" stroke-width="0.5"/><text class="th" x="586" y="49" text-anchor="middle" dominant-baseline="central">A/B test</text><text class="ts" x="586" y="69" text-anchor="middle" dominant-baseline="central">Real outcome</text></g>
<line class="arr" x1="40" y1="112" x2="636" y2="112" marker-end="url(#arrow)"/>
<text class="ts" x="40" y="136" dominant-baseline="central">Cheap, fast, safe, less realistic</text>
<text class="ts" x="640" y="136" text-anchor="end" dominant-baseline="central">Costly, slow, risky, realistic</text>
</svg>