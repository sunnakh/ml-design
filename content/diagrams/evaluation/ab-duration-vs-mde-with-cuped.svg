<svg width="100%" viewBox="0 0 680 360" role="img"><title>Weeks needed versus minimum detectable effect</title><desc>Required test duration falls steeply as the minimum detectable effect grows. Without variance reduction a 1 percent effect needs about 5.3 weeks and 2 percent about 1.3 weeks. With CUPED at correlation 0.5, 1 percent needs about 4 weeks. A dashed line marks a 2-week budget, which allows detecting about 1.6 percent without CUPED and 1.4 percent with it.</desc>
<line x1="100" y1="300" x2="600" y2="300" stroke="var(--b)" stroke-width="0.5"/>
<line x1="100" y1="60" x2="100" y2="300" stroke="var(--b)" stroke-width="0.5"/>
<text class="ts" x="100" y="318" text-anchor="middle" dominant-baseline="central">1%</text>
<text class="ts" x="225" y="318" text-anchor="middle" dominant-baseline="central">1.5%</text>
<text class="ts" x="350" y="318" text-anchor="middle" dominant-baseline="central">2%</text>
<text class="ts" x="475" y="318" text-anchor="middle" dominant-baseline="central">2.5%</text>
<text class="ts" x="600" y="318" text-anchor="middle" dominant-baseline="central">3%</text>
<text class="ts" x="88" y="300" text-anchor="end" dominant-baseline="central">0</text>
<text class="ts" x="88" y="220" text-anchor="end" dominant-baseline="central">2</text>
<text class="ts" x="88" y="140" text-anchor="end" dominant-baseline="central">4</text>
<text class="ts" x="88" y="60" text-anchor="end" dominant-baseline="central">6</text>
<text class="ts" x="350" y="342" text-anchor="middle" dominant-baseline="central">Minimum detectable effect (relative lift in OEC)</text>
<text class="ts" x="108" y="40" dominant-baseline="central">Weeks needed at 50/50</text>
<line x1="100" y1="220" x2="600" y2="220" stroke="var(--t)" stroke-width="1" stroke-dasharray="5 4"/>
<polyline points="100,87 162.5,163.6 225,205.2 350,246.8 475,266 600,276.4" fill="none" stroke="#D85A30" stroke-width="2"/>
<g class="c-coral"><circle cx="100" cy="87" r="4"/><circle cx="162.5" cy="163.6" r="4"/><circle cx="225" cy="205.2" r="4"/><circle cx="350" cy="246.8" r="4"/><circle cx="475" cy="266" r="4"/><circle cx="600" cy="276.4" r="4"/></g>
<polyline points="100,140 162.5,197.6 225,228.8 350,260 475,274.4 600,282.4" fill="none" stroke="#1D9E75" stroke-width="2"/>
<g class="c-teal"><rect x="96" y="136" width="8" height="8"/><rect x="158.5" y="193.6" width="8" height="8"/><rect x="221" y="224.8" width="8" height="8"/><rect x="346" y="256" width="8" height="8"/><rect x="471" y="270.4" width="8" height="8"/><rect x="596" y="278.4" width="8" height="8"/></g>
<g class="c-coral"><circle cx="450" cy="84" r="4"/></g><text class="ts" x="464" y="84" dominant-baseline="central">No variance reduction</text>
<g class="c-teal"><rect x="446" y="104" width="8" height="8"/></g><text class="ts" x="464" y="108" dominant-baseline="central">With CUPED (ρ = 0.5)</text>
<line x1="440" y1="132" x2="460" y2="132" stroke="var(--t)" stroke-width="1" stroke-dasharray="5 4"/><text class="ts" x="464" y="132" dominant-baseline="central">2-week budget</text>
</svg>