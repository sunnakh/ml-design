<svg width="100%" viewBox="0 0 680 280" role="img"><title>Baselines compared on recall at 20</title><desc>Horizontal bars of recall at 20 on the same test week: random 0.01, popularity champion 0.11, recently viewed 0.17, matrix factorization 0.19, new model 0.21, oracle ceiling 0.34 shown as a dashed outline.</desc>
