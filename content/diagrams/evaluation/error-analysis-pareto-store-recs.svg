<text class="t" x="40" y="108" dominant-baseline="central">Bought via search</text>
<g class="c-coral"><rect x="240" y="99" width="105" height="18" rx="2" stroke-width="0.5"/></g>
<text class="ts" x="353" y="108" dominant-baseline="central">15%</text>
<text class="ts" x="640" y="108" text-anchor="end" dominant-baseline="central">Label definition</text>
