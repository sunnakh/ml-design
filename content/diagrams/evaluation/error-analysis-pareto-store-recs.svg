<svg width="100%" viewBox="0 0 680 280" role="img"><title>Error categories for missed purchases, sorted by frequency</title><desc>Pareto of 100 missed purchases. Already-purchased items recommended 32 percent, fix with filter or feature. New users with no history 21 percent, fix with cold-start path. Bought via search not row 15 percent, fix label definition. Out-of-stock candidates 12 percent, an evaluation bug. Gifts off-profile 10 percent, context features. Near-duplicate items 10 percent, diversity rerank.</desc>
