<svg width="100%" viewBox="0 0 680 540" role="img"><title>ML evaluation stages</title><desc>Trained model goes through offline evaluation (data splits, metrics, slice analysis, error analysis), an offline gate that can send it back to modeling, then online evaluation (shadow mode, A/B test, interleaving), then a launch decision.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="250" y="30" width="180" height="44" rx="4" stroke-width="0.5"/><text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">Trained model</text></g>
<line class="arr" x1="340" y1="76" x2="340" y2="97" marker-end="url(#arrow)"/>
<rect x="40" y="100" width="600" height="115" rx="8" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="55" y="118" dominant-baseline="central">Offline evaluation</text>
<g class="node c-teal"><rect x="55" y="135" width="130" height="60" rx="4" stroke-width="0.5"/><text class="th" x="120" y="155" text-anchor="middle" dominant-baseline="central">Data splits</text><text class="ts" x="120" y="177" text-anchor="middle" dominant-baseline="central">Time, no leakage</text></g>
<g class="node c-teal"><rect x="200" y="135" width="130" height="60" rx="4" stroke-width="0.5"/><text class="th" x="265" y="155" text-anchor="middle" dominant-baseline="central">Metrics</text><text class="ts" x="265" y="177" text-anchor="middle" dominant-baseline="central">Match the task</text></g>
<g class="node c-teal"><rect x="345" y="135" width="130" height="60" rx="4" stroke-width="0.5"/><text class="th" x="410" y="155" text-anchor="middle" dominant-baseline="central">Slice analysis</text><text class="ts" x="410" y="177" text-anchor="middle" dominant-baseline="central">Per-segment gaps</text></g>
<g class="node c-teal"><rect x="490" y="135" width="130" height="60" rx="4" stroke-width="0.5"/><text class="th" x="555" y="155" text-anchor="middle" dominant-baseline="central">Error analysis</text><text class="ts" x="555" y="177" text-anchor="middle" dominant-baseline="central">Why it fails</text></g>
<line class="arr" x1="340" y1="217" x2="340" y2="242" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="250" y="245" width="180" height="50" rx="4" stroke-width="0.5"/><text class="th" x="340" y="262" text-anchor="middle" dominant-baseline="central">Offline gate</text><text class="ts" x="340" y="282" text-anchor="middle" dominant-baseline="central">Beats baseline?</text></g>
<line class="arr" x1="432" y1="270" x2="496" y2="270" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="500" y="245" width="130" height="50" rx="4" stroke-width="0.5"/><text class="th" x="565" y="262" text-anchor="middle" dominant-baseline="central">Back to modeling</text><text class="ts" x="565" y="282" text-anchor="middle" dominant-baseline="central">If gate fails</text></g>
<line class="arr" x1="340" y1="297" x2="340" y2="322" marker-end="url(#arrow)"/>
<rect x="40" y="325" width="600" height="115" rx="8" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="55" y="343" dominant-baseline="central">Online evaluation</text>
<g class="node c-purple"><rect x="55" y="360" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="140" y="380" text-anchor="middle" dominant-baseline="central">Shadow mode</text><text class="ts" x="140" y="402" text-anchor="middle" dominant-baseline="central">Real traffic, no effect</text></g>
<g class="node c-purple"><rect x="250" y="360" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="335" y="380" text-anchor="middle" dominant-baseline="central">A/B test</text><text class="ts" x="335" y="402" text-anchor="middle" dominant-baseline="central">Power, guardrails</text></g>
<g class="node c-purple"><rect x="445" y="360" width="170" height="60" rx="4" stroke-width="0.5"/><text class="th" x="530" y="380" text-anchor="middle" dominant-baseline="central">Interleaving</text><text class="ts" x="530" y="402" text-anchor="middle" dominant-baseline="central">Fast ranking tests</text></g>
<line class="arr" x1="340" y1="442" x2="340" y2="467" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="250" y="470" width="180" height="44" rx="4" stroke-width="0.5"/><text class="th" x="340" y="492" text-anchor="middle" dominant-baseline="central">Launch decision</text></g>
</svg>