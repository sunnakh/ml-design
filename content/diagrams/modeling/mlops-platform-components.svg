<svg width="100%" viewBox="0 0 680 400" role="img"><title>MLOps platform components</title><desc>Three columns. Offline training: data versioning, training, experiment tracking, orchestration. Shared stores: data warehouse, feature store, model registry, CI/CD. Online serving: client request, model serving, rollout, monitoring. Feature store feeds training and serving; experiment tracking promotes to the registry; registry feeds rollout, which deploys to serving.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="40" width="180" height="320" rx="4" fill="none" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="130" y="60" text-anchor="middle" dominant-baseline="central">Offline training</text>
<rect x="250" y="40" width="180" height="320" rx="4" fill="none" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="340" y="60" text-anchor="middle" dominant-baseline="central">Shared stores</text>
<rect x="460" y="40" width="180" height="320" rx="4" fill="none" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="550" y="60" text-anchor="middle" dominant-baseline="central">Online serving</text>
<g class="node c-purple"><rect x="50" y="80" width="160" height="52" rx="4" stroke-width="0.5"/><text class="th" x="130" y="97" text-anchor="middle" dominant-baseline="central">Data versioning</text><text class="ts" x="130" y="117" text-anchor="middle" dominant-baseline="central">DVC, lakeFS</text></g>
<g class="node c-purple"><rect x="50" y="150" width="160" height="52" rx="4" stroke-width="0.5"/><text class="th" x="130" y="167" text-anchor="middle" dominant-baseline="central">Training</text><text class="ts" x="130" y="187" text-anchor="middle" dominant-baseline="central">GPU jobs</text></g>
<g class="node c-purple"><rect x="50" y="220" width="160" height="52" rx="4" stroke-width="0.5"/><text class="th" x="130" y="237" text-anchor="middle" dominant-baseline="central">Experiment tracking</text><text class="ts" x="130" y="257" text-anchor="middle" dominant-baseline="central">MLflow, W&amp;B</text></g>
<g class="node c-purple"><rect x="50" y="290" width="160" height="52" rx="4" stroke-width="0.5"/><text class="th" x="130" y="307" text-anchor="middle" dominant-baseline="central">Orchestration</text><text class="ts" x="130" y="327" text-anchor="middle" dominant-baseline="central">Airflow, Kubeflow</text></g>
<g class="c-gray"><rect x="260" y="80" width="160" height="52" rx="4" stroke-width="0.5"/><text class="th" x="340" y="97" text-anchor="middle" dominant-baseline="central">Data warehouse</text><text class="ts" x="340" y="117" text-anchor="middle" dominant-baseline="central">Raw events, logs</text></g>
<g class="node c-teal"><rect x="260" y="150" width="160" height="52" rx="4" stroke-width="0.5"/><text class="th" x="340" y="167" text-anchor="middle" dominant-baseline="central">Feature store</text><text class="ts" x="340" y="187" text-anchor="middle" dominant-baseline="central">Feast, Tecton</text></g>
<g class="node c-teal"><rect x="260" y="220" width="160" height="52" rx="4" stroke-width="0.5"/><text class="th" x="340" y="237" text-anchor="middle" dominant-baseline="central">Model registry</text><text class="ts" x="340" y="257" text-anchor="middle" dominant-baseline="central">Versions, stages</text></g>
<g class="node c-teal"><rect x="260" y="290" width="160" height="52" rx="4" stroke-width="0.5"/><text class="th" x="340" y="307" text-anchor="middle" dominant-baseline="central">CI/CD for ML</text><text class="ts" x="340" y="327" text-anchor="middle" dominant-baseline="central">Test, build, ship</text></g>
<g class="c-gray"><rect x="470" y="80" width="160" height="52" rx="4" stroke-width="0.5"/><text class="th" x="550" y="97" text-anchor="middle" dominant-baseline="central">Client request</text><text class="ts" x="550" y="117" text-anchor="middle" dominant-baseline="central">App, API call</text></g>
<g class="node c-coral"><rect x="470" y="150" width="160" height="52" rx="4" stroke-width="0.5"/><text class="th" x="550" y="167" text-anchor="middle" dominant-baseline="central">Model serving</text><text class="ts" x="550" y="187" text-anchor="middle" dominant-baseline="central">Triton, KServe</text></g>
<g class="node c-coral"><rect x="470" y="220" width="160" height="52" rx="4" stroke-width="0.5"/><text class="th" x="550" y="237" text-anchor="middle" dominant-baseline="central">Rollout</text><text class="ts" x="550" y="257" text-anchor="middle" dominant-baseline="central">Shadow, canary</text></g>
<g class="node c-coral"><rect x="470" y="290" width="160" height="52" rx="4" stroke-width="0.5"/><text class="th" x="550" y="307" text-anchor="middle" dominant-baseline="central">Monitoring</text><text class="ts" x="550" y="327" text-anchor="middle" dominant-baseline="central">Drift, latency</text></g>
