<svg width="100%" viewBox="0 0 680 400" role="img"><title>Objective ladder</title><desc>Four rungs from business goal to loss: business goal grow GMV over months, online metric purchases per session over days, ML target clicked or bought per example, loss log loss per gradient step. A dashed loop from loss back to business goal passes through an A/B test box that verifies the link.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="120" y="40" width="360" height="56" rx="4" stroke-width="0.5"/><text class="th" x="300" y="58" text-anchor="middle" dominant-baseline="central">Business goal</text><text class="ts" x="300" y="78" text-anchor="middle" dominant-baseline="central">Grow GMV · measured in months</text></g>
<g class="c-purple"><rect x="120" y="120" width="360" height="56" rx="4" stroke-width="0.5"/><text class="th" x="300" y="138" text-anchor="middle" dominant-baseline="central">Online metric</text><text class="ts" x="300" y="158" text-anchor="middle" dominant-baseline="central">Purchases per session · in days</text></g>
<g class="c-teal"><rect x="120" y="200" width="360" height="56" rx="4" stroke-width="0.5"/><text class="th" x="300" y="218" text-anchor="middle" dominant-baseline="central">ML target</text><text class="ts" x="300" y="238" text-anchor="middle" dominant-baseline="central">Clicked? Bought? · per example</text></g>
<g class="c-teal"><rect x="120" y="280" width="360" height="56" rx="4" stroke-width="0.5"/><text class="th" x="300" y="298" text-anchor="middle" dominant-baseline="central">Loss</text><text class="ts" x="300" y="318" text-anchor="middle" dominant-baseline="central">Log loss · per gradient step</text></g>
<g class="c-gray"><rect x="510" y="160" width="120" height="56" rx="4" stroke-width="0.5"/><text class="th" x="570" y="178" text-anchor="middle" dominant-baseline="central">A/B test</text><text class="ts" x="570" y="198" text-anchor="middle" dominant-baseline="central">Verifies link</text></g>
<line class="arr" x1="300" y1="98" x2="300" y2="116" marker-end="url(#arrow)"/>
<line class="arr" x1="300" y1="178" x2="300" y2="196" marker-end="url(#arrow)"/>
<line class="arr" x1="300" y1="258" x2="300" y2="276" marker-end="url(#arrow)"/>
<path class="arr" d="M482 308 L570 308 L570 220" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path class="arr" d="M570 158 L570 68 L484 68" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="120" y="364" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="140" y="370" dominant-baseline="central">Business side</text>
<g class="c-teal"><rect x="250" y="364" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="270" y="370" dominant-baseline="central">Model side</text>
</svg>