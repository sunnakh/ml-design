<svg width="100%" viewBox="0 0 680 180" role="img"><title>Multi-stage ranking funnel</title><desc>Item corpus of millions flows to retrieval producing top 1000 with a cheap model, then ranking producing top 100 with a heavy model, then re-ranking producing top 10 with business rules. Boxes shrink to show the funnel.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="40" width="125" height="100" rx="4" stroke-width="0.5"/><text class="th" x="102.5" y="80" text-anchor="middle" dominant-baseline="central">Item corpus</text><text class="ts" x="102.5" y="102" text-anchor="middle" dominant-baseline="central">Millions</text></g>
<g class="node c-teal"><rect x="195" y="50" width="125" height="80" rx="4" stroke-width="0.5"/><text class="th" x="257.5" y="80" text-anchor="middle" dominant-baseline="central">Retrieval</text><text class="ts" x="257.5" y="102" text-anchor="middle" dominant-baseline="central">Top 1k, cheap</text></g>
<g class="node c-teal"><rect x="350" y="58" width="125" height="64" rx="4" stroke-width="0.5"/><text class="th" x="412.5" y="80" text-anchor="middle" dominant-baseline="central">Ranking</text><text class="ts" x="412.5" y="102" text-anchor="middle" dominant-baseline="central">Top 100, heavy</text></g>
<g class="node c-teal"><rect x="505" y="66" width="125" height="48" rx="4" stroke-width="0.5"/><text class="th" x="567.5" y="80" text-anchor="middle" dominant-baseline="central">Re-ranking</text><text class="ts" x="567.5" y="100" text-anchor="middle" dominant-baseline="central">Top 10, rules</text></g>
<line class="arr" x1="167" y1="90" x2="191" y2="90" marker-end="url(#arrow)"/>
<line class="arr" x1="322" y1="90" x2="346" y2="90" marker-end="url(#arrow)"/>
<line class="arr" x1="477" y1="90" x2="501" y2="90" marker-end="url(#arrow)"/>
</svg>