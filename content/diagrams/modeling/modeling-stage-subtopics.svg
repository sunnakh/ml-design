<g class="node c-teal"><rect x="190" y="298" width="300" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="316" text-anchor="middle" dominant-baseline="central">Scaling training</text><text class="ts" x="340" y="338" text-anchor="middle" dominant-baseline="central">Distributed, hardware</text></g>
<g class="node c-teal"><rect x="190" y="384" width="300" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="402" text-anchor="middle" dominant-baseline="central">Tuning and debugging</text><text class="ts" x="340" y="424" text-anchor="middle" dominant-baseline="central">Hyperparams, overfit, tracking</text></g>
