<svg width="100%" viewBox="0 0 680 480" role="img"><title>Modeling stage subtopics</title><desc>Five steps top to bottom: baseline, model selection, training setup, scaling training, tuning and debugging, with a dashed loop from tuning back to model selection.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-teal"><rect x="190" y="40" width="300" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Baseline</text><text class="ts" x="340" y="80" text-anchor="middle" dominant-baseline="central">Heuristic or simple model</text></g>
<g class="node c-teal"><rect x="190" y="126" width="300" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="144" text-anchor="middle" dominant-baseline="central">Model selection</text><text class="ts" x="340" y="166" text-anchor="middle" dominant-baseline="central">Quality vs latency vs cost</text></g>
