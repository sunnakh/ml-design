<svg width="100%" viewBox="0 0 680 450" role="img"><title>Explanation tiers by audience</title><desc>Five audiences from coarse and public to detailed and restricted: declined customer gets a coarse reason and next step; support agent gets reason codes and an override path; fraud analyst gets top drivers and linked entities; auditor or regulator gets logic, validation and decision logs; model developer gets full attributions and slices.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="40" y="56" width="440" height="56" rx="4" stroke-width="0.5"/><text class="th" x="260" y="74" text-anchor="middle" dominant-baseline="central">Declined customer</text><text class="ts" x="260" y="96" text-anchor="middle" dominant-baseline="central">Coarse reason, next step</text></g>
<g class="c-purple"><rect x="40" y="128" width="440" height="56" rx="4" stroke-width="0.5"/><text class="th" x="260" y="146" text-anchor="middle" dominant-baseline="central">Support agent</text><text class="ts" x="260" y="168" text-anchor="middle" dominant-baseline="central">Reason codes, override path</text></g>
<g class="c-purple"><rect x="40" y="200" width="440" height="56" rx="4" stroke-width="0.5"/><text class="th" x="260" y="218" text-anchor="middle" dominant-baseline="central">Fraud analyst</text><text class="ts" x="260" y="240" text-anchor="middle" dominant-baseline="central">Top drivers, linked entities</text></g>
<g class="c-purple"><rect x="40" y="272" width="440" height="56" rx="4" stroke-width="0.5"/><text class="th" x="260" y="290" text-anchor="middle" dominant-baseline="central">Auditor, regulator</text><text class="ts" x="260" y="312" text-anchor="middle" dominant-baseline="central">Logic, validation, decision logs</text></g>
<g class="c-purple"><rect x="40" y="344" width="440" height="56" rx="4" stroke-width="0.5"/><text class="th" x="260" y="362" text-anchor="middle" dominant-baseline="central">Model developer</text><text class="ts" x="260" y="384" text-anchor="middle" dominant-baseline="central">Full attributions, slices</text></g>
<text class="ts" x="570" y="40" text-anchor="middle" dominant-baseline="central">Coarse, public</text>
<line x1="570" y1="56" x2="570" y2="398" stroke="var(--text-secondary)" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="570" y="420" text-anchor="middle" dominant-baseline="central">Detailed, restricted</text>
</svg>