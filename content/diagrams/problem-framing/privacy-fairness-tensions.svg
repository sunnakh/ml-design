<svg width="100%" viewBox="0 0 680 450" role="img"><title>Tensions between fraud detection, privacy and fairness</title><desc>Three goals in a triangle. Fraud detection wants more data; privacy wants less data; fairness needs group data to audit. Fraud versus privacy: VPN users look risky. Fraud versus fairness: proxies skew declines. Privacy versus fairness: auditing needs data.</desc>
<g class="c-purple"><rect x="240" y="40" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Fraud detection</text><text class="ts" x="340" y="80" text-anchor="middle" dominant-baseline="central">Wants more data</text></g>
<g class="c-purple"><rect x="40" y="300" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="140" y="318" text-anchor="middle" dominant-baseline="central">Privacy</text><text class="ts" x="140" y="340" text-anchor="middle" dominant-baseline="central">Wants less data</text></g>
<g class="c-purple"><rect x="440" y="300" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="540" y="318" text-anchor="middle" dominant-baseline="central">Fairness</text><text class="ts" x="540" y="340" text-anchor="middle" dominant-baseline="central">Needs group data to audit</text></g>
<line x1="290" y1="98" x2="160" y2="298" stroke="var(--text-secondary)" stroke-width="0.5"/>
<line x1="390" y1="98" x2="520" y2="298" stroke="var(--text-secondary)" stroke-width="0.5"/>
<line x1="242" y1="328" x2="438" y2="328" stroke="var(--text-secondary)" stroke-width="0.5"/>
<g class="c-coral"><rect x="40" y="172" width="160" height="52" rx="4" stroke-width="0.5"/><text class="th" x="120" y="189" text-anchor="middle" dominant-baseline="central">Fraud vs privacy</text><text class="ts" x="120" y="209" text-anchor="middle" dominant-baseline="central">VPN users look risky</text></g>
<g class="c-coral"><rect x="480" y="172" width="160" height="52" rx="4" stroke-width="0.5"/><text class="th" x="560" y="189" text-anchor="middle" dominant-baseline="central">Fraud vs fairness</text><text class="ts" x="560" y="209" text-anchor="middle" dominant-baseline="central">Proxies skew declines</text></g>
<g class="c-coral"><rect x="250" y="372" width="180" height="52" rx="4" stroke-width="0.5"/><text class="th" x="340" y="389" text-anchor="middle" dominant-baseline="central">Privacy vs fairness</text><text class="ts" x="340" y="409" text-anchor="middle" dominant-baseline="central">Auditing needs data</text></g>
</svg>