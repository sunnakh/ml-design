<svg width="100%" viewBox="0 0 680 470" role="img"><title>Volume and affordable cost by prediction unit</title><desc>Funnel from top to bottom: clickstream events about 5 billion per year handled with stream aggregates only; logins about 150 million with a light model and cascade; payment attempts about 30 million with rate limits and rules; orders about 10 million with the full model and vendor calls in the uncertain band; manual reviews about 0.7 million at 3 dollars of human time each; chargebacks about 20 thousand used as labels and disputes. Volume falls going down while affordable cost per item rises.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="40" y="60" width="520" height="52" rx="4" stroke-width="0.5"/><text class="th" x="300" y="77" text-anchor="middle" dominant-baseline="central">Clickstream events</text><text class="ts" x="300" y="97" text-anchor="middle" dominant-baseline="central">~5B/yr · stream aggregates only</text></g>
<g class="c-teal"><rect x="75" y="124" width="450" height="52" rx="4" stroke-width="0.5"/><text class="th" x="300" y="141" text-anchor="middle" dominant-baseline="central">Logins</text><text class="ts" x="300" y="161" text-anchor="middle" dominant-baseline="central">~150M/yr · light model, cascade</text></g>
<g class="c-teal"><rect x="110" y="188" width="380" height="52" rx="4" stroke-width="0.5"/><text class="th" x="300" y="205" text-anchor="middle" dominant-baseline="central">Payment attempts</text><text class="ts" x="300" y="225" text-anchor="middle" dominant-baseline="central">~30M/yr · rate limits, rules</text></g>
<g class="c-purple"><rect x="145" y="252" width="310" height="52" rx="4" stroke-width="0.5"/><text class="th" x="300" y="269" text-anchor="middle" dominant-baseline="central">Orders</text><text class="ts" x="300" y="289" text-anchor="middle" dominant-baseline="central">~10M/yr · full model + vendor</text></g>
<g class="c-coral"><rect x="175" y="316" width="250" height="52" rx="4" stroke-width="0.5"/><text class="th" x="300" y="333" text-anchor="middle" dominant-baseline="central">Manual reviews</text><text class="ts" x="300" y="353" text-anchor="middle" dominant-baseline="central">~0.7M/yr · $3 human each</text></g>
<g class="c-coral"><rect x="200" y="380" width="200" height="52" rx="4" stroke-width="0.5"/><text class="th" x="300" y="397" text-anchor="middle" dominant-baseline="central">Chargebacks</text><text class="ts" x="300" y="417" text-anchor="middle" dominant-baseline="central">~20k/yr · labels, disputes</text></g>
<text class="ts" x="605" y="48" text-anchor="middle" dominant-baseline="central">Many, cheap each</text>
<line x1="605" y1="64" x2="605" y2="424" stroke="var(--text-secondary)" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="605" y="448" text-anchor="middle" dominant-baseline="central">Few, costly each</text>
</svg>