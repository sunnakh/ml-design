<svg width="100%" viewBox="0 0 680 270" role="img"><title>Hybrid rules and model pipeline</title><desc>An order passes hard rules (blocklists, law), then the model producing p of fraud, then the cost policy picking the cheapest action, then override rules for analyst hotfixes. Hard rules can instantly decline known bad orders; if the model is down, rules act as fallback; the final action comes after overrides.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="40" width="130" height="56" rx="4" stroke-width="0.5"/><text class="th" x="105" y="58" text-anchor="middle" dominant-baseline="central">Hard rules</text><text class="ts" x="105" y="80" text-anchor="middle" dominant-baseline="central">Blocklist, law</text></g>
<g class="c-purple"><rect x="196" y="40" width="130" height="56" rx="4" stroke-width="0.5"/><text class="th" x="261" y="58" text-anchor="middle" dominant-baseline="central">Model</text><text class="ts" x="261" y="80" text-anchor="middle" dominant-baseline="central">p(fraud)</text></g>
<g class="c-teal"><rect x="352" y="40" width="130" height="56" rx="4" stroke-width="0.5"/><text class="th" x="417" y="58" text-anchor="middle" dominant-baseline="central">Cost policy</text><text class="ts" x="417" y="80" text-anchor="middle" dominant-baseline="central">Cheapest action</text></g>
<g class="c-gray"><rect x="508" y="40" width="130" height="56" rx="4" stroke-width="0.5"/><text class="th" x="573" y="58" text-anchor="middle" dominant-baseline="central">Override rules</text><text class="ts" x="573" y="80" text-anchor="middle" dominant-baseline="central">Analyst hotfix</text></g>
<g class="c-gray"><rect x="40" y="150" width="130" height="56" rx="4" stroke-width="0.5"/><text class="th" x="105" y="168" text-anchor="middle" dominant-baseline="central">Instant decline</text><text class="ts" x="105" y="190" text-anchor="middle" dominant-baseline="central">Known bad</text></g>
<g class="c-gray"><rect x="196" y="150" width="130" height="56" rx="4" stroke-width="0.5"/><text class="th" x="261" y="168" text-anchor="middle" dominant-baseline="central">Rules fallback</text><text class="ts" x="261" y="190" text-anchor="middle" dominant-baseline="central">If model down</text></g>
<g class="c-teal"><rect x="508" y="150" width="130" height="56" rx="4" stroke-width="0.5"/><text class="th" x="573" y="168" text-anchor="middle" dominant-baseline="central">Final action</text><text class="ts" x="573" y="190" text-anchor="middle" dominant-baseline="central">Approve to decline</text></g>
<line class="arr" x1="172" y1="68" x2="192" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="328" y1="68" x2="348" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="484" y1="68" x2="504" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="105" y1="98" x2="105" y2="146" marker-end="url(#arrow)"/>
<line class="arr" x1="261" y1="98" x2="261" y2="146" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line class="arr" x1="573" y1="98" x2="573" y2="146" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="236" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="60" y="242" dominant-baseline="central">Rules</text>
<g class="c-purple"><rect x="120" y="236" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="140" y="242" dominant-baseline="central">Model</text>
<g class="c-teal"><rect x="200" y="236" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="220" y="242" dominant-baseline="central">Policy</text>
<line class="arr" x1="290" y1="242" x2="322" y2="242" stroke-dasharray="4 3"/><text class="ts" x="332" y="242" dominant-baseline="central">Degraded path</text>
</svg>