<svg width="100%" viewBox="0 0 680 424" role="img"><title>Proxy chain from training loss to business value</title><desc>Four linked steps: training loss (log loss on labels), prediction (calibrated p of fraud), decision (cost policy action), business value (TCF over a quarter). Between each pair sits a gap: label gap (chargeback is not fraud), calibration gap (score is not probability), outcome gap (action effects and adversaries).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="60" y="40" width="260" height="56" rx="4" stroke-width="0.5"/><text class="th" x="190" y="58" text-anchor="middle" dominant-baseline="central">Training loss</text><text class="ts" x="190" y="80" text-anchor="middle" dominant-baseline="central">Log loss on labels</text></g>
<g class="c-purple"><rect x="60" y="136" width="260" height="56" rx="4" stroke-width="0.5"/><text class="th" x="190" y="154" text-anchor="middle" dominant-baseline="central">Prediction</text><text class="ts" x="190" y="176" text-anchor="middle" dominant-baseline="central">Calibrated p(fraud)</text></g>
<g class="c-purple"><rect x="60" y="232" width="260" height="56" rx="4" stroke-width="0.5"/><text class="th" x="190" y="250" text-anchor="middle" dominant-baseline="central">Decision</text><text class="ts" x="190" y="272" text-anchor="middle" dominant-baseline="central">Cost policy picks action</text></g>
<g class="c-purple"><rect x="60" y="328" width="260" height="56" rx="4" stroke-width="0.5"/><text class="th" x="190" y="346" text-anchor="middle" dominant-baseline="central">Business value</text><text class="ts" x="190" y="368" text-anchor="middle" dominant-baseline="central">TCF over a quarter</text></g>
<line class="arr" x1="190" y1="98" x2="190" y2="132" marker-end="url(#arrow)"/>
<line class="arr" x1="190" y1="194" x2="190" y2="228" marker-end="url(#arrow)"/>
<line class="arr" x1="190" y1="290" x2="190" y2="324" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="380" y="88" width="260" height="56" rx="4" stroke-width="0.5"/><text class="th" x="510" y="106" text-anchor="middle" dominant-baseline="central">Label gap</text><text class="ts" x="510" y="128" text-anchor="middle" dominant-baseline="central">Chargeback is not fraud</text></g>
<g class="c-coral"><rect x="380" y="184" width="260" height="56" rx="4" stroke-width="0.5"/><text class="th" x="510" y="202" text-anchor="middle" dominant-baseline="central">Calibration gap</text><text class="ts" x="510" y="224" text-anchor="middle" dominant-baseline="central">Score is not probability</text></g>
<g class="c-coral"><rect x="380" y="280" width="260" height="56" rx="4" stroke-width="0.5"/><text class="th" x="510" y="298" text-anchor="middle" dominant-baseline="central">Outcome gap</text><text class="ts" x="510" y="320" text-anchor="middle" dominant-baseline="central">Action effects, adversaries</text></g>
<line class="leader" x1="196" y1="116" x2="376" y2="116"/>
<line class="leader" x1="196" y1="212" x2="376" y2="212"/>
<line class="leader" x1="196" y1="308" x2="376" y2="308"/>
</svg>