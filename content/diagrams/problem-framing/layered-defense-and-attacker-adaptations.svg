<svg width="100%" viewBox="0 0 680 470" role="img"><title>Layered fraud defense and attacker adaptations</title><desc>Five defense layers in order: rate limits against probing and card testing; rules and blocklists against known bad entities in minutes; model and cost policy for broad patterns, monthly; step-up to raise attacker cost; manual review for ambiguous high-value orders. Each has an attacker adaptation: slow distributed probing, fresh identities, feature mimicry, bypassing step-up with phished codes, social engineering support. Confirmed fraud from review feeds back to blocklists.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="60" y="40" width="280" height="28" rx="4" stroke-width="0.5"/><text class="th" x="200" y="54" text-anchor="middle" dominant-baseline="central">Defense layer</text></g>
<g class="c-gray"><rect x="400" y="40" width="240" height="28" rx="4" stroke-width="0.5"/><text class="th" x="520" y="54" text-anchor="middle" dominant-baseline="central">Attacker adaptation</text></g>
<g class="c-teal"><rect x="60" y="84" width="280" height="52" rx="4" stroke-width="0.5"/><text class="th" x="200" y="101" text-anchor="middle" dominant-baseline="central">Rate limits</text><text class="ts" x="200" y="121" text-anchor="middle" dominant-baseline="central">Probing, card testing</text></g>
<g class="c-teal"><rect x="60" y="160" width="280" height="52" rx="4" stroke-width="0.5"/><text class="th" x="200" y="177" text-anchor="middle" dominant-baseline="central">Rules and blocklists</text><text class="ts" x="200" y="197" text-anchor="middle" dominant-baseline="central">Known bad, in minutes</text></g>
<g class="c-teal"><rect x="60" y="236" width="280" height="52" rx="4" stroke-width="0.5"/><text class="th" x="200" y="253" text-anchor="middle" dominant-baseline="central">Model and cost policy</text><text class="ts" x="200" y="273" text-anchor="middle" dominant-baseline="central">Broad patterns, monthly</text></g>
<g class="c-teal"><rect x="60" y="312" width="280" height="52" rx="4" stroke-width="0.5"/><text class="th" x="200" y="329" text-anchor="middle" dominant-baseline="central">Step-up</text><text class="ts" x="200" y="349" text-anchor="middle" dominant-baseline="central">Raises attacker cost</text></g>
<g class="c-teal"><rect x="60" y="388" width="280" height="52" rx="4" stroke-width="0.5"/><text class="th" x="200" y="405" text-anchor="middle" dominant-baseline="central">Manual review</text><text class="ts" x="200" y="425" text-anchor="middle" dominant-baseline="central">Ambiguous, high value</text></g>
<g class="c-coral"><rect x="400" y="84" width="240" height="52" rx="4" stroke-width="0.5"/><text class="th" x="520" y="101" text-anchor="middle" dominant-baseline="central">Slow probing</text><text class="ts" x="520" y="121" text-anchor="middle" dominant-baseline="central">Spread across accounts</text></g>
<g class="c-coral"><rect x="400" y="160" width="240" height="52" rx="4" stroke-width="0.5"/><text class="th" x="520" y="177" text-anchor="middle" dominant-baseline="central">Fresh identities</text><text class="ts" x="520" y="197" text-anchor="middle" dominant-baseline="central">New cards, devices, emails</text></g>
<g class="c-coral"><rect x="400" y="236" width="240" height="52" rx="4" stroke-width="0.5"/><text class="th" x="520" y="253" text-anchor="middle" dominant-baseline="central">Feature mimicry</text><text class="ts" x="520" y="273" text-anchor="middle" dominant-baseline="central">Aged accounts, proxies</text></g>
<g class="c-coral"><rect x="400" y="312" width="240" height="52" rx="4" stroke-width="0.5"/><text class="th" x="520" y="329" text-anchor="middle" dominant-baseline="central">Bypass step-up</text><text class="ts" x="520" y="349" text-anchor="middle" dominant-baseline="central">Phished one-time codes</text></g>
<g class="c-coral"><rect x="400" y="388" width="240" height="52" rx="4" stroke-width="0.5"/><text class="th" x="520" y="405" text-anchor="middle" dominant-baseline="central">Social engineering</text><text class="ts" x="520" y="425" text-anchor="middle" dominant-baseline="central">Talk support into overrides</text></g>
<line class="arr" x1="200" y1="138" x2="200" y2="156" marker-end="url(#arrow)"/>
<line class="arr" x1="200" y1="214" x2="200" y2="232" marker-end="url(#arrow)"/>
<line class="arr" x1="200" y1="290" x2="200" y2="308" marker-end="url(#arrow)"/>
<line class="arr" x1="200" y1="366" x2="200" y2="384" marker-end="url(#arrow)"/>
