<svg width="100%" viewBox="0 0 680 430" role="img"><title>Risk matrix for ShopFast fraud ML</title><desc>Two by two matrix of likelihood by impact. High likelihood, high impact: online gain shrinks, adversary adapts. Low likelihood, high impact: checkout outage, fairness finding. High likelihood, low impact: feature nulls. Low likelihood, low impact: vendor price hike. Each risk shows its mitigation.</desc>
<g class="c-gray"><rect x="160" y="40" width="230" height="32" rx="4" stroke-width="0.5"/><text class="th" x="275" y="56" text-anchor="middle" dominant-baseline="central">Low likelihood</text></g>
<g class="c-gray"><rect x="410" y="40" width="230" height="32" rx="4" stroke-width="0.5"/><text class="th" x="525" y="56" text-anchor="middle" dominant-baseline="central">High likelihood</text></g>
<g class="c-gray"><rect x="40" y="90" width="110" height="160" rx="4" stroke-width="0.5"/><text class="th" x="95" y="170" text-anchor="middle" dominant-baseline="central">High impact</text></g>
<g class="c-gray"><rect x="40" y="270" width="110" height="130" rx="4" stroke-width="0.5"/><text class="th" x="95" y="335" text-anchor="middle" dominant-baseline="central">Low impact</text></g>
<rect x="160" y="90" width="230" height="160" rx="4" fill="none" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="4 3"/>
<rect x="410" y="90" width="230" height="160" rx="4" fill="none" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="4 3"/>
<rect x="160" y="270" width="230" height="130" rx="4" fill="none" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="4 3"/>
<rect x="410" y="270" width="230" height="130" rx="4" fill="none" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="4 3"/>
<g class="c-coral"><rect x="175" y="104" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="275" y="122" text-anchor="middle" dominant-baseline="central">Checkout outage</text><text class="ts" x="275" y="144" text-anchor="middle" dominant-baseline="central">Mitigate: rules fallback</text></g>
<g class="c-coral"><rect x="175" y="178" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="275" y="196" text-anchor="middle" dominant-baseline="central">Fairness finding</text><text class="ts" x="275" y="218" text-anchor="middle" dominant-baseline="central">Mitigate: segment audit</text></g>
<g class="c-coral"><rect x="425" y="104" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="525" y="122" text-anchor="middle" dominant-baseline="central">Online gain shrinks</text><text class="ts" x="525" y="144" text-anchor="middle" dominant-baseline="central">Mitigate: staged A/B</text></g>
<g class="c-coral"><rect x="425" y="178" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="525" y="196" text-anchor="middle" dominant-baseline="central">Adversary adapts</text><text class="ts" x="525" y="218" text-anchor="middle" dominant-baseline="central">Mitigate: retrain, rules</text></g>
<g class="c-gray"><rect x="175" y="307" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="275" y="325" text-anchor="middle" dominant-baseline="central">Vendor price hike</text><text class="ts" x="275" y="347" text-anchor="middle" dominant-baseline="central">Mitigate: contract cap</text></g>
<g class="c-gray"><rect x="425" y="307" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="525" y="325" text-anchor="middle" dominant-baseline="central">Feature nulls</text><text class="ts" x="525" y="347" text-anchor="middle" dominant-baseline="central">Mitigate: safe defaults</text></g>
</svg>