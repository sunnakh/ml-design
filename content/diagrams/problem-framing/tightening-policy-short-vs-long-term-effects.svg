<svg width="100%" viewBox="0 0 680 300" role="img"><title>Short and long term effects of tightening fraud policy</title><desc>Two by two grid. Short-term benefit: fraud loss drops, seen in weeks. Long-term benefit: attackers go elsewhere, deterrence compounds. Short-term cost: lost order margin, one sale each. Long-term cost: churn and fewer labels, lifetime value loss and blind spots. Long-term cells are dashed because standard A/B tests do not see them.</desc>
<g class="c-gray"><rect x="160" y="40" width="230" height="32" rx="4" stroke-width="0.5"/><text class="th" x="275" y="56" text-anchor="middle" dominant-baseline="central">Short term (weeks)</text></g>
<g class="c-gray"><rect x="410" y="40" width="230" height="32" rx="4" stroke-width="0.5"/><text class="th" x="525" y="56" text-anchor="middle" dominant-baseline="central">Long term (months, years)</text></g>
<g class="c-gray"><rect x="40" y="90" width="110" height="70" rx="4" stroke-width="0.5"/><text class="th" x="95" y="125" text-anchor="middle" dominant-baseline="central">Benefits</text></g>
<g class="c-gray"><rect x="40" y="180" width="110" height="70" rx="4" stroke-width="0.5"/><text class="th" x="95" y="215" text-anchor="middle" dominant-baseline="central">Costs</text></g>
<g class="c-teal"><rect x="160" y="90" width="230" height="70" rx="4" stroke-width="0.5"/><text class="th" x="275" y="114" text-anchor="middle" dominant-baseline="central">Fraud loss drops</text><text class="ts" x="275" y="138" text-anchor="middle" dominant-baseline="central">Seen within weeks</text></g>
<g class="c-teal"><rect x="410" y="90" width="230" height="70" rx="4" stroke-width="0.5" stroke-dasharray="5 4"/><text class="th" x="525" y="114" text-anchor="middle" dominant-baseline="central">Attackers go elsewhere</text><text class="ts" x="525" y="138" text-anchor="middle" dominant-baseline="central">Deterrence compounds</text></g>
<g class="c-coral"><rect x="160" y="180" width="230" height="70" rx="4" stroke-width="0.5"/><text class="th" x="275" y="204" text-anchor="middle" dominant-baseline="central">Lost order margin</text><text class="ts" x="275" y="228" text-anchor="middle" dominant-baseline="central">One sale each</text></g>
<g class="c-coral"><rect x="410" y="180" width="230" height="70" rx="4" stroke-width="0.5" stroke-dasharray="5 4"/><text class="th" x="525" y="204" text-anchor="middle" dominant-baseline="central">Churn, fewer labels</text><text class="ts" x="525" y="228" text-anchor="middle" dominant-baseline="central">LTV loss, blind spots</text></g>
<rect x="40" y="272" width="24" height="12" rx="2" fill="none" stroke="var(--text-secondary)" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="72" y="278" dominant-baseline="central">Dashed: invisible to standard A/B tests</text>
</svg>