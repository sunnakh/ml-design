<svg width="100%" viewBox="0 0 680 300" role="img"><title>ML system design stages</title><desc>Eight stages in a snake layout: problem framing, requirements, data, features, then modeling, evaluation, deployment, monitoring, with a feedback loop from monitoring back to problem framing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="40" y="40" width="125" height="60" rx="4" stroke-width="0.5"/><text class="th" x="102.5" y="60" text-anchor="middle" dominant-baseline="central">Problem framing</text><text class="ts" x="102.5" y="82" text-anchor="middle" dominant-baseline="central">Goal to ML task</text></g>
<g class="node c-gray"><rect x="195" y="40" width="125" height="60" rx="4" stroke-width="0.5"/><text class="th" x="257.5" y="60" text-anchor="middle" dominant-baseline="central">Requirements</text><text class="ts" x="257.5" y="82" text-anchor="middle" dominant-baseline="central">Metrics, scale</text></g>
<g class="node c-teal"><rect x="350" y="40" width="125" height="60" rx="4" stroke-width="0.5"/><text class="th" x="412.5" y="60" text-anchor="middle" dominant-baseline="central">Data</text><text class="ts" x="412.5" y="82" text-anchor="middle" dominant-baseline="central">Collect, label</text></g>
<g class="node c-teal"><rect x="505" y="40" width="125" height="60" rx="4" stroke-width="0.5"/><text class="th" x="567.5" y="60" text-anchor="middle" dominant-baseline="central">Features</text><text class="ts" x="567.5" y="82" text-anchor="middle" dominant-baseline="central">Engineer, store</text></g>
<g class="node c-teal"><rect x="505" y="160" width="125" height="60" rx="4" stroke-width="0.5"/><text class="th" x="567.5" y="180" text-anchor="middle" dominant-baseline="central">Modeling</text><text class="ts" x="567.5" y="202" text-anchor="middle" dominant-baseline="central">Baseline, train</text></g>
<g class="node c-teal"><rect x="350" y="160" width="125" height="60" rx="4" stroke-width="0.5"/><text class="th" x="412.5" y="180" text-anchor="middle" dominant-baseline="central">Evaluation</text><text class="ts" x="412.5" y="202" text-anchor="middle" dominant-baseline="central">Offline, A/B</text></g>
<g class="node c-coral"><rect x="195" y="160" width="125" height="60" rx="4" stroke-width="0.5"/><text class="th" x="257.5" y="180" text-anchor="middle" dominant-baseline="central">Deployment</text><text class="ts" x="257.5" y="202" text-anchor="middle" dominant-baseline="central">Serve, scale</text></g>
<g class="node c-coral"><rect x="40" y="160" width="125" height="60" rx="4" stroke-width="0.5"/><text class="th" x="102.5" y="180" text-anchor="middle" dominant-baseline="central">Monitoring</text><text class="ts" x="102.5" y="202" text-anchor="middle" dominant-baseline="central">Drift, retrain</text></g>
<line class="arr" x1="167" y1="70" x2="191" y2="70" marker-end="url(#arrow)"/>
<line class="arr" x1="322" y1="70" x2="346" y2="70" marker-end="url(#arrow)"/>
<line class="arr" x1="477" y1="70" x2="501" y2="70" marker-end="url(#arrow)"/>
<line class="arr" x1="567.5" y1="102" x2="567.5" y2="156" marker-end="url(#arrow)"/>
<line class="arr" x1="503" y1="190" x2="479" y2="190" marker-end="url(#arrow)"/>
<line class="arr" x1="348" y1="190" x2="324" y2="190" marker-end="url(#arrow)"/>
<line class="arr" x1="193" y1="190" x2="169" y2="190" marker-end="url(#arrow)"/>
<line class="arr" x1="102.5" y1="158" x2="102.5" y2="104" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="258" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="60" y="264" dominant-baseline="central">Define</text>
<g class="c-teal"><rect x="130" y="258" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="150" y="264" dominant-baseline="central">Build</text>
<g class="c-coral"><rect x="210" y="258" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="230" y="264" dominant-baseline="central">Ship and operate</text>
<line class="arr" x1="360" y1="264" x2="392" y2="264" stroke-dasharray="4 3"/><text class="ts" x="402" y="264" dominant-baseline="central">Feedback loop</text>
</svg>