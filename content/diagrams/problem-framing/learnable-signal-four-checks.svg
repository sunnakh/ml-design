<svg width="100%" viewBox="0 0 680 450" role="img"><title>Four checks for learnable signal</title><desc>Sequential checks: information, stability, sufficiency, ceiling. Failing any check routes to a fallback: rethink decision point, shorter retrain cycle, simpler model or rules, or fix labels. Passing all leads to signal worth building.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="60" y="40" width="280" height="56" rx="4" stroke-width="0.5"/><text class="th" x="200" y="58" text-anchor="middle" dominant-baseline="central">Information</text><text class="ts" x="200" y="80" text-anchor="middle" dominant-baseline="central">Is y predictable from x at t?</text></g>
<g class="c-purple"><rect x="60" y="120" width="280" height="56" rx="4" stroke-width="0.5"/><text class="th" x="200" y="138" text-anchor="middle" dominant-baseline="central">Stability</text><text class="ts" x="200" y="160" text-anchor="middle" dominant-baseline="central">Does it hold next month?</text></g>
<g class="c-purple"><rect x="60" y="200" width="280" height="56" rx="4" stroke-width="0.5"/><text class="th" x="200" y="218" text-anchor="middle" dominant-baseline="central">Sufficiency</text><text class="ts" x="200" y="240" text-anchor="middle" dominant-baseline="central">Enough positives to learn?</text></g>
<g class="c-purple"><rect x="60" y="280" width="280" height="56" rx="4" stroke-width="0.5"/><text class="th" x="200" y="298" text-anchor="middle" dominant-baseline="central">Ceiling</text><text class="ts" x="200" y="320" text-anchor="middle" dominant-baseline="central">How noisy are the labels?</text></g>
<g class="c-teal"><rect x="60" y="360" width="280" height="56" rx="4" stroke-width="0.5"/><text class="th" x="200" y="378" text-anchor="middle" dominant-baseline="central">Signal worth building</text><text class="ts" x="200" y="400" text-anchor="middle" dominant-baseline="central">Go to data access and ROI</text></g>
<g class="c-coral"><rect x="400" y="40" width="240" height="56" rx="4" stroke-width="0.5"/><text class="th" x="520" y="58" text-anchor="middle" dominant-baseline="central">Rethink decision point</text><text class="ts" x="520" y="80" text-anchor="middle" dominant-baseline="central">Act later or add data</text></g>
<g class="c-coral"><rect x="400" y="120" width="240" height="56" rx="4" stroke-width="0.5"/><text class="th" x="520" y="138" text-anchor="middle" dominant-baseline="central">Faster retrain cycle</text><text class="ts" x="520" y="160" text-anchor="middle" dominant-baseline="central">Rules for fast-moving parts</text></g>
<g class="c-coral"><rect x="400" y="200" width="240" height="56" rx="4" stroke-width="0.5"/><text class="th" x="520" y="218" text-anchor="middle" dominant-baseline="central">Simpler model or rules</text><text class="ts" x="520" y="240" text-anchor="middle" dominant-baseline="central">Or pool data, weak labels</text></g>
<g class="c-coral"><rect x="400" y="280" width="240" height="56" rx="4" stroke-width="0.5"/><text class="th" x="520" y="298" text-anchor="middle" dominant-baseline="central">Fix labels first</text><text class="ts" x="520" y="320" text-anchor="middle" dominant-baseline="central">Redefine the target</text></g>
<line class="arr" x1="200" y1="98" x2="200" y2="116" marker-end="url(#arrow)"/>
<line class="arr" x1="200" y1="178" x2="200" y2="196" marker-end="url(#arrow)"/>
<line class="arr" x1="200" y1="258" x2="200" y2="276" marker-end="url(#arrow)"/>
<line class="arr" x1="200" y1="338" x2="200" y2="356" marker-end="url(#arrow)"/>
<line class="arr" x1="342" y1="68" x2="396" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="342" y1="148" x2="396" y2="148" marker-end="url(#arrow)"/>
<line class="arr" x1="342" y1="228" x2="396" y2="228" marker-end="url(#arrow)"/>
<line class="arr" x1="342" y1="308" x2="396" y2="308" marker-end="url(#arrow)"/>
<text class="ts" x="369" y="56" text-anchor="middle" dominant-baseline="central">No</text>
<text class="ts" x="369" y="136" text-anchor="middle" dominant-baseline="central">No</text>
<text class="ts" x="369" y="216" text-anchor="middle" dominant-baseline="central">No</text>
<text class="ts" x="369" y="296" text-anchor="middle" dominant-baseline="central">No</text>
</svg>