<svg width="100%" viewBox="0 0 680 340" role="img"><title>Metric hierarchy for ShopFast fraud</title><desc>Four stacked layers from top to bottom: business outcome (total cost of fraud, quarterly), online product metrics (approval and chargebacks, weekly), offline model metrics (dollar recall at fixed false positive rate, minutes), system health (score drift and nulls, real time). An arrow at right shows top is closer to value and bottom gives faster feedback.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="140" y="40" width="220" height="56" rx="4" stroke-width="0.5"/><text class="th" x="250" y="58" text-anchor="middle" dominant-baseline="central">Business outcome</text><text class="ts" x="250" y="80" text-anchor="middle" dominant-baseline="central">TCF in dollars · quarterly</text></g>
<g class="c-purple"><rect x="110" y="112" width="280" height="56" rx="4" stroke-width="0.5"/><text class="th" x="250" y="130" text-anchor="middle" dominant-baseline="central">Online product metrics</text><text class="ts" x="250" y="152" text-anchor="middle" dominant-baseline="central">Approval, chargebacks · weekly</text></g>
<g class="c-purple"><rect x="80" y="184" width="340" height="56" rx="4" stroke-width="0.5"/><text class="th" x="250" y="202" text-anchor="middle" dominant-baseline="central">Offline model metrics</text><text class="ts" x="250" y="224" text-anchor="middle" dominant-baseline="central">Dollar recall at fixed FPR · minutes</text></g>
<g class="c-gray"><rect x="50" y="256" width="400" height="56" rx="4" stroke-width="0.5"/><text class="th" x="250" y="274" text-anchor="middle" dominant-baseline="central">System health</text><text class="ts" x="250" y="296" text-anchor="middle" dominant-baseline="central">Score drift, nulls, latency · real time</text></g>
<text class="ts" x="560" y="48" text-anchor="middle" dominant-baseline="central">Closer to value</text>
<line x1="560" y1="64" x2="560" y2="292" stroke="var(--text-secondary)" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="560" y="308" text-anchor="middle" dominant-baseline="central">Faster feedback</text>
</svg>