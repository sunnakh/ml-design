<svg width="100%" viewBox="0 0 680 250" role="img"><title>ShopFast fraud decision points</title><desc>Four decision points along an order's life: account signup, checkout, pre-shipment, after delivery. Information grows over time while the ability to prevent loss shrinks. Checkout is highlighted as the chosen point.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="40" width="135" height="90" rx="4" stroke-width="0.5"/><text class="th" x="107.5" y="60" text-anchor="middle" dominant-baseline="central">Account signup</text><text class="ts" x="107.5" y="86" text-anchor="middle" dominant-baseline="central">Info: low</text><text class="ts" x="107.5" y="108" text-anchor="middle" dominant-baseline="central">Act: verify ID</text></g>
<g class="c-purple"><rect x="195" y="40" width="135" height="90" rx="4" stroke-width="0.5"/><text class="th" x="262.5" y="60" text-anchor="middle" dominant-baseline="central">Checkout</text><text class="ts" x="262.5" y="86" text-anchor="middle" dominant-baseline="central">Info: cart, card</text><text class="ts" x="262.5" y="108" text-anchor="middle" dominant-baseline="central">Act: decline, 3DS</text></g>
<g class="c-gray"><rect x="350" y="40" width="135" height="90" rx="4" stroke-width="0.5"/><text class="th" x="417.5" y="60" text-anchor="middle" dominant-baseline="central">Pre-shipment</text><text class="ts" x="417.5" y="86" text-anchor="middle" dominant-baseline="central">Info: + auth data</text><text class="ts" x="417.5" y="108" text-anchor="middle" dominant-baseline="central">Act: hold, review</text></g>
<g class="c-gray"><rect x="505" y="40" width="135" height="90" rx="4" stroke-width="0.5"/><text class="th" x="572.5" y="60" text-anchor="middle" dominant-baseline="central">After delivery</text><text class="ts" x="572.5" y="86" text-anchor="middle" dominant-baseline="central">Info: ground truth</text><text class="ts" x="572.5" y="108" text-anchor="middle" dominant-baseline="central">Act: dispute only</text></g>
<line class="arr" x1="177" y1="85" x2="192" y2="85" marker-end="url(#arrow)"/>
<line class="arr" x1="332" y1="85" x2="347" y2="85" marker-end="url(#arrow)"/>
<line class="arr" x1="487" y1="85" x2="502" y2="85" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="160" text-anchor="middle" dominant-baseline="central">Information available grows</text>
<line x1="40" y1="176" x2="636" y2="176" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="204" text-anchor="middle" dominant-baseline="central">Ability to prevent loss shrinks</text>
<line x1="640" y1="220" x2="44" y2="220" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>