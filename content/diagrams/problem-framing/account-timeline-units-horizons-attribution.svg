<svg width="100%" viewBox="0 0 680 280" role="img"><title>Prediction units, horizons and takeover attribution on one account</title><desc>Timeline of one account: signup, order 1, a new-device login, order 2, order 3, takeover found. Below: the account score at signup has a 30-day horizon; order 2 has a 120-day label window; the takeover period from the new-device login to discovery marks orders 2 and 3 as fraud, while order 1 stays legit.</desc>
<line x1="50" y1="150" x2="640" y2="150" stroke="var(--text-secondary)" stroke-width="0.5"/>
<g class="c-gray"><rect x="50" y="70" width="80" height="32" rx="4" stroke-width="0.5"/><text class="th" x="90" y="86" text-anchor="middle" dominant-baseline="central">Signup</text></g>
<g class="c-gray"><rect x="160" y="70" width="80" height="32" rx="4" stroke-width="0.5"/><text class="th" x="200" y="86" text-anchor="middle" dominant-baseline="central">Order 1</text></g>
<g class="c-coral"><rect x="270" y="70" width="80" height="32" rx="4" stroke-width="0.5"/><text class="th" x="310" y="86" text-anchor="middle" dominant-baseline="central">New login</text></g>
<g class="c-gray"><rect x="370" y="70" width="80" height="32" rx="4" stroke-width="0.5"/><text class="th" x="410" y="86" text-anchor="middle" dominant-baseline="central">Order 2</text></g>
<g class="c-gray"><rect x="460" y="70" width="80" height="32" rx="4" stroke-width="0.5"/><text class="th" x="500" y="86" text-anchor="middle" dominant-baseline="central">Order 3</text></g>
<g class="c-coral"><rect x="550" y="70" width="80" height="32" rx="4" stroke-width="0.5"/><text class="th" x="590" y="86" text-anchor="middle" dominant-baseline="central">ATO found</text></g>
<line x1="90" y1="104" x2="90" y2="146" stroke="var(--text-muted)" stroke-width="0.5"/>
<line x1="200" y1="104" x2="200" y2="146" stroke="var(--text-muted)" stroke-width="0.5"/>
<line x1="310" y1="104" x2="310" y2="146" stroke="var(--text-muted)" stroke-width="0.5"/>
<line x1="410" y1="104" x2="410" y2="146" stroke="var(--text-muted)" stroke-width="0.5"/>
<line x1="500" y1="104" x2="500" y2="146" stroke="var(--text-muted)" stroke-width="0.5"/>
<line x1="590" y1="104" x2="590" y2="146" stroke="var(--text-muted)" stroke-width="0.5"/>
<rect x="90" y="172" width="160" height="10" rx="2" fill="#7F77DD"/>
<text class="ts" x="260" y="177" text-anchor="start" dominant-baseline="central">Account score horizon: 30 days</text>
<rect x="410" y="202" width="230" height="10" rx="2" fill="#1D9E75"/>
<text class="ts" x="400" y="207" text-anchor="end" dominant-baseline="central">Order 2 label window: 120 days</text>
<rect x="310" y="232" width="280" height="10" rx="2" fill="#D85A30"/>
<text class="ts" x="300" y="237" text-anchor="end" dominant-baseline="central">Takeover period: orders labeled fraud</text>
</svg>