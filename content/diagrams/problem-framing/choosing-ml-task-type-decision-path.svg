<svg width="100%" viewBox="0 0 680 376" role="img"><title>Choosing the ML task type</title><desc>Three questions in sequence. If labels are not available at useful volume, use anomaly detection with rules. If the action is capacity-limited, use ranking by expected savings. If the action differs by fraud subtype, use multi-class or multi-task with one head per type. Otherwise, binary classification producing calibrated p of fraud.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="60" y="40" width="280" height="56" rx="4" stroke-width="0.5"/><text class="th" x="200" y="58" text-anchor="middle" dominant-baseline="central">Labels available?</text><text class="ts" x="200" y="80" text-anchor="middle" dominant-baseline="central">At useful volume</text></g>
<g class="c-purple"><rect x="60" y="120" width="280" height="56" rx="4" stroke-width="0.5"/><text class="th" x="200" y="138" text-anchor="middle" dominant-baseline="central">Action capacity-limited?</text><text class="ts" x="200" y="160" text-anchor="middle" dominant-baseline="central">e.g., 2,000 reviews/day</text></g>
<g class="c-purple"><rect x="60" y="200" width="280" height="56" rx="4" stroke-width="0.5"/><text class="th" x="200" y="218" text-anchor="middle" dominant-baseline="central">Action differs by subtype?</text><text class="ts" x="200" y="240" text-anchor="middle" dominant-baseline="central">Different fraud, different fix</text></g>
<g class="c-teal"><rect x="60" y="280" width="280" height="56" rx="4" stroke-width="0.5"/><text class="th" x="200" y="298" text-anchor="middle" dominant-baseline="central">Binary classification</text><text class="ts" x="200" y="320" text-anchor="middle" dominant-baseline="central">Calibrated p(fraud)</text></g>
<g class="c-teal"><rect x="400" y="40" width="240" height="56" rx="4" stroke-width="0.5"/><text class="th" x="520" y="58" text-anchor="middle" dominant-baseline="central">Anomaly detection</text><text class="ts" x="520" y="80" text-anchor="middle" dominant-baseline="central">Unsupervised, plus rules</text></g>
<g class="c-teal"><rect x="400" y="120" width="240" height="56" rx="4" stroke-width="0.5"/><text class="th" x="520" y="138" text-anchor="middle" dominant-baseline="central">Ranking / top-K</text><text class="ts" x="520" y="160" text-anchor="middle" dominant-baseline="central">Order by expected savings</text></g>
<g class="c-teal"><rect x="400" y="200" width="240" height="56" rx="4" stroke-width="0.5"/><text class="th" x="520" y="218" text-anchor="middle" dominant-baseline="central">Multi-class, multi-task</text><text class="ts" x="520" y="240" text-anchor="middle" dominant-baseline="central">One head per fraud type</text></g>
<line class="arr" x1="200" y1="98" x2="200" y2="116" marker-end="url(#arrow)"/>
<line class="arr" x1="200" y1="178" x2="200" y2="196" marker-end="url(#arrow)"/>
<line class="arr" x1="200" y1="258" x2="200" y2="276" marker-end="url(#arrow)"/>
<text class="ts" x="210" y="107" text-anchor="start" dominant-baseline="central">Yes</text>
<text class="ts" x="210" y="187" text-anchor="start" dominant-baseline="central">No</text>
<text class="ts" x="210" y="267" text-anchor="start" dominant-baseline="central">No</text>
<line class="arr" x1="342" y1="68" x2="396" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="342" y1="148" x2="396" y2="148" marker-end="url(#arrow)"/>
<line class="arr" x1="342" y1="228" x2="396" y2="228" marker-end="url(#arrow)"/>
<text class="ts" x="369" y="56" text-anchor="middle" dominant-baseline="central">No</text>
<text class="ts" x="369" y="136" text-anchor="middle" dominant-baseline="central">Yes</text>
<text class="ts" x="369" y="216" text-anchor="middle" dominant-baseline="central">Yes</text>
</svg>