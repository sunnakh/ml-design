<svg width="100%" viewBox="0 0 680 400" role="img"><title>How the policy filters which labels you observe</title><desc>All orders pass through the current policy, which splits them into approved (label observed), declined (outcome unknown, a blind spot), and a small exploration slice (randomized, propensity logged). Only approved and exploration orders flow into training data, which is weighted by one over propensity.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="240" y="40" width="200" height="52" rx="4" stroke-width="0.5"/><text class="th" x="340" y="66" text-anchor="middle" dominant-baseline="central">All orders</text></g>
<g class="c-gray"><rect x="240" y="120" width="200" height="52" rx="4" stroke-width="0.5"/><text class="th" x="340" y="137" text-anchor="middle" dominant-baseline="central">Current policy</text><text class="ts" x="340" y="157" text-anchor="middle" dominant-baseline="central">Rules or model</text></g>
<g class="c-teal"><rect x="40" y="210" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="130" y="228" text-anchor="middle" dominant-baseline="central">Approved</text><text class="ts" x="130" y="250" text-anchor="middle" dominant-baseline="central">Label observed</text></g>
<g class="c-coral"><rect x="250" y="210" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="228" text-anchor="middle" dominant-baseline="central">Declined</text><text class="ts" x="340" y="250" text-anchor="middle" dominant-baseline="central">No label: blind spot</text></g>
<g class="c-purple"><rect x="460" y="210" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="550" y="228" text-anchor="middle" dominant-baseline="central">Exploration slice</text><text class="ts" x="550" y="250" text-anchor="middle" dominant-baseline="central">Randomized, p logged</text></g>
<g class="c-teal"><rect x="200" y="320" width="280" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="338" text-anchor="middle" dominant-baseline="central">Training and evaluation data</text><text class="ts" x="340" y="360" text-anchor="middle" dominant-baseline="central">Weighted by 1 / propensity</text></g>
<line class="arr" x1="340" y1="94" x2="340" y2="116" marker-end="url(#arrow)"/>
<line class="arr" x1="300" y1="174" x2="160" y2="206" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="174" x2="340" y2="206" marker-end="url(#arrow)"/>
<line class="arr" x1="380" y1="174" x2="520" y2="206" marker-end="url(#arrow)"/>
<line class="arr" x1="130" y1="268" x2="250" y2="316" marker-end="url(#arrow)"/>
<line class="arr" x1="550" y1="268" x2="430" y2="316" marker-end="url(#arrow)"/>
</svg>