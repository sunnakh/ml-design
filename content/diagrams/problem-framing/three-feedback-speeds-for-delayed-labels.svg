<svg width="100%" viewBox="0 0 680 296" role="img"><title>Three feedback speeds</title><desc>Minutes: confirmed fraud entities such as card, device or account feed blocklists and holds for instant entity response. Days: issuer alerts and reviews, fast but partial and biased, feed monitoring and rules as early warning. Months: mature chargebacks, slow but most complete, feed retraining and final A/B readouts as ground truth.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="40" width="140" height="56" rx="4" stroke-width="0.5"/><text class="th" x="110" y="68" text-anchor="middle" dominant-baseline="central">Minutes</text></g>
<g class="c-gray"><rect x="40" y="120" width="140" height="56" rx="4" stroke-width="0.5"/><text class="th" x="110" y="148" text-anchor="middle" dominant-baseline="central">Days</text></g>
<g class="c-gray"><rect x="40" y="200" width="140" height="56" rx="4" stroke-width="0.5"/><text class="th" x="110" y="228" text-anchor="middle" dominant-baseline="central">Months</text></g>
<g class="c-purple"><rect x="220" y="40" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="320" y="58" text-anchor="middle" dominant-baseline="central">Confirmed fraud entity</text><text class="ts" x="320" y="80" text-anchor="middle" dominant-baseline="central">Card, device, account</text></g>
<g class="c-purple"><rect x="220" y="120" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="320" y="138" text-anchor="middle" dominant-baseline="central">Issuer alerts, reviews</text><text class="ts" x="320" y="160" text-anchor="middle" dominant-baseline="central">Fast, partial, biased</text></g>
<g class="c-purple"><rect x="220" y="200" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="320" y="218" text-anchor="middle" dominant-baseline="central">Mature chargebacks</text><text class="ts" x="320" y="240" text-anchor="middle" dominant-baseline="central">Slow, most complete</text></g>
<g class="c-teal"><rect x="460" y="40" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="550" y="58" text-anchor="middle" dominant-baseline="central">Blocklists, holds</text><text class="ts" x="550" y="80" text-anchor="middle" dominant-baseline="central">Instant entity response</text></g>
<g class="c-teal"><rect x="460" y="120" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="550" y="138" text-anchor="middle" dominant-baseline="central">Monitoring, rules</text><text class="ts" x="550" y="160" text-anchor="middle" dominant-baseline="central">Early warning</text></g>
<g class="c-teal"><rect x="460" y="200" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="550" y="218" text-anchor="middle" dominant-baseline="central">Retrain, final A/B</text><text class="ts" x="550" y="240" text-anchor="middle" dominant-baseline="central">Ground truth</text></g>
<line class="arr" x1="182" y1="68" x2="216" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="182" y1="148" x2="216" y2="148" marker-end="url(#arrow)"/>
<line class="arr" x1="182" y1="228" x2="216" y2="228" marker-end="url(#arrow)"/>
<line class="arr" x1="422" y1="68" x2="456" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="422" y1="148" x2="456" y2="148" marker-end="url(#arrow)"/>
<line class="arr" x1="422" y1="228" x2="456" y2="228" marker-end="url(#arrow)"/>
</svg>