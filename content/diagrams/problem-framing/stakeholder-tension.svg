<svg width="100%" viewBox="0 0 680 330" role="img"><title>Stakeholder tension resolved into one success metric</title><desc>Risk and finance push to block more orders; growth and good buyers push to approve more. Both feed a shared success metric, total cost of fraud, which is bounded below by hard limits: review capacity, regulation and latency.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-coral"><rect x="40" y="40" width="270" height="56" rx="4" stroke-width="0.5"/><text class="th" x="175" y="58" text-anchor="middle" dominant-baseline="central">Push to block more</text><text class="ts" x="175" y="80" text-anchor="middle" dominant-baseline="central">Risk, finance</text></g>
<g class="c-teal"><rect x="370" y="40" width="270" height="56" rx="4" stroke-width="0.5"/><text class="th" x="505" y="58" text-anchor="middle" dominant-baseline="central">Push to approve more</text><text class="ts" x="505" y="80" text-anchor="middle" dominant-baseline="central">Growth, good buyers</text></g>
<g class="c-purple"><rect x="190" y="150" width="300" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="168" text-anchor="middle" dominant-baseline="central">Shared success metric</text><text class="ts" x="340" y="190" text-anchor="middle" dominant-baseline="central">Total cost of fraud, in dollars</text></g>
<g class="c-gray"><rect x="40" y="250" width="600" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="268" text-anchor="middle" dominant-baseline="central">Hard limits</text><text class="ts" x="340" y="290" text-anchor="middle" dominant-baseline="central">Review capacity, regulation, latency</text></g>
<line class="arr" x1="175" y1="98" x2="255" y2="146" marker-end="url(#arrow)"/>
<line class="arr" x1="505" y1="98" x2="425" y2="146" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="248" x2="340" y2="210" marker-end="url(#arrow)"/>
</svg>