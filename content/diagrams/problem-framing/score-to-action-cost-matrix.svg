<svg width="100%" viewBox="0 0 680 430" role="img"><title>From model score to action via cost matrix</title><desc>The model outputs p of fraud; order context gives the amount. Both feed a cost matrix of actions by true state, which gives an expected cost per action, and the cheapest feasible action is chosen subject to review capacity. Purple marks the model; teal marks the decision policy.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="90" y="40" width="220" height="56" rx="4" stroke-width="0.5"/><text class="th" x="200" y="58" text-anchor="middle" dominant-baseline="central">Model score</text><text class="ts" x="200" y="80" text-anchor="middle" dominant-baseline="central">p(fraud) = 0.05</text></g>
<g class="c-gray"><rect x="370" y="40" width="220" height="56" rx="4" stroke-width="0.5"/><text class="th" x="480" y="58" text-anchor="middle" dominant-baseline="central">Order context</text><text class="ts" x="480" y="80" text-anchor="middle" dominant-baseline="central">Amount A = $200</text></g>
<g class="c-teal"><rect x="190" y="136" width="300" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="154" text-anchor="middle" dominant-baseline="central">Cost matrix</text><text class="ts" x="340" y="176" text-anchor="middle" dominant-baseline="central">Action × true state</text></g>
<g class="c-teal"><rect x="190" y="232" width="300" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="250" text-anchor="middle" dominant-baseline="central">Expected cost per action</text><text class="ts" x="340" y="272" text-anchor="middle" dominant-baseline="central">p·C(fraud) + (1−p)·C(legit)</text></g>
<g class="c-teal"><rect x="190" y="328" width="300" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="346" text-anchor="middle" dominant-baseline="central">Cheapest feasible action</text><text class="ts" x="340" y="368" text-anchor="middle" dominant-baseline="central">Subject to review capacity</text></g>
<line class="arr" x1="200" y1="98" x2="262" y2="132" marker-end="url(#arrow)"/>
<line class="arr" x1="480" y1="98" x2="418" y2="132" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="194" x2="340" y2="228" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="290" x2="340" y2="324" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="404" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="60" y="410" dominant-baseline="central">Model (ML)</text>
<g class="c-teal"><rect x="160" y="404" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="180" y="410" dominant-baseline="central">Decision policy (business)</text>
</svg>