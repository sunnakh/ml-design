<svg width="100%" viewBox="0 0 680 180" role="img"><title>Feedback loop across model generations</title><desc>The model decides and acts on orders; the world reacts, meaning users and fraudsters; data shifts in labels and features; the model is retrained on the shifted data; a return arrow marks the next generation, repeating the loop.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="40" y="40" width="135" height="56" rx="4" stroke-width="0.5"/><text class="th" x="107.5" y="58" text-anchor="middle" dominant-baseline="central">Model decides</text><text class="ts" x="107.5" y="80" text-anchor="middle" dominant-baseline="central">Acts on orders</text></g>
<g class="c-coral"><rect x="195" y="40" width="135" height="56" rx="4" stroke-width="0.5"/><text class="th" x="262.5" y="58" text-anchor="middle" dominant-baseline="central">World reacts</text><text class="ts" x="262.5" y="80" text-anchor="middle" dominant-baseline="central">Users, fraudsters</text></g>
<g class="c-coral"><rect x="350" y="40" width="135" height="56" rx="4" stroke-width="0.5"/><text class="th" x="417.5" y="58" text-anchor="middle" dominant-baseline="central">Data shifts</text><text class="ts" x="417.5" y="80" text-anchor="middle" dominant-baseline="central">Labels, features</text></g>
<g class="c-purple"><rect x="505" y="40" width="135" height="56" rx="4" stroke-width="0.5"/><text class="th" x="572.5" y="58" text-anchor="middle" dominant-baseline="central">Model retrained</text><text class="ts" x="572.5" y="80" text-anchor="middle" dominant-baseline="central">On shifted data</text></g>
<line class="arr" x1="177" y1="68" x2="191" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="332" y1="68" x2="346" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="487" y1="68" x2="501" y2="68" marker-end="url(#arrow)"/>
<path d="M572.5 98 L572.5 130 L107.5 130 L107.5 102" fill="none" stroke="var(--text-secondary)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="148" text-anchor="middle" dominant-baseline="central">Next generation: bias compounds</text>
</svg>