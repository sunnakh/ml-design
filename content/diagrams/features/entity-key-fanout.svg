<svg width="100%" viewBox="0 0 680 385" role="img"><title>Entity key fan-out for one transaction</title><desc>A transaction carries keys for card, account, device, merchant, and the card-merchant pair. Each key looks up its own entity's features.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="150" width="180" height="80" rx="4" stroke-width="0.5"/><text class="th" x="130" y="178" text-anchor="middle" dominant-baseline="central">Transaction 9812</text><text class="ts" x="130" y="200" text-anchor="middle" dominant-baseline="central">Carries 4 entity keys</text></g>
<line class="arr" x1="222" y1="190" x2="326" y2="64" marker-end="url(#arrow)"/>
<line class="arr" x1="222" y1="190" x2="326" y2="124" marker-end="url(#arrow)"/>
<line class="arr" x1="222" y1="190" x2="326" y2="184" marker-end="url(#arrow)"/>
<line class="arr" x1="222" y1="190" x2="326" y2="244" marker-end="url(#arrow)"/>
<line class="arr" x1="222" y1="190" x2="326" y2="304" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="330" y="40" width="310" height="48" rx="4" stroke-width="0.5"/><text class="th" x="485" y="56" text-anchor="middle" dominant-baseline="central">Card C77</text><text class="ts" x="485" y="75" text-anchor="middle" dominant-baseline="central">txn_count_1h, avg_amount_30d</text></g>
<g class="c-teal"><rect x="330" y="100" width="310" height="48" rx="4" stroke-width="0.5"/><text class="th" x="485" y="116" text-anchor="middle" dominant-baseline="central">Account A12</text><text class="ts" x="485" y="135" text-anchor="middle" dominant-baseline="central">account_age, cards_on_account</text></g>
<g class="c-teal"><rect x="330" y="160" width="310" height="48" rx="4" stroke-width="0.5"/><text class="th" x="485" y="176" text-anchor="middle" dominant-baseline="central">Device D3</text><text class="ts" x="485" y="195" text-anchor="middle" dominant-baseline="central">distinct_cards_24h on device</text></g>
<g class="c-teal"><rect x="330" y="220" width="310" height="48" rx="4" stroke-width="0.5"/><text class="th" x="485" y="236" text-anchor="middle" dominant-baseline="central">Merchant M5</text><text class="ts" x="485" y="255" text-anchor="middle" dominant-baseline="central">chargeback_rate_90d, volume</text></g>
<g class="c-coral"><rect x="330" y="280" width="310" height="48" rx="4" stroke-width="0.5"/><text class="th" x="485" y="296" text-anchor="middle" dominant-baseline="central">Card × merchant (C77, M5)</text><text class="ts" x="485" y="315" text-anchor="middle" dominant-baseline="central">first_time_at_merchant</text></g>
<g class="c-teal"><rect x="40" y="350" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="60" y="356" dominant-baseline="central">Single entity key</text>
<g class="c-coral"><rect x="200" y="350" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="220" y="356" dominant-baseline="central">Composite key</text>
</svg>