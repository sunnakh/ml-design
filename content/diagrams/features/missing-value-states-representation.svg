<svg width="100%" viewBox="0 0 680 336" role="img"><title>Four states of a count feature and how to represent them</title><desc>For count_30d on a card: an observed value of 12 maps to 12 with has_history 1; a true zero on an active card maps to 0 with has_history 1; a card opened today maps to NaN with has_history 0 and backoff features; a feature store timeout maps to NaN with fetch_failed 1 and a fallback policy.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="40" width="260" height="56" rx="4" stroke-width="0.5"/><text class="th" x="170" y="58" text-anchor="middle" dominant-baseline="central">Observed: 12 txns</text><text class="ts" x="170" y="80" text-anchor="middle" dominant-baseline="central">Normal case</text></g>
<g class="c-gray"><rect x="40" y="110" width="260" height="56" rx="4" stroke-width="0.5"/><text class="th" x="170" y="128" text-anchor="middle" dominant-baseline="central">True zero</text><text class="ts" x="170" y="150" text-anchor="middle" dominant-baseline="central">Active card, no recent txns</text></g>
<g class="c-gray"><rect x="40" y="180" width="260" height="56" rx="4" stroke-width="0.5"/><text class="th" x="170" y="198" text-anchor="middle" dominant-baseline="central">No history</text><text class="ts" x="170" y="220" text-anchor="middle" dominant-baseline="central">Card opened today</text></g>
<g class="c-gray"><rect x="40" y="250" width="260" height="56" rx="4" stroke-width="0.5"/><text class="th" x="170" y="268" text-anchor="middle" dominant-baseline="central">Fetch failed</text><text class="ts" x="170" y="290" text-anchor="middle" dominant-baseline="central">Feature store timeout</text></g>
<line class="arr" x1="302" y1="68" x2="356" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="302" y1="138" x2="356" y2="138" marker-end="url(#arrow)"/>
<line class="arr" x1="302" y1="208" x2="356" y2="208" marker-end="url(#arrow)"/>
<line class="arr" x1="302" y1="278" x2="356" y2="278" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="360" y="40" width="280" height="56" rx="4" stroke-width="0.5"/><text class="th" x="500" y="58" text-anchor="middle" dominant-baseline="central">count_30d = 12</text><text class="ts" x="500" y="80" text-anchor="middle" dominant-baseline="central">has_history = 1</text></g>
<g class="c-teal"><rect x="360" y="110" width="280" height="56" rx="4" stroke-width="0.5"/><text class="th" x="500" y="128" text-anchor="middle" dominant-baseline="central">count_30d = 0</text><text class="ts" x="500" y="150" text-anchor="middle" dominant-baseline="central">has_history = 1</text></g>
<g class="c-teal"><rect x="360" y="180" width="280" height="56" rx="4" stroke-width="0.5"/><text class="th" x="500" y="198" text-anchor="middle" dominant-baseline="central">count_30d = NaN</text><text class="ts" x="500" y="220" text-anchor="middle" dominant-baseline="central">has_history = 0, plus backoff features</text></g>
<g class="c-coral"><rect x="360" y="250" width="280" height="56" rx="4" stroke-width="0.5"/><text class="th" x="500" y="268" text-anchor="middle" dominant-baseline="central">count_30d = NaN</text><text class="ts" x="500" y="290" text-anchor="middle" dominant-baseline="central">fetch_failed = 1, fallback policy</text></g>
</svg>