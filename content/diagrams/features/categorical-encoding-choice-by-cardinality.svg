<svg width="100%" viewBox="0 0 680 370" role="img"><title>Choosing a categorical encoding by cardinality</title><desc>A categorical feature branches by cardinality. Low cardinality under about 50 values, like channel, uses one-hot. Medium, 50 to 10 thousand values like MCC and country, uses time-safe smoothed target encoding or native categorical support. High, above 10 thousand values like merchant ID and BIN, uses hashing or learned embeddings. In every case keep an out-of-vocabulary bucket, group rare values, and version the vocabulary.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="250" y="30" width="180" height="44" rx="4" stroke-width="0.5"/><text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">Categorical feature</text></g>
<line class="arr" x1="300" y1="76" x2="140" y2="108" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="76" x2="340" y2="108" marker-end="url(#arrow)"/>
<line class="arr" x1="380" y1="76" x2="540" y2="108" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="110" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="130" y="128" text-anchor="middle" dominant-baseline="central">Low: under ~50</text><text class="ts" x="130" y="150" text-anchor="middle" dominant-baseline="central">channel, entry mode</text></g>
<g class="c-gray"><rect x="250" y="110" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="128" text-anchor="middle" dominant-baseline="central">Medium: 50 to 10k</text><text class="ts" x="340" y="150" text-anchor="middle" dominant-baseline="central">MCC, country</text></g>
<g class="c-gray"><rect x="460" y="110" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="550" y="128" text-anchor="middle" dominant-baseline="central">High: 10k and up</text><text class="ts" x="550" y="150" text-anchor="middle" dominant-baseline="central">merchant_id, BIN</text></g>
<line class="arr" x1="130" y1="168" x2="130" y2="198" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="168" x2="340" y2="198" marker-end="url(#arrow)"/>
<line class="arr" x1="550" y1="168" x2="550" y2="198" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="200" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="130" y="218" text-anchor="middle" dominant-baseline="central">One-hot</text><text class="ts" x="130" y="240" text-anchor="middle" dominant-baseline="central">Simple, interpretable</text></g>
<g class="c-teal"><rect x="250" y="200" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="218" text-anchor="middle" dominant-baseline="central">Target encoding</text><text class="ts" x="340" y="240" text-anchor="middle" dominant-baseline="central">Time-safe, smoothed</text></g>
<g class="c-teal"><rect x="460" y="200" width="180" height="56" rx="4" stroke-width="0.5"/><text class="th" x="550" y="218" text-anchor="middle" dominant-baseline="central">Hashing / embedding</text><text class="ts" x="550" y="240" text-anchor="middle" dominant-baseline="central">Fixed size, OOV-safe</text></g>
<g class="c-coral"><rect x="40" y="290" width="600" height="50" rx="4" stroke-width="0.5"/><text class="th" x="340" y="307" text-anchor="middle" dominant-baseline="central">Always: unknown bucket, rare values grouped, vocab versioned</text><text class="ts" x="340" y="326" text-anchor="middle" dominant-baseline="central">New merchants arrive daily; serving must never crash or guess</text></g>
</svg>