<svg width="100%" viewBox="0 0 680 390" role="img"><title>Features stage subtopics</title><desc>The features stage splits into two groups. What to compute: feature types, transformations, feature selection. How to serve it: freshness, feature store, skew and leakage.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="250" y="30" width="180" height="44" rx="4" stroke-width="0.5"/><text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">Features</text></g>
<line class="arr" x1="340" y1="76" x2="340" y2="106" marker-end="url(#arrow)"/>
<rect x="30" y="110" width="620" height="110" rx="8" fill="none" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="46" y="128" dominant-baseline="central">What to compute</text>
<g class="node c-teal"><rect x="45" y="145" width="180" height="60" rx="4" stroke-width="0.5"/><text class="th" x="135" y="165" text-anchor="middle" dominant-baseline="central">Feature types</text><text class="ts" x="135" y="187" text-anchor="middle" dominant-baseline="central">User, item, context</text></g>
<g class="node c-teal"><rect x="250" y="145" width="180" height="60" rx="4" stroke-width="0.5"/><text class="th" x="340" y="165" text-anchor="middle" dominant-baseline="central">Transformations</text><text class="ts" x="340" y="187" text-anchor="middle" dominant-baseline="central">Scale, encode, embed</text></g>
<g class="node c-teal"><rect x="455" y="145" width="180" height="60" rx="4" stroke-width="0.5"/><text class="th" x="545" y="165" text-anchor="middle" dominant-baseline="central">Feature selection</text><text class="ts" x="545" y="187" text-anchor="middle" dominant-baseline="central">Importance, ablation</text></g>
<line class="arr" x1="340" y1="222" x2="340" y2="246" marker-end="url(#arrow)"/>
<rect x="30" y="250" width="620" height="110" rx="8" fill="none" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="46" y="268" dominant-baseline="central">How to serve it</text>
<g class="node c-coral"><rect x="45" y="285" width="180" height="60" rx="4" stroke-width="0.5"/><text class="th" x="135" y="305" text-anchor="middle" dominant-baseline="central">Freshness</text><text class="ts" x="135" y="327" text-anchor="middle" dominant-baseline="central">Batch, stream, request</text></g>
<g class="node c-coral"><rect x="250" y="285" width="180" height="60" rx="4" stroke-width="0.5"/><text class="th" x="340" y="305" text-anchor="middle" dominant-baseline="central">Feature store</text><text class="ts" x="340" y="327" text-anchor="middle" dominant-baseline="central">Offline + online</text></g>
<g class="node c-coral"><rect x="455" y="285" width="180" height="60" rx="4" stroke-width="0.5"/><text class="th" x="545" y="305" text-anchor="middle" dominant-baseline="central">Skew and leakage</text><text class="ts" x="545" y="327" text-anchor="middle" dominant-baseline="central">Train vs serve gaps</text></g>
</svg>