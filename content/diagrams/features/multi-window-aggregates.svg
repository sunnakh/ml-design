<svg width="100%" viewBox="0 0 680 330" role="img"><title>Nested time windows for behavioral aggregates</title><desc>Four windows all ending at decision time t: 10 minutes, 1 hour, 24 hours, 30 days, on a log-scaled time axis. Counts are 4, 5, 6 and 40. Comparing the 10-minute count to the 30-day baseline rate gives a burst ratio of about 430 times.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="600" y="32" text-anchor="middle" dominant-baseline="central">t, current txn</text>
<rect class="c-teal" x="540" y="48" width="58" height="24" rx="3" stroke-width="0.5"/>
<text class="ts" x="532" y="60" text-anchor="end" dominant-baseline="central">count_10m = 4</text>
<rect class="c-teal" x="450" y="80" width="148" height="24" rx="3" stroke-width="0.5"/>
<text class="ts" x="442" y="92" text-anchor="end" dominant-baseline="central">count_1h = 5</text>
<rect class="c-teal" x="300" y="112" width="298" height="24" rx="3" stroke-width="0.5"/>
<text class="ts" x="292" y="124" text-anchor="end" dominant-baseline="central">count_24h = 6</text>
<g class="c-teal"><rect x="60" y="144" width="538" height="24" rx="3" stroke-width="0.5"/><text class="ts" x="72" y="156" dominant-baseline="central">count_30d = 40</text></g>
<line x1="600" y1="44" x2="600" y2="200" stroke="var(--text-primary)" stroke-width="1"/>
<line class="arr" x1="40" y1="190" x2="640" y2="190" marker-end="url(#arrow)"/>
<circle class="c-gray" cx="80" cy="190" r="4" stroke-width="0.5"/>
<circle class="c-gray" cx="112" cy="190" r="4" stroke-width="0.5"/>
<circle class="c-gray" cx="140" cy="190" r="4" stroke-width="0.5"/>
<circle class="c-gray" cx="175" cy="190" r="4" stroke-width="0.5"/>
<circle class="c-gray" cx="205" cy="190" r="4" stroke-width="0.5"/>
<circle class="c-gray" cx="238" cy="190" r="4" stroke-width="0.5"/>
<circle class="c-gray" cx="270" cy="190" r="4" stroke-width="0.5"/>
<circle class="c-gray" cx="380" cy="190" r="4" stroke-width="0.5"/>
<circle class="c-gray" cx="495" cy="190" r="4" stroke-width="0.5"/>
<circle class="c-gray" cx="550" cy="190" r="4" stroke-width="0.5"/>
<circle class="c-gray" cx="562" cy="190" r="4" stroke-width="0.5"/>
<circle class="c-gray" cx="574" cy="190" r="4" stroke-width="0.5"/>
<circle class="c-gray" cx="586" cy="190" r="4" stroke-width="0.5"/>
<circle class="c-coral" cx="600" cy="190" r="6" stroke-width="0.5"/>
<text class="ts" x="60" y="212" text-anchor="middle" dominant-baseline="central">−30d</text>
<text class="ts" x="300" y="212" text-anchor="middle" dominant-baseline="central">−24h</text>
<text class="ts" x="450" y="212" text-anchor="middle" dominant-baseline="central">−1h</text>
<text class="ts" x="540" y="212" text-anchor="middle" dominant-baseline="central">−10m</text>
<text class="ts" x="40" y="236" dominant-baseline="central">Log-scaled time; dots illustrative</text>
<g class="c-coral"><rect x="170" y="258" width="340" height="52" rx="4" stroke-width="0.5"/><text class="th" x="340" y="276" text-anchor="middle" dominant-baseline="central">Burst ratio ≈ 430×</text><text class="ts" x="340" y="296" text-anchor="middle" dominant-baseline="central">count_10m vs 30-day rate per 10 min</text></g>
</svg>