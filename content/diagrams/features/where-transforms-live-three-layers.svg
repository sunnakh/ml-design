<svg width="100%" viewBox="0 0 680 334" role="img"><title>Where transforms live</title><desc>Training and serving both call the same three components. The feature store holds stateful transforms such as aggregates, target encoding and graph features. A shared transform library holds stateless shared logic such as key normalization, text cleanup and local hour. The model artifact holds fitted model-specific transforms such as scalers, vocabularies and bin edges.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="60" width="135" height="244" rx="4" stroke-width="0.5"/><text class="th" x="107.5" y="170" text-anchor="middle" dominant-baseline="central">Training</text><text class="ts" x="107.5" y="192" text-anchor="middle" dominant-baseline="central">Batch, millions</text></g>
<g class="c-gray"><rect x="505" y="60" width="135" height="244" rx="4" stroke-width="0.5"/><text class="th" x="572.5" y="170" text-anchor="middle" dominant-baseline="central">Serving</text><text class="ts" x="572.5" y="192" text-anchor="middle" dominant-baseline="central">One row, ms</text></g>
<g class="c-teal"><rect x="215" y="60" width="250" height="64" rx="4" stroke-width="0.5"/><text class="th" x="340" y="82" text-anchor="middle" dominant-baseline="central">Feature store</text><text class="ts" x="340" y="104" text-anchor="middle" dominant-baseline="central">Stateful: aggregates, TE, graph</text></g>
<g class="c-teal"><rect x="215" y="150" width="250" height="64" rx="4" stroke-width="0.5"/><text class="th" x="340" y="172" text-anchor="middle" dominant-baseline="central">Shared transform library</text><text class="ts" x="340" y="194" text-anchor="middle" dominant-baseline="central">Stateless: keys, text, local hour</text></g>
<g class="c-teal"><rect x="215" y="240" width="250" height="64" rx="4" stroke-width="0.5"/><text class="th" x="340" y="262" text-anchor="middle" dominant-baseline="central">Model artifact</text><text class="ts" x="340" y="284" text-anchor="middle" dominant-baseline="central">Fitted: scalers, vocab, bins</text></g>
<line class="arr" x1="177" y1="92" x2="211" y2="92" marker-end="url(#arrow)"/>
