<svg width="100%" viewBox="0 0 680 400" role="img"><title>Unstructured text to fraud features</title><desc>A merchant descriptor string goes down two paths. Hand-crafted string statistics like length, digit ratio and entropy go straight to the fraud model. A pretrained encoder, run in batch and cached by text hash, produces a 384-dimensional vector that is reduced to a few features such as similarity to known scam descriptors and an 8-dimension PCA, then fed to the fraud model.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="240" y="30" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">Merchant descriptor</text><text class="ts" x="340" y="70" text-anchor="middle" dominant-baseline="central">e.g. PAYPAL *GIFTCRD99</text></g>
<line class="arr" x1="300" y1="88" x2="190" y2="126" marker-end="url(#arrow)"/>
<line class="arr" x1="380" y1="88" x2="490" y2="126" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="60" y="130" width="220" height="56" rx="4" stroke-width="0.5"/><text class="th" x="170" y="148" text-anchor="middle" dominant-baseline="central">String stats</text><text class="ts" x="170" y="170" text-anchor="middle" dominant-baseline="central">Length, digits, entropy</text></g>
<g class="c-coral"><rect x="400" y="130" width="220" height="56" rx="4" stroke-width="0.5"/><text class="th" x="510" y="148" text-anchor="middle" dominant-baseline="central">Pretrained encoder</text><text class="ts" x="510" y="170" text-anchor="middle" dominant-baseline="central">Batch, cached by text hash</text></g>
<line class="arr" x1="510" y1="188" x2="510" y2="216" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="400" y="220" width="220" height="56" rx="4" stroke-width="0.5"/><text class="th" x="510" y="238" text-anchor="middle" dominant-baseline="central">Reduce to few dims</text><text class="ts" x="510" y="260" text-anchor="middle" dominant-baseline="central">Scam similarity, PCA 8</text></g>
<line class="arr" x1="170" y1="188" x2="290" y2="308" marker-end="url(#arrow)"/>
<line class="arr" x1="510" y1="278" x2="390" y2="308" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="240" y="310" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="340" y="328" text-anchor="middle" dominant-baseline="central">Fraud model inputs</text><text class="ts" x="340" y="350" text-anchor="middle" dominant-baseline="central">Small, dense, versioned</text></g>
<g class="c-teal"><rect x="40" y="378" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="60" y="384" dominant-baseline="central">Hand-crafted</text>
<g class="c-coral"><rect x="160" y="378" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="180" y="384" dominant-baseline="central">Learned</text>
</svg>