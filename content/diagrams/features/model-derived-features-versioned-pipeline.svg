<svg width="100%" viewBox="0 0 680 346" role="img"><title>Model-derived features pipeline</title><desc>Three upstream models, a merchant embedding at version 3 updated daily, a sequence encoder at version 7 computed online, and an opaque vendor risk score, write into a feature store keyed by entity and version. The fraud model is trained on those exact versions. Upgrading an upstream model without retraining downstream shifts the vector space and silently breaks the fraud model.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="40" y="40" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="140" y="58" text-anchor="middle" dominant-baseline="central">Merchant embedding</text><text class="ts" x="140" y="80" text-anchor="middle" dominant-baseline="central">v3, daily batch</text></g>
<g class="c-teal"><rect x="40" y="110" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="140" y="128" text-anchor="middle" dominant-baseline="central">Sequence encoder</text><text class="ts" x="140" y="150" text-anchor="middle" dominant-baseline="central">v7, online per request</text></g>
<g class="c-teal"><rect x="40" y="180" width="200" height="56" rx="4" stroke-width="0.5"/><text class="th" x="140" y="198" text-anchor="middle" dominant-baseline="central">Vendor risk score</text><text class="ts" x="140" y="220" text-anchor="middle" dominant-baseline="central">External, opaque</text></g>
<line class="arr" x1="242" y1="68" x2="288" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="242" y1="138" x2="288" y2="138" marker-end="url(#arrow)"/>
<line class="arr" x1="242" y1="208" x2="288" y2="208" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="290" y="40" width="170" height="196" rx="4" stroke-width="0.5"/><text class="th" x="375" y="128" text-anchor="middle" dominant-baseline="central">Feature store</text><text class="ts" x="375" y="150" text-anchor="middle" dominant-baseline="central">Keyed by entity + version</text></g>
<line class="arr" x1="462" y1="138" x2="498" y2="138" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="500" y="106" width="140" height="64" rx="4" stroke-width="0.5"/><text class="th" x="570" y="126" text-anchor="middle" dominant-baseline="central">Fraud model</text><text class="ts" x="570" y="150" text-anchor="middle" dominant-baseline="central">Trained on v3 + v7</text></g>
<g class="c-coral"><rect x="40" y="262" width="600" height="54" rx="4" stroke-width="0.5"/><text class="th" x="340" y="280" text-anchor="middle" dominant-baseline="central">Upstream bumps to v4, downstream not retrained</text><text class="ts" x="340" y="300" text-anchor="middle" dominant-baseline="central">Vector space shifts; fraud model silently reads garbage</text></g>
</svg>