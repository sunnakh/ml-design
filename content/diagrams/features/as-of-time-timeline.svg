<svg width="100%" viewBox="0 0 680 340" role="img"><title>Feature as a function of entity and as-of time</title><desc>Timeline of one card's transactions. Everything before time t is known and may be used; a one-hour window before t feeds a count feature. The chargeback label arrives in the future after t and must never be used as a feature.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="480" y="72" text-anchor="middle" dominant-baseline="central">t = 02:14, txn arrives</text>
<rect x="40" y="90" width="436" height="110" rx="8" fill="none" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="54" y="108" dominant-baseline="central">Known at t: allowed</text>
<rect x="484" y="90" width="156" height="110" rx="8" fill="none" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="498" y="108" dominant-baseline="central">Future: forbidden</text>
<rect x="385" y="138" width="88" height="44" rx="4" fill="none" stroke="#1D9E75" stroke-width="1" stroke-dasharray="3 2"/>
<text class="ts" x="429" y="127" text-anchor="middle" dominant-baseline="central">1h window</text>
<line class="arr" x1="50" y1="160" x2="632" y2="160" marker-end="url(#arrow)"/>
<circle class="c-teal" cx="80" cy="160" r="5" stroke-width="0.5"/>
<circle class="c-teal" cx="150" cy="160" r="5" stroke-width="0.5"/>
<circle class="c-teal" cx="215" cy="160" r="5" stroke-width="0.5"/>
<circle class="c-teal" cx="290" cy="160" r="5" stroke-width="0.5"/>
<circle class="c-teal" cx="398" cy="160" r="5" stroke-width="0.5"/>
<circle class="c-teal" cx="420" cy="160" r="5" stroke-width="0.5"/>
<circle class="c-teal" cx="440" cy="160" r="5" stroke-width="0.5"/>
<circle class="c-teal" cx="458" cy="160" r="5" stroke-width="0.5"/>
<text class="ts" x="60" y="184" dominant-baseline="central">Card C77 history</text>
<circle class="c-coral" cx="575" cy="160" r="6" stroke-width="0.5"/>
<text class="ts" x="575" y="184" text-anchor="middle" dominant-baseline="central">Chargeback, t+45d</text>
<line x1="480" y1="86" x2="480" y2="230" stroke="var(--text-primary)" stroke-width="1"/>
<line class="arr" x1="429" y1="184" x2="429" y2="246" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="250" y="250" width="300" height="56" rx="4" stroke-width="0.5"/><text class="th" x="400" y="268" text-anchor="middle" dominant-baseline="central">txn_count_1h(C77, t) = 4</text><text class="ts" x="400" y="290" text-anchor="middle" dominant-baseline="central">Only data with timestamp before t</text></g>
</svg>