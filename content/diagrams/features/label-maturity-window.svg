<svg width="100%" viewBox="0 0 680 200" role="img"><title>Label maturity window</title><desc>Transactions older than 90 days have matured labels and are used for training. Transactions in the last 90 days are in the label window, where chargebacks are still arriving, so their labels are incomplete.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="480" y="44" text-anchor="middle" dominant-baseline="central">today − 90d</text>
<text class="ts" x="640" y="44" text-anchor="end" dominant-baseline="central">today</text>
<g class="c-teal"><rect x="40" y="60" width="436" height="60" rx="4" stroke-width="0.5"/><text class="th" x="258" y="80" text-anchor="middle" dominant-baseline="central">Labels matured</text><text class="ts" x="258" y="102" text-anchor="middle" dominant-baseline="central">Train and validate here</text></g>
<g class="c-coral"><rect x="484" y="60" width="156" height="60" rx="4" stroke-width="0.5"/><text class="th" x="562" y="80" text-anchor="middle" dominant-baseline="central">Label window</text><text class="ts" x="562" y="102" text-anchor="middle" dominant-baseline="central">Chargebacks pending</text></g>
<line x1="480" y1="54" x2="480" y2="130" stroke="var(--text-primary)" stroke-width="1"/>
<line class="arr" x1="40" y1="146" x2="636" y2="146" marker-end="url(#arrow)"/>
<text class="ts" x="40" y="168" dominant-baseline="central">Transaction time</text>
</svg>